<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Canzoniere San Marco — bozza grafica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Manrope';font-weight:200 800;font-display:swap;src:url('../../public/fonts/manrope-latin.woff2') format('woff2')}
@font-face{font-family:'Manrope';font-weight:200 800;font-display:swap;src:url('../../public/fonts/manrope-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA,U+1E00-1EFF}

/* ---------- Token ---------- */
:root{
  --bg:#f7f5f0; --surface:#ffffff; --surface-2:#f0ede5; --sunken:#ebe7dd;
  --ink:#1b1d24; --ink-2:#4b4f5c; --ink-3:#8a8d98; --line:#e3dfd4; --line-2:#d6d1c4;
  --navy:#16233d; --gold:#b8913a; --gold-soft:#f3e8cc;
  --chord:#9a1b38; --chord-bg:rgba(154,27,56,.07);
  --accent:#16233d; --accent-ink:#fff;
  --shadow:0 1px 2px rgba(22,35,61,.05),0 8px 24px -8px rgba(22,35,61,.12);
  --shadow-lg:0 20px 50px -12px rgba(22,35,61,.28);
  --r:14px; --r-sm:10px;
  --serif:'Fraunces',Georgia,serif; --sans:'Manrope',system-ui,sans-serif;
  /* colori momenti liturgici */
  --m-ingresso:#2f6f8f; --m-gloria:#b8913a; --m-vangelo:#6b5bb5; --m-offertorio:#3f7a52;
  --m-santo:#b8913a; --m-comunione:#9a1b38; --m-finale:#2f6f8f; --m-meditazione:#7a6a52;
  --m-mariano:#3d63b8; --m-tempo:#6b5bb5; --m-altro:#8a8d98;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141f; --surface:#161c2a; --surface-2:#1c2333; --sunken:#0b0f18;
  --ink:#eef0f5; --ink-2:#b4b9c7; --ink-3:#7c8395; --line:#252d3f; --line-2:#323b50;
  --gold:#e0bc6a; --gold-soft:rgba(224,188,106,.14);
  --chord:#f0a35e; --chord-bg:rgba(240,163,94,.1);
  --accent:#e0bc6a; --accent-ink:#141a26;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -8px rgba(0,0,0,.5);
  --shadow-lg:0 20px 50px -12px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --bg:#0f141f; --surface:#161c2a; --surface-2:#1c2333; --sunken:#0b0f18;
  --ink:#eef0f5; --ink-2:#b4b9c7; --ink-3:#7c8395; --line:#252d3f; --line-2:#323b50;
  --gold:#e0bc6a; --gold-soft:rgba(224,188,106,.14);
  --chord:#f0a35e; --chord-bg:rgba(240,163,94,.1);
  --accent:#e0bc6a; --accent-ink:#141a26;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -8px rgba(0,0,0,.5);
  --shadow-lg:0 20px 50px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Layout ---------- */
.shell{display:grid;grid-template-columns:380px minmax(0,1fr);min-height:100vh}
.side{min-width:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--surface)}
.main{min-width:0}

/* Brand */
.brand{display:flex;align-items:center;gap:.75rem;padding:1.25rem 1.25rem .9rem}
.mark{width:38px;height:38px;border-radius:11px;background:var(--navy);display:grid;place-items:center;color:#e0bc6a;flex:none;box-shadow:inset 0 0 0 1px rgba(224,188,106,.35)}
.mark svg{width:20px;height:20px}
.brand h1{font-family:var(--serif);font-weight:600;font-size:1.22rem;margin:0;letter-spacing:-.01em;line-height:1.1}
.brand p{margin:.1rem 0 0;font-size:.74rem;color:var(--ink-3)}
.brand .spacer{flex:1}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid transparent;background:transparent;display:grid;place-items:center;color:var(--ink-2);transition:background .15s,color .15s}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn.on{color:var(--gold)}

/* Search */
.search{position:relative;margin:0 1.25rem}
.search input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:0 3.2rem 0 2.6rem;font-size:16px;outline:none;transition:border-color .15s,background .15s,box-shadow .15s}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{background:var(--surface);border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.search .i{position:absolute;left:.8rem;top:13px;color:var(--ink-3)}
.search kbd{position:absolute;right:.65rem;top:12px;font:600 .7rem var(--sans);color:var(--ink-3);border:1px solid var(--line-2);border-radius:6px;padding:.12rem .38rem;background:var(--surface)}

/* Tabs */
.seg{display:flex;gap:.25rem;margin:.9rem 1.25rem 0;padding:.25rem;background:var(--surface-2);border-radius:12px}
.seg button{flex:1;height:34px;border:0;border-radius:9px;background:transparent;font-size:.82rem;font-weight:600;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:.35rem}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg .count{font-size:.7rem;color:var(--ink-3);font-weight:600}

/* Chips momenti */
.chips-wrap{position:relative}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding:.85rem 1.25rem .75rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:.4rem;height:32px;padding:0 .75rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.78rem;font-weight:600;color:var(--ink-2);white-space:nowrap;transition:all .15s}
.chip:hover{border-color:var(--line-2);color:var(--ink)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--c,var(--ink-3))}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on .dot{background:currentColor}

/* Lista */
.list-head{display:flex;align-items:baseline;justify-content:space-between;padding:.25rem 1.25rem .4rem;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.list{list-style:none;margin:0;padding:0 .65rem 1.5rem;overflow-y:auto;flex:1}
.letter{position:sticky;top:0;z-index:1;background:linear-gradient(var(--surface) 70%,transparent);padding:.55rem .65rem .25rem;font-family:var(--serif);font-size:.95rem;color:var(--gold);font-weight:600}
.row{display:flex;align-items:center;gap:.8rem;width:100%;padding:.6rem .65rem;border:0;border-radius:12px;background:transparent;text-align:left;transition:background .12s}
.row:hover{background:var(--surface-2)}
.row.on{background:var(--gold-soft)}
.row .n{flex:none;width:2.1rem;font-variant-numeric:tabular-nums;font-size:.74rem;font-weight:700;color:var(--ink-3);text-align:right}
.row.on .n{color:var(--gold)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:.98rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:flex;gap:.45rem;align-items:center;margin-top:.15rem;font-size:.75rem;color:var(--ink-3);white-space:nowrap;overflow:hidden}
.row .tags{display:flex;gap:3px;flex:none}
.row .tags i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.row .fav{flex:none;color:var(--gold);opacity:0}
.row .fav.on{opacity:1}
.empty{padding:2rem 1rem;text-align:center;color:var(--ink-3);font-size:.9rem}
mark{background:var(--gold-soft);color:inherit;border-radius:3px;padding:0 .1em}

.side-foot{display:flex;align-items:center;gap:.5rem;padding:.75rem 1.25rem;border-top:1px solid var(--line);font-size:.74rem;color:var(--ink-3)}
.side-foot .ok{width:7px;height:7px;border-radius:50%;background:#3f9a5c;box-shadow:0 0 0 3px rgba(63,154,92,.18)}

/* ---------- Canto ---------- */
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:.5rem;padding:.75rem clamp(1rem,4vw,3rem);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar .back{display:none}
.crumb{font-size:.8rem;color:var(--ink-3);font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s}
.topbar.scrolled .crumb{opacity:1}
.crumb b{color:var(--ink)}

.song{max-width:820px;margin:0 auto;padding:1.2rem clamp(1rem,4vw,3rem) 9rem}
.song-hero{padding:1.2rem 0 1.6rem;border-bottom:1px solid var(--line);margin-bottom:1.6rem}
.eyebrow{display:flex;align-items:center;gap:.6rem;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.eyebrow .num{color:var(--gold)}
.song-hero h2{font-family:var(--serif);font-weight:600;font-size:clamp(2rem,5vw,3.1rem);line-height:1.05;letter-spacing:-.02em;margin:.5rem 0 .35rem}
.song-hero .author{font-size:1rem;color:var(--ink-2);margin:0}
.meta{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:1.1rem}
.pill{display:inline-flex;align-items:center;gap:.4rem;height:30px;padding:0 .7rem;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.78rem;font-weight:600;color:var(--ink-2)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.pill.key{color:var(--chord);background:var(--chord-bg);border-color:transparent}
.pill.capo{color:var(--ink);background:var(--gold-soft);border-color:transparent}

/* Sezioni: etichetta nel margine su desktop */
.sec{display:grid;grid-template-columns:120px minmax(0,1fr);gap:1.25rem;margin-bottom:1.6rem}
.sec-label{padding-top:calc(var(--fs)*1.45);font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:right}
.sec.chorus .sec-label{color:var(--gold)}
.sec.chorus .sec-body{border-left:3px solid var(--gold);padding-left:1.1rem;margin-left:-1.1rem}
.sec-body{font-size:var(--fs);min-width:0}
.ln{display:flex;flex-wrap:wrap;align-items:flex-end;margin-bottom:.15em}
.seg-w{display:inline-flex;flex-direction:column;white-space:pre}
.ch{padding-right:.55em;font-weight:700;font-size:.82em;color:var(--chord);line-height:1.3;min-height:1.3em;letter-spacing:.01em}
.ly{font-weight:500;line-height:1.55}
.ln.only-chords .ly{display:none}
.lyrics-only .ch{display:none}
.lyrics-only .ln.only-chords{display:none}
.lyrics-only .ln{margin-bottom:0}

/* Barra strumenti flottante */
.dock{position:fixed;left:calc(380px + (100vw - 380px)/2);transform:translateX(-50%);bottom:calc(1.25rem + env(safe-area-inset-bottom));z-index:20;display:flex;align-items:center;gap:.25rem;padding:.4rem;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-lg)}
.dock .grp{display:flex;align-items:center;gap:.1rem;padding:0 .2rem}
.dock .sep{width:1px;height:26px;background:var(--line)}
.dock button{height:40px;min-width:40px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;font-weight:700;color:var(--ink-2);padding:0 .55rem;transition:background .12s}
.dock button:hover{background:var(--surface-2);color:var(--ink)}
.dock button.on{background:var(--accent);color:var(--accent-ink)}
.dock .val{min-width:3.4rem;text-align:center;font-size:.82rem;font-weight:700;line-height:1.1}
.dock .val small{display:block;font-size:.62rem;font-weight:600;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase}
.dock .val.key{color:var(--chord)}

/* Setlist nav */
.next{display:flex;align-items:center;gap:1rem;margin-top:2.5rem;padding:1rem 1.2rem;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);text-decoration:none;color:inherit;box-shadow:var(--shadow);width:100%;text-align:left}
.next:hover{border-color:var(--line-2)}
.next small{display:block;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.next b{font-family:var(--serif);font-weight:600;font-size:1.2rem}
.next .grow{flex:1}

/* Home (nessun canto) */
.home{max-width:820px;margin:0 auto;padding:3rem clamp(1rem,4vw,3rem) 6rem}
.home h2{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,4vw,2.6rem);letter-spacing:-.02em;margin:.4rem 0 .5rem;line-height:1.1}
.home .lead{color:var(--ink-2);margin:0 0 2rem;font-size:1.02rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.75rem}
.card{position:relative;overflow:hidden;padding:1rem;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s,box-shadow .15s,border-color .15s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line-2)}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c)}
.card b{font-size:1rem;font-weight:700}
.card small{font-size:.76rem;color:var(--ink-3)}
.card .n{font-family:var(--serif);font-size:1.6rem;font-weight:600;color:var(--c);line-height:1}
.home h3{font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:2.4rem 0 .8rem}
.setlist-card{display:flex;align-items:center;gap:1rem;padding:1rem 1.1rem;border-radius:var(--r);background:var(--navy);color:#fff;border:0;width:100%;text-align:left}
.setlist-card .ic{width:44px;height:44px;border-radius:12px;background:rgba(224,188,106,.16);color:#e0bc6a;display:grid;place-items:center;flex:none}
.setlist-card b{font-size:1.02rem}
.setlist-card small{display:block;color:rgba(255,255,255,.6);font-size:.78rem;margin-top:.15rem}
.setlist-card .grow{flex:1}

/* Bottom nav mobile */
.tabbar{display:none}

/* ---------- Mobile ---------- */
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{min-width:0}
  .side{position:static;height:auto;border-right:0;background:var(--bg);min-height:100vh;padding-bottom:5.5rem}
  .list{overflow:visible;padding-bottom:1rem}
  .letter{background:linear-gradient(var(--bg) 70%,transparent)}
  .side-foot{display:none}
  body.open .side{display:none}
  body:not(.open) .main{display:none}
  .topbar .back{display:grid}
  .sec{grid-template-columns:1fr;gap:.35rem}
  .sec-label{padding-top:0;text-align:left}
  .sec.chorus .sec-body{margin-left:0;padding-left:.85rem}
  .dock{left:50%;bottom:calc(.75rem + env(safe-area-inset-bottom));max-width:calc(100vw - 1.5rem)}
  .dock .hide-m{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:15;justify-content:space-around;padding:.4rem .5rem calc(.4rem + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  body.open .tabbar{display:none}
  .tabbar button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:.15rem;font-size:.66rem;font-weight:700;color:var(--ink-3);padding:.3rem}
  .tabbar button.on{color:var(--ink)}
  .tabbar button.on svg{color:var(--gold)}
  .seg{display:none}
  .song{padding-bottom:7rem}
}

/* Nota bozza */
.draft{position:fixed;bottom:.75rem;right:.75rem;z-index:50;font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--chord);color:#fff;padding:.3rem .6rem;border-radius:999px;opacity:.85;pointer-events:none}
@media (max-width:860px){.draft{top:auto;bottom:5rem;right:.6rem}}
</style>
</head>
<body>
<span class="draft">Bozza</span>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h10M4 12h7M4 18h8M18 8v6M15 11h6"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 7V5h16v2M9 19h6M12 5v14"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></symbol>
  <symbol id="i-cross" viewBox="0 0 24 24"><path d="M12 2v20M5 8h14"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4h11l-1.5 4L16 12H5"/></symbol>
</svg>

<div class="shell">
  <aside class="side" aria-label="Elenco canti">
    <div class="brand">
      <div class="mark"><svg class="i" style="stroke-width:2.2"><use href="#i-cross"/></svg></div>
      <div>
        <h1>Canzoniere</h1>
        <p>Parrocchia San Marco · Udine</p>
      </div>
      <span class="spacer"></span>
      <button class="icon-btn" id="themeBtn" aria-label="Cambia tema"><svg class="i"><use href="#i-moon"/></svg></button>
      <button class="icon-btn" aria-label="Menu"><svg class="i"><use href="#i-menu"/></svg></button>
    </div>
    <label class="search">
      <span class="sr-only">Cerca</span>
      <svg class="i"><use href="#i-search"/></svg>
      <input id="q" type="search" placeholder="Cerca titolo, autore o parole…" autocomplete="off">
      <kbd>/</kbd>
    </label>
    <div class="seg" role="tablist">
      <button class="on" data-view="all">Tutti <span class="count" id="cAll"></span></button>
      <button data-view="fav"><svg class="i" style="width:15px;height:15px"><use href="#i-star"/></svg>Preferiti</button>
      <button data-view="set"><svg class="i" style="width:15px;height:15px"><use href="#i-list"/></svg>Setlist</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="list-head"><span id="listLabel">Tutti i canti</span><span id="listCount"></span></div>
    <ul class="list" id="list"></ul>
    <div class="side-foot"><span class="ok"></span>Disponibile offline · 210 canti</div>
  </aside>

  <section class="main" id="main"></section>
</div>

<nav class="tabbar">
  <button class="on" data-view="all"><svg class="i"><use href="#i-book"/></svg>Canti</button>
  <button data-view="fav"><svg class="i"><use href="#i-star"/></svg>Preferiti</button>
  <button data-view="set"><svg class="i"><use href="#i-list"/></svg>Setlist</button>
  <button id="themeBtn2"><svg class="i"><use href="#i-moon"/></svg>Tema</button>

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---- Trasposizione (stessa logica di app.js) ---- */
const NOTES=['DO','DO#','RE','RE#','MI','FA','FA#','SOL','SOL#','LA','LA#','SI'];
const NI={'DO':0,'DO#':1,'REB':1,'RE':2,'RE#':3,'MIB':3,'MI':4,'FAB':4,'FA':5,'FA#':6,'SOLB':6,'SOL':7,'SOL#':8,'LAB':8,'LA':9,'LA#':10,'SIB':10,'SI':11,'DOB':11};
const RR=/^([([{]*)(DO|RE|MI|FA|SOL|LA|SI)(#|[Bb])?([A-Za-z0-9+\-]*)([)\]}]*)$/;
function tSingle(tok,s){const m=tok.match(RR);if(!m)return tok;const[,p,r,a,suf,post]=m;const i=NI[r+(a?a.toUpperCase():'')];if(i===undefined)return tok;return p+NOTES[((i+s)%12+12)%12]+suf+post}
const tTok=(t,s)=>t.includes('/')?t.split('/').map(p=>tSingle(p,s)).join('/'):tSingle(t,s);
const tNote=(n,s)=>NOTES[((NI[n]+s)%12+12)%12];

function filtered(){
  let arr = INDEX;
  if (state.view==='fav') arr = arr.filter(s=>state.fav.has(s.id));
  if (state.view==='set') arr = state.setlist.map(id=>INDEX.find(s=>s.id===id)).filter(Boolean);
  if (state.tag) arr = arr.filter(s=>(TAGS[s.id]?.tags||[]).includes(state.tag));
  if (state.q){ const q=norm(state.q); arr = arr.filter(s=>norm(s.title+' '+s.sub+' '+s.search).includes(q)); }
  return arr;
}
function hl(text){
  if(!state.q) return esc(text);
  const i = norm(text).indexOf(norm(state.q));
  if(i<0) return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+state.q.length))+'</mark>'+esc(text.slice(i+state.q.length));
}

/* ---- Canto ---- */
function pairLine(chord, lyric){
  // divide la riga in segmenti alle posizioni degli accordi
  const pos=[]; chord.replace(/\S+/g,(m,i)=>{pos.push([i,m]);return m});
  if(!lyric) return `<div class="ln only-chords">${pos.length?`<span class="seg-w"><span class="ch">${esc(chord.trimStart().split(/\s+/).map(t=>tTok(t,state.shift)).join('   '))}</span><span class="ly"> </span></span>`:''}</div>`;
  const lead = pos.length ? Math.min(pos[0][0], lyric.search(/\S|$/)) : lyric.search(/\S|$/);
  if(!pos.length) return `<div class="ln"><span class="seg-w"><span class="ch"></span><span class="ly">${esc(lyric.slice(lead))}</span></span></div>`;
  let out='', cuts=[lead,...pos.map(p=>p[0]).filter(p=>p>lead)];
  if(pos[0][0]<=lead) cuts=[lead,...pos.slice(1).map(p=>p[0])];
  const chordsAt = new Map(pos.map(([i,m])=>[Math.max(i,lead),m]));
  for(let k=0;k<cuts.length;k++){
    const a=cuts[k], b=cuts[k+1]??Math.max(lyric.length, a+1);
    let txt = lyric.slice(a,b).replace(/ {2,}/g,' ');
    const c = chordsAt.get(a);
    const cTxt = c ? tTok(c,state.shift) : '';
    if(!txt) txt=' ';
    out+=`<span class="seg-w"><span class="ch">${esc(cTxt)}</span><span class="ly">${esc(txt)}</span></span>`;
  }
  return `<div class="ln">${out}</div>`;
}

  <div class="topbar" id="topbar">
    <button class="icon-btn back" id="back" aria-label="Indietro"><svg class="i"><use href="#i-back"/></svg></button>
    <div class="crumb">${si>=0?`Setlist ${si+1}/${state.setlist.length} · `:''}<b>${esc(meta.title)}</b></div>
    <button class="icon-btn ${state.fav.has(state.id)?'on':''}" id="favBtn" aria-label="Preferito"><svg class="i" style="${state.fav.has(state.id)?'fill:currentColor':''}"><use href="#i-star"/></svg></button>
    <button class="icon-btn ${si>=0?'on':''}" aria-label="Aggiungi a setlist"><svg class="i"><use href="#i-list"/></svg></button>
    <button class="icon-btn" aria-label="Segnala un errore"><svg class="i"><use href="#i-flag"/></svg></button>
  </div>
  <article class="song">
    <header class="song-hero">
      <div class="eyebrow"><span class="num">N° ${meta.numero}</span>${si>=0?`<span>·</span><span>Setlist ${si+1} di ${state.setlist.length}</span>`:''}</div>
      <h2>${esc(meta.title)}</h2>
      ${meta.sub?`<p class="author">${esc(meta.sub)}</p>`:''}
      <div class="meta">
        <span class="pill key">Tonalità ${key}</span>
        ${song?.capo?`<span class="pill capo">Capo ${song.capo}</span>`:''}
        ${tags.map(t=>`<span class="pill" style="--c:${tagColor(t)}"><span class="dot"></span>${esc(t)}</span>`).join('')}
      </div>
    </header>
    <div class="sheet ${state.lyricsOnly?'lyrics-only':''}" style="--fs:${state.fs}px">${body}</div>
    ${nextMeta?`<button class="next" data-id="${nextId}"><span class="grow"><small>Prossimo nella setlist</small><b>${esc(nextMeta.title)}</b></span><svg class="i"><use href="#i-next"/></svg></button>`:''}
  </article>
  <div class="dock" role="toolbar" aria-label="Strumenti canto">
    <div class="grp">
      <button data-act="down" aria-label="Abbassa di un semitono">−</button>
      <div class="val key"><small>Tono</small>${state.shift?(state.shift>0?'+':'')+state.shift:key}</div>
      <button data-act="up" aria-label="Alza di un semitono">+</button>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <button data-act="fsm" aria-label="Testo più piccolo" style="font-size:.8rem">A</button>
      <button data-act="fsp" aria-label="Testo più grande" style="font-size:1.1rem">A</button>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <button data-act="lyr" class="${state.lyricsOnly?'on':''}" aria-label="Solo testo" title="Solo testo"><svg class="i"><use href="#i-text"/></svg></button>
      <button data-act="scroll" class="hide-m" aria-label="Scorrimento automatico" title="Scorrimento automatico"><svg class="i"><use href="#i-play"/></svg></button>
    </div>
  </div>`;
  const tb=$('#topbar');
  window.onscroll=()=>tb.classList.toggle('scrolled', scrollY>120);
}
function renderHome(){
  document.body.classList.remove('open');
  const counts = {}; Object.values(TAGS).forEach(t=>t.tags.forEach(x=>counts[x]=(counts[x]||0)+1));
  const mass = ['Ingresso','Gloria','Vangelo','Offertorio','Santo','Agnello di Dio','Comunione','Finale'];
  $('#main').innerHTML=`<div class="home">
    <div class="eyebrow"><span class="num">Domenica 12 ottobre</span><span>·</span><span>XXVIII del Tempo Ordinario</span></div>
    <h2>Che cosa cantiamo oggi?</h2>
    <p class="lead">Scegli un momento della Messa, cerca una parola del testo o apri la setlist preparata.</p>
    <button class="setlist-card" data-id="${state.setlist[0]}">
      <span class="ic"><svg class="i"><use href="#i-list"/></svg></span>
      <span class="grow"><b>Setlist di domenica</b><small>${state.setlist.length} canti · condivisa dal coro</small></span>
      <svg class="i"><use href="#i-play"/></svg>
    </button>
    <h3>Momenti della Messa</h3>
    <div class="grid">${mass.map(t=>`<button class="card" data-tag="${t}" style="--c:${tagColor(t)}"><span class="n">${counts[t]||0}</span><span><b>${t}</b><br><small>canti</small></span></button>`).join('')}</div>
  </div>`;
  window.onscroll=null;
}

/* ---- Eventi ---- */
document.addEventListener('click',e=>{
  const row=e.target.closest('[data-id]'); if(row){ state.id=row.dataset.id; state.shift=0; renderSong(); renderList(); scrollTo(0,0); return; }
  const chip=e.target.closest('[data-tag]'); if(chip){ state.tag = state.tag===chip.dataset.tag?null:chip.dataset.tag; if(chip.classList.contains('card')){state.view='all';} renderChips(); renderList(); if(isM()&&chip.classList.contains('card')){state.id=null;document.body.classList.remove('open');} return; }
  const v=e.target.closest('[data-view]'); if(v){ state.view=v.dataset.view; document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===state.view)); renderList(); if(isM()){state.id=null;renderSong();} return; }
  const a=e.target.closest('[data-act]');
  if(a){ const k=a.dataset.act;
    if(k==='up')state.shift=(state.shift+1)>6?-5:state.shift+1;
    if(k==='down')state.shift=(state.shift-1)<-5?6:state.shift-1;
    if(k==='fsp')state.fs=Math.min(30,state.fs+1);
    if(k==='fsm')state.fs=Math.max(13,state.fs-1);
    if(k==='lyr')state.lyricsOnly=!state.lyricsOnly;
    if(k==='scroll'){ a.classList.toggle('on'); clearInterval(window._sc); if(a.classList.contains('on')) window._sc=setInterval(()=>scrollBy(0,1),45); return; }
    const y=scrollY; renderSong(); scrollTo(0,y); return; }
  if(e.target.closest('#back')){ state.id=null; renderSong(); renderList(); return; }
  if(e.target.closest('#favBtn')){ state.fav.has(state.id)?state.fav.delete(state.id):state.fav.add(state.id); const y=scrollY; renderSong(); renderList(); scrollTo(0,y); return; }
  if(e.target.closest('#themeBtn,#themeBtn2')){ const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme:dark)').matches; r.dataset.theme = dark?'light':'dark'; return; }
});
$('#q').addEventListener('input',e=>{state.q=e.target.value.trim();renderList();});
document.addEventListener('keydown',e=>{ if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus();} });
$('#cAll').textContent=INDEX.length;

renderChips(); renderList();
if(!isM()){ state.id='adoro-te'; renderSong(); renderList(); } else renderHome();
</script>
</body>
</html>
