 vita che   vince  la morte  Strofa 3          Il Signore   è la grazia  che  vince   il peccato  Strofa 4          Il Signore   è la gioia  che  vince   l'angoscia  Strofa 5          Il Signore   è la pace   che  vince  la guerra"},{"id":"il-vascello-dell-amore","numero":73,"title":"Il Vascello dell'Amore","sub":"","search":"Il Vascello dell'Amore  Strofa 1         Tu  che  inventi   per  ognuno    di  noi         un  cammino      che  porta   verso   te,         tu  che  chiami   ognuno     per  il suo nome     tu         oggi  ci chiami   insieme. Strofa 2         Tu  che  hai  in mente    per  ognuno     di noi         una   strada  bellissima   con   te,         tu  stavolta  parli  di un'avventura      che         che  si percorre    insieme.  Ritornello                     Rendi    agile il vascello   dell'amore    nostro,                     docile   al soffio  del  tuo  Spirito,                     e  per  gli inimmaginabili     mari   conducilo,                     quelli  che  tu  sai.                     Rendi    agile il vascello   dell'amore    nostro,                     che   tocchi  i lidi che  tu solo  sai                     e  la scia della  sua  rotta  che  disegni   un'onda                      quella  che  tu  vuoi.  Strofa 3         Dacci   forza  perché    ognuno    di  noi         con   la vita dispieghi   la tua  idea.         Dacci   forza  per  svelare   il pensiero   tuo         su  questa   vita insieme. Strofa 3 (ripetere)         Dacci   forza  perché    ognuno    di  noi         con   la vita dispieghi   la tua  idea.         Dacci   forza  per  svelare   il pensiero   tuo         su  questa   vita insieme.  Ritornello finale                     Rendi    agile il vascello   dell'amore    nostro,                     docile   al soffio  del  tuo  Spirito,                     e  per  gli inimmaginabili     mari   conducilo,                     quelli  che  tu  sai.                     Rendi    agile il vascello   dell'amore    nostro,                     che   tocchi  i lidi che  tu solo  sai                     e  la scia della  sua  rotta  che  disegni   un'onda                      quella  che   tu, quella  che,                      quella  che   tu, quella  che,                      quella   che  tu...   vuoi."},{"id":"in-una-notte-come-tante","numero":74,"title":"In una Notte Come Tante","sub":"","search":"In una Notte Come Tante  Intro  Strofa 1    In una  notte_  come  tante,  in una città qualunque,    per una  strada_  un po'  isolata un pastore  torna  a casa,    il pastore_ guarda   avanti e per  il freddo stringe i denti,    già s'immagina   il ristoro dopo  un  giorno_  di lavoro.    Ma  nell'aria c'è qualcosa  che  lo abbraccia_    E ad un  tratto una  voce_  nella testa.    In questa  notte come   tante    Questo   mondo    cambia  rotta,    nasce  Dio, bambino_,    in una grotta.  Interludio senza violoncello  Strofa 2    Ad  un tratto quel  posto  si riempie di persone,    tutti vanno_  a quella  grotta come   fosse_ ad  un  altare    e Giuseppe   non  capisce  cosa accade  nella via,    ma  poi incontra_   la dolcezza  dello sguardo_   di Maria,    che come   sempre   ha capito  già ogni  cosa_    ed assiste alla scena silenziosa.    In questa  notte come   tante    Oggi  il mondo   cambia   rotta,    nasce  Dio, bambino_,    in una grotta.  Ritornello 1    Come   brezza  leggera  che accarezza   l'anima    Vieni bambino    in questa  piccola città,    tra la povera  gente  e anche  tu non  hai niente,    ma  il tuo amore   resterà_ per sempre.  Interludio senza violoncello  Strofa 3    In una  notte come   tante  in una città qualunque    C'è chi adesso_   torna a casa  e chi aspetta in una  chiesa,    c'è qualcuno_   che usa  ancora_  la violenza_    e chi cerca ormai  deluso_   una  speranza.    Ma  tu vieni e prova   ancora    A cambiare   questa  rotta,    nasci qui, bambino_,    in questa grotta.  Ritornello 2    Come   brezza  leggera  che accarezza   l'anima    Vieni ind ciando tutto, sto lasciando tutto    E mi trovo  qui perché tu Dio mi  attiri    Io cerco Te, ho bisogno  di Te    Io mi arrendo  Strofa 2    Riempimi  di grazia e d'Amore,  sì    Ho  fame  di Te, ho sete di Te    Io so che senti il mio grido a Te    Parlami adesso, parlami  ora  Ritornello    Io mi arrendo,  io mi arrendo    Voglio sentirti di più, voglio scoprirti di più    Io mi arrendo,  io mi arrendo    Voglio sentirti di più    Voglio scoprirti di più  Interludio  Ponte 1    Sei un vento che soffia forte in me    Fa' ciò che vuoi, fa' ciò che vuoi in me    Sei tempesta che si risveglia in me    Fa' ciò che vuoi, fa' ciò che vuoi in me    Sei un vento che respira in me    Fa' ciò che vuoi, fa' ciò che vuoi in me    Sei una tempesta  che si risveglia in me    Fa' ciò che vuoi, fa' ciò che vuoi in me  Interludio  Ponte 2    Sei un vento che soffia forte in me    Fa' ciò che vuoi, fa' ciò che vuoi in me    Sei una tempesta  che si risveglia in me    Fa' ciò che vuoi, fa' ciò che vuoi in me    Fa' ciò che vuoi, fa' ciò che vuoi in me  Finale (x2)    Io mi arrendo, io mi  arrendo    Voglio sentirti di più                (x2)    Voglio scoprirti di più"},{"id":"jesus-christ-you-are-my-life","numero":77,"title":"Jesus Christ, You Are My Life","sub":"","search":"Jesus Christ, You Are My Life  Ritornello - inglese Jesus  Christ  you   are  my   life,  Alle   - luia,  Alle  -  lu  -  ia Jesus  Christ  you   are  my   life, you  are  my   life, Al  - lelu   - ia  Ritornello - italiano           Cristo   vive    in mezzo    a  noi,  Alle   -  luia, Alle  - lu  -  ia           Cristo   vive    in mezzo    a  noi, in  mezzo    a noi,  Al   - lelu  - ia  Strofa 1 Tu  sei Via    sei Verità     Tu  sei la nostra       vi     -     ta     Camminando        insieme    a Te     Vivremo     in Te  per  sem    -  pre  Strofa 2 Ci  raccogli   nell'unità,     riuniti nell'amore,     nella  gioia  dinanzi   a Te     cantando     la Tua   gloria.  Strofa 3 Nella  gioia  camminerem,     portando     il Tuo  Vangelo,     testimoni    di carità,     figli di Dio  nel  mondo."},{"id":"la-canzone-dell-amicizia","numero":78,"title":"La Canzone dell'Amicizia","sub":"Fontana","search":"La Canzone dell'Amicizia  Intro  Strofa 1          In un  mondo     di  maschere        dove   sembra    impossibile          Riuscire  a sconfiggere              tutto  ciò  che  annienta    l'uomo          Il potere  e  la falsità             l'egoismo    e l'avidità          Sono   mostri   da  abbattere            noi  però   non   siamo   soli  Ritornello            Canta    con  noi     Batti  le mani            Alzale   in alto      Muovile     al ritmo   del  canto            Stringi  la mano      Al  tuo  vicino            E  scoprirai          Che   è  meno    duro   il cammino     così    (2  volte)  Strofa 2          Ci hai  donato    il tuo  spirito      Lo  sentiamo    qui  in mezzo    a  noi          Ed  è proprio    per  questo   che     non   vogliamo     rinunciare          Non   possiamo     più  assistere      impotenti    ed  attoniti          Perché   siam  responsabili            della  vita intorno    a noi"},{"id":"la-gioia","numero":79,"title":"La Gioia","sub":"","search":"La Gioia  Strofa 1 Ascolta   il rumore    delle  onde   del  mare   ed  il canto  notturno    dei  mille  pensieri   dell'umanità,   che   riposa   dopo    il traffico di  questo   giorno   e di sera  si incanta    davanti   al tramonto     che  il sole  le dà.    Respira,    e  da  un  soffio  di vento   raccogli il profumo     dei fiori  che  non   hanno    chiesto  che  un   po'  di umiltà.   E se  vuoi  puoi   cantare,     e cantare   che  hai  voglia  di  dare,  e cantare che  ancora    nascosta   può   esistere  la felicità.  Ritornello Perché   la vuoi,   perché   tu  puoi  riconquistare    un   sorriso; e puoi   cantare   e puoi   gridare   che  ti hanno    detto  bugie, se han   raccontato    che  l'hanno    uccisa  che  han   calpestato    la gioia, perché   la gioia,  perché    la gioia,  perché   la gioia  è con   te! E magari    fosse  un  attimo   vivila,  ti prego, e magari    a denti   stretti non  farla  morire, anche   immersa     nel  frastuono    tu falla sentire, hai  bisogno    di gioia  come    me.      La la  la la…  Strofa 2 Ancora,    è già  tardi  ma  rimani   ancora per  gustare   ancora    per  poco    quest'aria   scoperta   stasera;   e domani     ritorna,   fra la  gente  che  corre   e dispera, tu  saprai  che  nascosta   nel  cuore   può   esistere  la felicità.  Ritornello finale Perché   la vuoi,   perché   tu  puoi  riconquistare    un   sorriso; e puoi   cantare   e puoi   gridare   che  ti hanno    detto  bugie, se han   raccontato    che  l'hanno    uccisa  che  han   calpestato    la gioia, perché   la gioia,  perché    la gioia,  perché   la gioia  è con   te! E magari    fosse  un  attimo   vivila,  ti prego, e magari    a denti   stretti non  farla  morire, anche   immersa     nel  frastuono    tu falla sentire, hai  bisogno    di gioia  come    me.      La la  la la…"},{"id":"la-mia-anima-canta","numero":80,"title":"La Mia Anima Canta","sub":"Gen Verde","search":"La Mia Anima Canta  Ritornello La  mia  anima    canta   la grandezza     del Signore,                    il mio   spirito  esulta  nel mio   salvatore.                    Nella   mia   povertà    l'Infinito mi  ha  guardata,                    in  eterno   ogni  creatura    mi  chiamerà    beata.  Strofa 1               La  mia  gioia  è  nel Signore                      che  ha  compiuto     grandi   cose  in  me,                      la mia   lode  al Dio   fedele                      che  ha  soccorso    il suo popolo                      e non   ha  dimenticato                      le sue  promesse     d'amore.  Strofa 2               Ha  disperso    i superbi                     nei pensieri   inconfessabili,                     ha  deposto    i potenti,                     ha  risollevato   gli umili,                     ha  saziato  gli affamati                     e aperto   ai ricchi  le mani."},{"id":"la-preghiera-di-gesu-e-la-nostra","numero":81,"title":"La Preghiera di Gesù è la Nostra","sub":"Castiglia · Varnavà","search":"La Preghiera di Gesù è la Nostra  Strofa 1       Dove   due   o  tre sono   riuniti nel  mio   nome       io sarò  con   loro,      pregherò    con   loro,       amerò    con  loro,  perché   il mondo     venga    a Te o  Padre       conoscere    il tuo  amore    e avere   vita        con  Te  Strofa 2       Voi  che  siete luce  della  terra,  miei  amici       risplendete   sempre        della  vera  luce       perché   il mondo     creda  nell'amore     che  c'è in voi  o  Padre       consacrali   per  sempre    e diano   gloria         a Te.  Cambio di tonalità - RE  Strofa 3       Ogni   beatitudine    vi attende    nel mio   giorno       se sarete  uniti,     se sarete   pace,            se sarete  puri       perché   voi  vedrete   Dio   che  è Padre       in Lui la vostra   vita  gioia  piena       sarà.  Strofa 4       Voi  che  ora  siete miei   discepoli   nel mondo       siate testimoni         di un  amore    immenso               date   prova   di       quella  speranza    che  c'è in  voi, coraggio       vi guiderò   per  sempre     Io rimango        con  voi.  Cambio di tonalità - MI  Strofa 5       Spirito  che  animi   la chiesa  e  la rinnovi       donale   fortezza,      fa che  sia fedele             come    Cristo  che       muore    e risorge   perché   il Regno   del  Padre       si compia   in  mezzo    a noi  e  abbiamo     vita     in (Lui)       si compia   in  mezzo    a noi  e  abbiamo     vita     in Lui."},{"id":"la-tua-dimora-ricci","numero":165,"title":"La Tua Dimora","sub":"Daniele Ricci · La tua dimora","search":"La Tua Dimora Daniele Ricci apostoli profeti pietra angolare Fai di noi il popolo tuo Padre famiglia casa gioia Spirito Verbo pace"},{"id":"laudato-sii-o-mi-signore","numero":82,"title":"Laudato Sii, o Mi Signore","sub":"","search":"Laudato Sii, o Mi Signore  Ritornello           Laudato     sii, o mi  Signore          Laudato     sii, o mi  Signore           Laudato     sii, o mi  Signore          Laudato     sii, o mi  Signore  Strofa 1     E  per  tutte  le tue  creature         per  il sole e per  la  luna        Per  le stelle e  per  il vento         e per   l'acqua  e per  il fuoco  Strofa 2     Per sorella   madre    terra           ci alimenta    e ci sostiene        Per  i frutti i fiori e l'erba          per  i monti   e  per  il mare  Strofa 3     Perché   il senso  della  vita         è cantare   e lodarti        E  perché   la nostra   vita            sia sempre    una   canzone  Strofa 4     E per  quelli  che  ora  piangono      e per  quelli  che  ora   soffrono        E  per  quelli  che  ora  nascono       e per  quelli  che  ora  muoiono"},{"id":"laudato-sii-signore-mio","numero":83,"title":"Laudato Sii, Signore Mio","sub":"","search":"Laudato Sii, Signore Mio  Ritornello         Laudato    sii, Signore   mio          Laudato    sii, Signore    mio         Laudato    sii, Signore   mio          Laudato    sii, Signore    mio  Strofa 1 Per  il sole d'ogni   giorno           Che   riscalda  e dona    vita      Ed  illumina   il cammino              Di  chi cerca   te Signore      Per  la luna  e  per  le stelle        Io  le sento  mie   sorelle      Le  hai  formate    su nel  cielo      E le doni   a chi  è nel  buio  Strofa 2 Per  la nostra   madre    terra        Che   ci dona   fiori ed  erba      Su  di lei noi  fatichiamo             Per  il pane  d'ogni   giorno      Per  chi  soffre con   coraggio        E  perdona    nel  tuo  amore      Tu  gli dai  la pace  tua              Alla  sera  della  vita  Strofa 3 Per  la morte    che  è di tutti        Io la sento   in ogni   istante      Ma   se  vivo  nel  tuo  amore         Dona    un  senso   alla mia   vita      Per  l'amore    che  è nel  mondo      Tra  una  donna    e  l'uomo    suo      Per  la vita  dei bambini              Che   il mio  mondo      fanno   nuovo"},{"id":"le-tue-mani","numero":84,"title":"Le Tue Mani","sub":"","search":"Le Tue Mani  Intro  Strofa 1    Le tue mani   son piene  di fiori    dove  li portavi fratello mio?    Li portavo  alla tomba   di Cristo,    ma  l'ho trovata  vuota  sorella mia.  Ritornello Al    -     le -  lu - ia        Al  - le - lu - ia                           Al    -     le -  lu - ia        Al - le - lu - ia  Strofa 2    I tuoi occhi riflettono gioia,    dimmi   cosa hai visto fratello mio?    Ho  veduto   morire  la morte,    ecco  cosa ho  visto sorella mia.  Rit.  Strofa 3    Hai portato   una  mano   all'orecchio,    dimmi   cosa ascolti fratello mio?    Sento  squilli di tromba  lontani,    sento  cori d'angeli sorella mia.  RIT.  Strofa 4    Stai cantando   un'allegra canzone    dimmi   perché  canti fratello mio?    Perché  so che  la vita non muore    ecco  perché  canto  sorella mia.     RIT."},{"id":"le-tue-meraviglie","numero":85,"title":"Le Tue Meraviglie","sub":"","search":"Le Tue Meraviglie  Intro  Ritornello Ora   lascia  o Signore   che   io vada   in pace       perché    ho  visto  le tue  meraviglie.       Il tuo  popolo    in  festa per  le  strade  correrà   a portare    le tue  meraviglie.  Strofa 1 La tua  presenza    ha  riempito    d'amore        le nostre  vite  e le nostre   giornate.        In te una   sola  anima   un   solo  cuore   siamo   noi        con  te la luce  risplende    splende   più  chiara   che  mai.  Strofa 2 La tua  presenza    ha  inondato     d'amore        le nostre  vite  e le nostre   giornate.        Fra  la tua  gente  resterai  per  sempre    vivo   in mezzo    a  noi        fino  ai confini  del  tempo    così  ci accompagnerai.  Ritornello finale        Ora   lascia  o Signore    che  io vada   in  pace       perché    ho  visto  le tue  meraviglie.       Il tuo  popolo    in  festa per  le  strade  correrà   a portare    le tue  meraviglie.        Ora   lascia  o Signore    che  io vada   in  pace       perché    ho  visto  le tue  meraviglie.       Il tuo  popolo    in  festa per  le  strade  correrà   a portare    le tue  meraviglie.  Conclusione "},{"id":"lode-a-te-o-cristo","numero":86,"title":"Lode a Te, o Cristo","sub":"","search":"Lode a Te, o Cristo  Ritornello (x2) Lode a te o Cristo, re di eterna gloria.  Strofa 1              Signore,   tu  sei veramente                 Il salvatore   del mondo:                 dammi    dell'acqua    viva                 perché   non   abbia   più  sete.  Strofa 2              Chi   beve   di quest'acqua                 avrà  di nuovo     sete,                 ma   chi beve   dell'acqua    che  io gli darò                 non   avrà  mai   più  sete."},{"id":"lode-al-nome-tuo","numero":87,"title":"Lode al Nome Tuo","sub":"","search":"Lode al Nome Tuo  Intro  Strofa 1    Lode  al nome   tuo dalle  terre più floride    Dove   tutto sembra   vivere   lode al nome   tuo    Lode  al nome   tuo dalle  terre più aride    Dove   tutto sembra   sterile lode  al nome   tuo  Ritornello 1                 Tornerò   a lodarti sempre   per ogni  dono   tuo                 E quando   scenderà   la notte sempre   io dirò                 Benedetto   il nome  del Signor,   lode al nome   tuo                 Benedetto   il nome  del Signor,  il glorioso nome   di Gesù.  Strofa 2    Lode  al nome   tuo quando    il sole splende su di me    Quando    tutto è incantevole,    lode  al nome   tuo    Lode  al nome   tuo quando    io sto davanti  a te    Con  il cuore triste e fragile, lode  al nome   tuo.  Ritornello 2                 Tornerò   a lodarti sempre   per ogni  dono   tuo                 E quando   scenderà   la notte sempre   io dirò                 Benedetto   il nome  del Signor,   lode al nome   tuo                 Benedetto   il nome  del Signor,  il glorioso nome   di Gesù.  Ponte    Tu doni  e porti via, tu doni  e porti via    Ma  sempre   sceglierò   di benedire   te  Ritornello finale                 Tornerò   a lodarti sempre   per ogni  dono   tuo                 E quando   scenderà   la notte sempre   io dirò                 Benedetto   il nome  del Signor,   lode al nome   tuo                 Benedetto   il nome  del Signor,   lode al nome   tuo                 Benedetto   il nome  del Signor,   lode al nome   tuo                 Benedetto   il nome  del Signor,  il glorioso nome   di Gesù.  Finale (x2)    Tu doni  e porti via, tu doni  e porti via    Ma  sempre   sceglierò   di benedire   te  (x2)"},{"id":"luce-di-verita","numero":88,"title":"Luce di Verità","sub":"","search":"Luce di Verità  Ritornello Luce   di verità,  fiamma    di  carità, (fiamma     di carità)       vincolo    di unità,   Spirito  Santo   Amore.       Dona    la libertà,  dona    la santità,       fa'  dell'umanità    il tuo  canto   di lode.  Strofa 1              Cammini     accanto    a noi  lungo   la stra  - da,                    si realizzi in noi  la tua  missione.                    Attingeremo      forza  dal  tuo  cuo  - re,                    si realizzi in noi  la tua  missione.    Spirito,  vieni.  Strofa 2              Tu  nella  brezza   parli  al nostro   cuo   - re:                  ascolteremo,      Dio,  la tua  parola;                  ci chiami   a  condividere     il tuo amo    - re:                  ascolteremo,      Dio,  la tua  parola.   Spirito,  vieni.  Strofa 3              Vergine    del  silenzio  e della  fe -  de                  l'Eterno   ha  posto   in  te la sua  dimora.                  Il tuo  \"sì\"  risuonerà   per  sem   - pre:                  l'Eterno   ha  posto   in  te la sua  dimora.    Spirito,  vieni.  Strofa 4              Come     sigillo posto   sul tuo  cuo   - re,                  ci custodisci,   Dio,  nel  tuo  amore.                  Hai   dato   la tua  vita per  salvar  -  ci,                  ci custodisci,   Dio,  nel  tuo  amore.    Spirito,  vieni.  Strofa 5              Dissiperai   le tenebre    del ma   - le,                  esulterà   in te  la creazione.                  Vivremo     al tuo   cospetto   in  eter - no,                  esulterà   in te  la creazione.    Spirito, vieni.  Strofa 6              Tu  nella  Santa   Casa   accogli  il do  - no,                    sei tu la porta   che  ci apre   il Cielo                    Con   te la Chiesa   canta   la sua  lo  -  de,                    sei tu la porta   che  ci apre   il Cielo. Spirito,  vieni.  Strofa 7              Ci  poni  come    luce  sopra   un  mon    - te:                   in noi  l'umanità    vedrà   il tuo  volto                   Ti  testimonieremo      fra  le gen  - ti:                   in noi  l'umanità    vedrà   il tuo  volto.  Spirito,  vieni.  Finale del ritornello lo - de"},{"id":"lui-m-ha-dato","numero":89,"title":"Lui M'ha Dato","sub":"","search":"Lui M'ha Dato  Strofa 1 Io  non   so proprio    cosa  far, per  ringraziare    il mio  Signor M'ha    dato  i cieli da  guardar,   e  tanta  gioia  dentro    il cuor.  Ritornello Lui  m'ha   dato   i cieli da guardar      Lui  m'ha   dato   la bocca   per  cantar      Lui  m'ha   dato   il mondo    per  amar      E  tanta  gioia  dentro   il cuor,  e tanta   gioia  dentro   il cuor  Strofa 2 E s'è  curvato   su  di me,   ed  è disceso   giù dal  ciel Per  abitare   in mezzo    a  noi, e  per  salvare  tutti noi  Ripetere il ritornello"},{"id":"mani","numero":90,"title":"Mani","sub":"","search":"Mani  Intro  Strofa 1 Vorrei  che le parole  mutassero   in preghiera e rivederti o  Padre  che dipingevi  il cielo. Sapessi quante   volte guardando    questo  mondo vorrei  che tu tornassi a ritoccare  il cuore. Vorrei  che le mie  mani  avessero  la forza per  sostenere  chi non  può  camminare. Vorrei  che questo   cuore  che esplode  in sentimenti diventasse  culla per  chi non  ha più madre...  Ritornello 1              Mani,  prendi  queste  mie  mani,  fanne  vita, fanne  amore              braccia aperte  per  ricevere...Chi è solo.              Cuore,  prendi  questo  mio   cuore, fa che  si spalanchi al mondo              germogliando    per  quegli occhi  che non  sanno   pianger  più.  Strofa 2 Sei tu lo spazio  che desidero  da  sempre, so che  mi stringerai e mi  terrai la mano. Fa  che le mie  strade si perdano  nel  buio ed  io cammini   dove  cammineresti    Tu.  Strofa 3 Tu  soffio della vita prendi  la mia giovinezza con  le contraddizioni   e le falsità Strumento   fa che  sia per annunciare   il Regno a chi per queste  vie Tu  chiami  Beati...  Ritornello 2              Mani,  prendi  queste  mie  mani,  fanne  vita, fanne  amore              braccia aperte  per  ricevere...Chi è solo.              Cuore,  prendi  questo  mio   cuore, fa che  si spalanchi al mondo              germogliando    per  quegli occhi  che non  sanno   pianger  più.  Strofa 4 Noi  giovani  di un  mondo    che cancella  i sentimenti e inscatola  le forze nell'asfalto di città. Siamo   stanchi di guardare   siamo  stanchi di gridare ci hai chiamati  siamo  Tuoi  cammineremo      insieme...  Finale a 3 voci - modulazione in RE              Mani,  prendi  queste  nostre  mani  fanne  vita fanne  amore,              braccia aperte  per  ricevere...Chi è solo.              Cuori,  prendi  questi nostri cuori fa che  siano testimoni              che Tu  chiami  ogni  uomo   a far festa con  Dio."},{"id":"maranatha-soffio-di-dio","numero":91,"title":"Maranathà","sub":"Soffio di Dio","search":"Maranathà Soffio di Dio Intro  Strofa 1    Spirito  Santo   scendi   su di me    e donami     un  cuore   puro      Apri  i miei  occhi  con   la tua  luce  solleva   le mie   braccia  verso   te    Rivelami    la verità  o  Spirito  d'amor    Infiamma     col tuo   fuoco   il mio  cuore  Ritornello    Ma    - ra  -  na   -  thà       vie   -  ni  Signor    Ma    - ra  -  na   -  thà                    vieni  in me   Signor  Strofa 2    Dai  quattro   venti   soffia su  di noi  e sana   ogni  ferita  col tuo   amore      Scendi  dal  cielo  Spirito  di Dio    e semina    la sua  parola   in noi    È acqua   che   zampilla   questo    canto  che    eleviam    Battezzaci   nel  tuo  eterno   amore  Ritornello finale    Ma    - ra  -  na   -  thà       vie   -  ni  Signor    Ma    - ra  -  na   -  thà                    vieni  in me   Signor Finale (noi)    Vie   - ni    Signor!"},{"id":"maria-porta-dell-avvento","numero":92,"title":"Maria Porta dell'Avvento","sub":"","search":"Maria Porta dell'Avvento  Strofa 1 Maria,   tu porta   dell'Avvento,     Signora    del silenzio,        sei chiara  come    aurora,   in cuore   hai  la parola.  Ritornello Beata,   tu hai  creduto,      beata,   tu hai  creduto.  Strofa 2 Maria,   tu strada   del  Signore,   maestra   nel  pregare,        fanciulla  dell'attesa,   il Verbo   in te riposa.  Strofa 3 Maria,   tu madre    del  Messia,   per  noi  dimora    sua,        sei arca  d'alleanza,   in  te Dio  è  presenza."},{"id":"mi-arrendo-al-tuo-amore","numero":93,"title":"Mi Arrendo al Tuo Amore","sub":"RNS","search":"Mi Arrendo al Tuo Amore  Intro  Strofa 1 Sotto la tua croce apro le mie braccia, accolgo il tuo perdono, la tua misericordia Adoro  nel silenzio il tuo splendore, il volto tuo che libera il mio cuore  Ritornello        Mi arrendo al tuo amore, Signore Gesù        Non  posso restare lontano da te        Mi arrendo al tuo amore, Signore Gesù        Alla tua presenza per sempre resterò  Strofa 2 Ai piedi della croce visiti il mio cuore, mi doni la tua pace, consoli la mia vita Contemplo   la maestà della tua gloria, il sangue tuo che sana le ferite  Ritornello finale        Mi arrendo al tuo amore, Signore Gesù        Non  posso restare lontano da te        Mi arrendo al tuo amore, Signore Gesù        Alla tua presenza per sempre resterò"},{"id":"mi-basta-la-tua-grazia","numero":94,"title":"Mi Basta la Tua Grazia","sub":"","search":"Mi Basta la Tua Grazia  Intro  Strofa 1 Quando      sono   debole,   allora  sono   forte perché,   tu  sei la mia   forza. Quando      sono   triste è in te  che  trovo   gioia perché,   tu  sei la mia   gioia. Gesù   io  confido   in  te,  Gesù,  mi   basta  la tua  grazia.  Ritornello Sei  la mia  forza,  la mia   salvezza,       sei la mia   pace,  sicuro   rifugio.       Nella   tua  grazia  voglio   restare,       Santo   Signore,   sempre    con   te.  Interludio  Strofa 2 Quando      sono   povero,    allora  sono   ricco perché,   sei la  mia  ricchezza. Quando      son  malato    è in te  che  trovo   vita perché,   tu  sei guarigione. Gesù   io  confido   in  te, Gesù,   mi  basta  la tua  grazia.  Ritornello finale (x2) Sei  la mia  forza,  la mia   salvezza,       sei la mia   pace,  sicuro   rifugio.       Nella   tua  grazia  voglio   restare,       Santo   Signore,   sempre    con   te.       Sei la mia   forza,  la mia   salvezza,       sei la mia   pace,  sicuro   rifugio.       Nella   tua  grazia  voglio   restare,       Santo   Signore,   sempre    con   te.  Finale"},{"id":"nel-tuo-silenzio","numero":95,"title":"Nel Tuo Silenzio","sub":"Gen · Messa Come fuoco vivo","search":"Nel Tuo Silenzio  Solo strumentale Solo flauto 1  Strofa 1      Nel   tuo  silenzio  accolgo    il mistero  venuto    a  vivere  dentro    di me.      Sei  tu che  vieni,  o  forse  è più  vero   che  tu mi  accogli   in te,      Gesù.  Solo flauto 2  Strofa 2      Sorgente    viva  che   nasce  nel  cuore   è questo    dono   che   abita  in me.      La  tua  presenza    è un  fuoco   d'amore     che  avvolge    l'anima   mia,   Gesù.  Solo flauto 3  Strofa 3 - modulazione in FA      Ora   il tuo  Spirito  in me   dice:  \"Padre\",    non   sono   io a parlare,   sei tu.      Nell'infinito    oceano    di pace   tu vivi  in me,   io in te,     Gesù."},{"id":"non-avere-paura","numero":96,"title":"Non Avere Paura","sub":"","search":"Non Avere Paura  Intro Ritornello               Ma   non   avere   paura,   non   ti fermare   mai               Perché    il mio  amore    è fedele,   e non   finisce mai  Strofa 1    Guardo     sempre    dentro    me  e  non   vedo   te    C'è  rumore    nel  mio   cuor   e non   so perché  Strofa 2    Non    sapere   cosa  dir  non   saper  che  far    Fai  silenzio  dentro    te ed  ascolta   me  Strofa 3    Ogni    volta  che  tu  vuoi  tu  mi  troverai    E  l'amore   mio,   lo sai non   finisce  mai"},{"id":"non-vivere-di-corsa","numero":97,"title":"Non Vivere di Corsa","sub":"","search":"Non Vivere di Corsa  Strofa 1 Non    vivere  di  corsa  ma   fermati   a guardare    la  strada  che  percorri così  un  giorno   ti accorgerai    di non   aver  vissuto   un'esistenza    inutile.  Ritornello Non   temere    non   sei solo  Lui  cammina     sempre    insieme   a  te           chiede   solo  di avere   in Lui  fiducia  di  accettarlo   di amarlo  Strofa 2 C'è  gente   che  ride  anche   di  te cui basta   il conto  in  banca   l'ossequio   riverente e non   si rende   conto   che   solo  tu Signore   puoi   dar  la vera   gioia.  Strofa 3 Signore   io  non   posso   venire   sono   stanco   e ho  da  fare  ho  i figli da guardare io  devo   pur  studiare   sfruttando    il tempo    libero  non   posso   a Te  pensare.  Strofa 4 Io  temo   d'ingannarmi      scegliendo    la Tua   strada  amando      tutti quanti ma   so  che  sei risorto  che  una   speranza    nuova    Tu  stesso  ci hai donato"},{"id":"oggi-e-un-giorno-di-festa","numero":98,"title":"Oggi È un Giorno di Festa","sub":"","search":"Oggi È un Giorno di Festa  Intro  Ritornello Oggi   è  un  giorno   di fe  - sta      Per  i figli di Dio      Oggi   è un   giorno   di festa      Nella         casa  del  padre  Strofa 1                     Venite,       accorre    -  te:                           ci chiama    il Dio  della  vita;                           saremo    tanti     fratelli                           uniti  intorno   al Signore.  Strofa 2                     Cantate    inni e  salmi:                           ci chiama    il Dio  della  gioia,                           saremo    una   grande   assemblea                           che  intona   le lodi  al Signore  Strofa 3                     Venite,   esultate:                           ci chiama    il Dio  della  vita;                           saremo    tanti  fratelli                           che  cantan    le lodi al  Signore"},{"id":"ogni-mia-parola","numero":99,"title":"Ogni Mia Parola","sub":"Gen Verde","search":"Ogni Mia Parola  Intro  Strofa                     Come    la pioggia   e  la neve                     scendono     giù dal  cielo                     e non   vi ritornano    senza   irrigare                     e far germogliare     la terra,                     così ogni   mia  Parola   non   ritornerà   a  me                     senza  operare    quanto    desidero,                     senza  aver   compiuto                     ciò per  cui  l'avevo   mandata.                     Ogni   mia  Parola,                     Ogni   mia  Parola"},{"id":"osanna-al-figlio-di-david","numero":100,"title":"Osanna","sub":"Al Figlio di David","search":"Osanna Al Figlio di David Intro  Ritornello (x2) Osanna    al figlio di  Da  -  vid,     Osanna    al Redentor  Strofa 1    Apritevi,   o porte   eterne,          avanzi   il Re della  gloria,    adori  cielo  e  terra, l'eterno   suo  poter.  Ripetere il ritornello  Strofa 2    O    stillate dolcezza,           il Re  dell'amor    s'avvicina,    si dona   pane   e vino   ed  offre  pace  al  cuor.  Ripetere il ritornello  Strofa 3    O  Vergine,    presso  l'Altissimo           trovasti  grazia   e onor,    soccorri   i tuoi figlioli, donando     il Salvator.  Ripetere il ritornello"},{"id":"padre-nostro-s-andrea","numero":101,"title":"Padre Nostro","sub":"S. Andrea","search":"Padre Nostro S. Andrea Strofa 1                  Padre   nostro   tu  che  stai,                  in chi  ama   la verità,                  ed  il regno   che  lui ci lasciò,                  venga    presto  nel  nostro   cuor,                  e l'amore    che  il suo  Figlio  ci donò,                  o  Signor,  rimanga     sempre    in noi  Strofa 2                  E nel  pan   dell'unità,                  dacci  la fraternità,                  e dimentica    il nostro   mal,                  che  anche   noi  sappiamo      perdonar                  non   permettere     che  cadiamo     in tentazion                  o Signor,   abbi  pietà   del mondo.  Padre nostro recitato  Ripresa                  E nel  pan   dell'unità..."},{"id":"padre-nostro-s-marco","numero":102,"title":"Padre Nostro","sub":"S. Marco","search":"Padre Nostro S. Marco Intro  Preghiera Padre   nostro   che  sei  nei cieli sia    santificato  il tuo  nome Venga    il tuo  regno   sia fatta la  tua volontà Come     in cielo  così in  terra, dacci     oggi  il nostro   pane   quotidiano E rimetti   a noi  i nostri  debiti come    noi  li rimettiamo    ai nostri  debitori E non   ci indurre   in  tentazione,    ma   liberaci  dal male. Finale Amen.                          amen.                          amen."},{"id":"pane-del-cielo","numero":103,"title":"Pane del Cielo","sub":"Gen Rosso","search":"Pane del Cielo  Ritornello (x2)         Pane   del  cielo  Sei tu  Gesù         Via  d'amore     Tu  ci fai come    te  Strofa 1 No   non   è rimasta   fredda    la terra, tu  sei rimasto   con   noi  Per  nutrirci  di Te Pane   di vita  Ed  infiammare     col  tuo  amore    tutta  l'umanità  Strofa 2 Si il cielo è qui  su  questa   terra,  tu sei rimasto   con   noi,  ma   ci porti  con  Te Nella   Tua  casa,  dove    vivremo    insieme    a Te   tutta  l'eternità  Strofa 3 No,   la morte    non   può  farci  paura,   tu sei rimasto    con  noi,  e chi  vive  di Te Vive   per  sempre,    sei Dio  con   noi,  sei Dio  per  noi,  Dio   in mezzo    a noi"},{"id":"pane-di-vita-nuova-capo-1","numero":104,"title":"Pane di Vita Nuova","sub":"Capo 1","search":"Pane di Vita Nuova Capo 1 Strofa 1    Pane    di   vita nuo  - va,    vero  cibo dato  agli uomini,    Nutri-mento   che  sostiene  il mondo,    dono   splendido  di gra - zia.  Strofa 2    Tu sei sublime  frut - to    di quell'albero  di vita    che Adamo    non  poté  toccare:    ora è in Cristo a noi  dona  - to.  Ritornello Pane  della  vi - ta,         sangue  di   salve   -  zza,         vero   corpo,  vera  bevanda,         cibo di grazia  per  il mo - ndo  Strofa 3    Sei l'Agnello immolato    nel cui sangue  è la salvezza,    memoriale   della  vera Pasqua    della Nuova   Alleanza.  Strofa 4    Manna   che  nel deserto    nutri il popolo  in cammino,    sei sostegno  e forza nella prova    per la Chiesa  in mezzo   al mondo.  Ripetere il ritornello  Finale A     -   men"},{"id":"pane-vivo-sei","numero":105,"title":"Pane Vivo Sei","sub":"","search":"Pane Vivo Sei  Strofa 1    Venne   il tempo  stabilito    di discendere  fra i tuoi.    Come   uomo    hai fissato la tua tenda fra di noi.    Il Santuario è spalancato    la Tua Gloria  appare   già.    Ogni  uomo   può   vedere  ora  cosa sia la verità.  Ritornello    Pane  Vivo  sei,         per  Amore   mio.    Ti sei dato tutto quanto   a me,  mio  Dio.    Dove   mai andrò,    per trovare  chi mi  amerà  di più    più di quanto   mi ami  tu Gesù.  Strofa 2    Sulla croce hai offerto    la Tua vita al Padre  tuo.    Ora  offri in questo Pane   la Tua vita a noi.    Sacrificio per Amore,    Chiedi  a chi Ti seguirà.    Chi ha  donato   la sua vita, oggi in te la troverà."},{"id":"pellegrini-di-speranza-capo-3","numero":106,"title":"Pellegrini di Speranza","sub":"Capo 3","search":"Pellegrini di Speranza Capo 3 Intro  Ritornello      Fiamma    vi --- va  della mia  speranza      questo   canto           giunga  fino  a Te!      Grembo     ete - rno d'infinita   vi -- ta      nel  cammino       io    confido  in Te.  Strofa 1    Ogni      lingua, popolo   e nazione    trova luce  nella tua Parola.    Figli e figlie fragili e dispersi    sono  accolti  nel  tuo Figlio amato.  Strofa 2    Dio  ci guarda, tenero  e paziente:    nasce  l'alba di un futuro nuovo.    Nuovi   Cieli, Terra fatta nuova:    passa i muri  Spirito di vita.  Strofa 3    Alza gli occhi, muoviti  col vento,    serra il passo: viene Dio,  nel tempo.    Guarda   il Figlio che s'è fatto Uomo:    mille e mille trovano   la via."},{"id":"pietro-vai","numero":107,"title":"Pietro Vai","sub":"","search":"Pietro Vai  Strofa 1 Signore,   ho  pescato    tutto  il giorno,   le reti son  rimaste   sempre    vuote; s'è fatto  tardi,  a casa  ora  ritorno:   Signore,   son   deluso,   me   ne  vado.  La  vita con   me   è sempre    stata  dura,  e  niente  mai   mi  dà  soddisfazione; la strada   in cui mi   guidi  è insi - cura:  sono   stanco   ed  ora  non   aspetto   più.  Ritornello 1 Pietro,  vai,  fidati di me:       getta   ancora   in acqua    le tue  re   - ti. Prendi   ancora    il largo sulla  mia  parola:   con   la mia  potenza     io ti farò pescatore    di uomi    - ni.  Strofa 2 Maestro,    dimmi    cosa   devo   fare;  insegnami,    Signore,   dove   andare. Gesù,   dammi     la forza  di  partire,  la forza  di lasciare   le mie  cose;  Questa    famiglia   che  mi  son  creato,   le barche   che   a fatica  ho  conquistato, la casa,  la mia   terra, la  mia    gente,  Signore,    dammi    tu  una  fede   forte.  Ritornello 2 Pietro  vai,  fidati di  me:      la mia  Chiesa   su  di te io  fonderò. Manderò      lo Spirito,  ti darà  coraggio;    donerà    la forza   dell'  amore per  il Regno   di    Di  -  o."},{"id":"pim-pam","numero":108,"title":"Pim Pam","sub":"","search":"Pim Pam  Strofa 1                     Nella   casa  la sulla  montagna                         Un  camino    grande    grande    sta.                         Nel  camino    grande    grande   grande                         Un  gran   fuoco   fuoco   fuoco   va.  Ritornello Perciò   pim   pam,   le scarpe   pim   pam       Di  notte   fan  sul sentiero   di pietre  grosse       Pim   pam    le scarpe   pim  pam       Di  notte   fan  sul sentiero   così: PIM    PAM!  Strofa 2                     Nella  casa  la sulla  montagna                         Un  Signore   grande    grande    sta                         Nella  stanza   viola,  verde,   gialla                         Tante   sedie  rosse  e bianche    ha.  Strofa 3                     Nella  casa  la sulla  montagna                         Una   sedia  a tutti tutti dà                         A ciascuno    toglierà  le  scarpe                         Tutti insieme    poi  si danzerà."},{"id":"popoli-tutti","numero":109,"title":"Popoli Tutti","sub":"","search":"Popoli Tutti  Intro  Strofa 1    Mio   Dio,  Signore,   nulla  è  pari  a Te    ora  e per  sempre,    voglio   lodare il Tuo  grande    amor     per   me.    Mia   Roccia   Tu  sei, pace   e conforto    mi  dai. Con   tutto  il cuore   e le mie   forze,  sempre    io Ti  ado   -  re  -  rò.  Ritornello 1      Popoli   tutti acclamate     al Signore,   gloria  e  potenza    cantiamo    al Re,      Mari   e monti    si prostrino   a Te,  al Tuo   nome,    o     Signore.      Canto    di gioia  per  quello   che  fai, per  sempre    Signore   con   Te  resterò,      Non    c'è promessa,     non   c'è fedeltà   che  in Te!  Strofa 2    Mio   Dio,  Signore,   nulla  è  pari  a Te    ora  e per  sempre,    voglio   lodare il Tuo  grande    amor     per   me.    Mia   Roccia   Tu  sei, pace   e conforto    mi  dai. Con   tutto  il cuore   e le mie   forze,  sempre    io Ti  ado   -  re  -  rò.  Ritornello finale      Popoli   tutti acclamate     al Signore,   gloria  e  potenza    cantiamo    al Re,      Mari   e monti    si prostrino   a Te,  al Tuo   nome,    o     Signore. Modulazione in SI      Canto    di gioia  per  quello   che  fai, per  sempre    Signore   con   Te  resterò,      Non    c'è promessa,     non   c'è fedeltà   che  in Te! Ritornello finale in SI      Popoli   tutti acclamate     al Signore,   gloria  e  potenza    cantiamo    al Re,      Mari   e monti    si prostrino   a Te,  al Tuo   nome,     o         Signore.      Canto    di gioia  per  quello   che  fai, per  sempre    Signore   con   Te  resterò,      Non    c'è promessa,     non   c'è fedeltà   che  in Te! Finale      Non    c'è promessa,     non   c'è fedeltà   che  in Te!      Non    c'è promessa,     non   c'è fedeltà   che  in Te!"},{"id":"potente-sei-mio-signor-volendo-capo-2","numero":110,"title":"Potente Sei Mio Signor","sub":"Volendo, capo 2","search":"Potente Sei Mio Signor Volendo, capo 2 Intro  Strofa 1         Dio  di misericordia,  amore   che non  muore,   riempi  il mio cuor.         Dio  che perdona    sempre,  Padre  di tenerezza,  speranza   eterna.  Ritornello 1    Mio  Dio  muovi   le montagne    potente  sei, mio  Signor    So che  mi salverai        per  sempre  Dio  della Salvezza    La morte   hai vinto per  noi     Tu  hai vinto per  noi  Interludio 1  Strofa 2        Mi  accogli come   sono,  non  guardi  ai miei errori, riempi  il mio cuor.         Ti dono   la mia vita, mi  arrendo  a te, Signore,  speranza  eterna.  Ritornello 2    Mio  Dio  muovi   le montagne    potente  sei, mio  Signor    So che  mi salverai        per  sempre  Dio  della Salvezza    La morte   hai vinto per  noi     Tu  hai vinto per  noi  Interludio 2  Ponte (x2)      La tua luce       sempre   splenderà,      Gloria      Noi  cantiamo        a Gesù  il Signor,     Gloria      La tua luce       sempre   splenderà,      Gloria      Noi  cantiamo        a Gesù  il Signor  Ritornello finale    Mio  Dio  muovi   le montagne    potente  sei, mio  Signor    So che  mi salverai        per  sempre  Dio  della Salvezza    La morte   hai vinto per  noi     Tu  hai vinto per  noi  Ponte finale (x2)      La tua luce       sempre   splenderà,      Gloria      Noi  cantiamo        a Gesù  il Signor,     Gloria      La tua luce       sempre   splenderà,      Gloria      Noi  cantiamo        a Gesù  il Signor"},{"id":"quale-gioia-salmo-121","numero":111,"title":"Quale Gioia","sub":"Salmo 121","search":"Quale Gioia Salmo 121 Ritornello Quale   gioia  mi  dissero,                              andremo     alla  casa  del  Si -  gno   - re.                              Ora   i piedi,  o Gerusa    - lemme                              si fermano    davanti    a te.  Strofa 1                   Ora   Gerusalemme       è    ricostruita                      come    città salda  forte  e  unita.  Strofa 2                   Salgono    insieme   le tribù  di  Jahvè                      per  lodare   il nome    del Dio   d'Israele.  Strofa 3                   Là  sono   posti  i seggi della  sua  giustizia                      i seggi  della  casa  di Davide.  Strofa 4                   Domandate       pace   per  Gerusalemme                      sia pace   a chi  ti ama,  pace   alle tue  mura.  Strofa 5                   Su  di te sia la pace,   chiederò    il tuo bene                      per  la casa  di Dio   chiederò    la gioia.  Strofa 6                   Noi   siamo   il suo  popolo,    Egli è il nostro   Dio                      possa   rinnovarci    la felicità."},{"id":"quale-gioia-e-star-con-te","numero":112,"title":"Quale Gioia È Star con Te","sub":"","search":"Quale Gioia È Star con Te  Strofa 1 Ogni volta che ti cerco, ogni volta che ti invoco, Sempre mi accogli Signor. Grandi sono i tuoi prodigi, Tu sei buono verso tutti, Santo Tu regni tra noi.  Ritornello Quale gioia è star con Te Gesù vivo e vicino, Bello è dar lode a Te, Tu sei il Signor. Quale dono è aver creduto in Te che non mi abbandoni, Io per sempre abiterò la Tua casa, mio Re.  Strofa 2 Hai guarito il mio dolore, hai cambiato questo cuore, Oggi rinasco, Signor. Grandi sono i tuoi prodigi, Tu sei buono verso tutti, Santo Tu regni tra noi.  Strofa 3 - modulazione in LA Hai salvato la mia vita, hai aperto la mia bocca, Canto per Te, mio Signor. Grandi sono i tuoi prodigi, Tu sei buono verso tutti, Santo Tu regni tra noi.  Ritornello finale Quale gioia è star con Te Gesù vivo e vicino, Bello è dar lode a Te, Tu sei il Signor. Quale dono è aver creduto in Te che non mi abbandoni, Io per sempre abiterò la Tua casa, mio Re. Finale Io per sempre abiterò la Tua casa, mio Re."},{"id":"qui-con-te","numero":113,"title":"Qui con Te","sub":"","search":"Qui con Te  Strofa 1 C'è silenzio intorno a noi e in un istante il pensiero vola a Lui che certo sta seduto accanto a me e sta chiedendo se voglio amarlo come Lui mi ha amato già dal giorno in cui sono stato posto qua con quell'idea di pace e libertà che nei suoi occhi brilla.  Ritornello Tu che risplendi se mi trattengo ancora un po' abbracciato a Te e mi chiedi una follia, questa vita mia che mi vien da vivere qui con Te, perché non mi lasci mai mi sostieni quando io cederei e poi canti d'allegria per la malattia che ho di voler vivere qui con Te.  Strofa 2 - modulazione in LA Questo mondo corre e va su larghe strade verso tristi oscurità. ma c'è un sentiero che lassù si inerpica e c'è una vetta chi la scalerà?  Ritornello finale Tu che risplendi se mi trattengo ancora un po' abbracciato a Te e mi chiedi una follia, questa vita mia che mi vien da vivere qui con Te, perché non mi lasci mai mi sostieni quando io cederei e poi canti d'allegria per la malattia che ho di voler vivere qui con Te. Finale (x2) con Te, qui con Te..."},{"id":"re-dei-re-capo-1","numero":114,"title":"Re dei Re","sub":"Capo 1","search":"Re dei Re Capo 1 Intro  Strofa 1    Hai sollevato  i nostri volti dalla polvere     le nostre colpe  hai portato  su di te.     Signore  ti sei fatto uomo  in tutto come   noi,    Per    a  -  mo   -  re  Ritornello    Figlio dell'Altissimo, povero   tra i poveri, vieni a dimorare   tra noi    Dio  dell'impossibile, Re  di tutti i secoli, vieni nella tua maestà.    Re    dei   Re,     i popoli  ti acclamano,  i cieli ti proclamano.    Re    dei   Re,     Luce  degli uomini,   regna col  tuo Amore   tra no-o-o-i.    O-o-o-oh,   O-o-o-oh,   O-o-o-oh.  Strofa 2    Ci hai riscattati dalla stretta delle tenebre    perché  potessimo   glorificare te.    Hai riversato  in noi la vita del tuo Spirito    Per amore.  Ripetere il ritornello  Ponte    Tua   è    la glo - ria per   se   -   mpre    Tua   è    la glo - ria per   se   -   mpre    Gloria,    gloria    Gloria,    gloria  Ripetere il ritornello"},{"id":"regno-nuovo","numero":115,"title":"Regno Nuovo","sub":"","search":"Regno Nuovo  Strofa 1 Tu  mio   Signore   tra  noi  sei venuto ed  un  nuovo    regno    ci hai annunziato, un  regno    assurdo   d'amore     e di pace, un  mondo     in  cui l'uomo    nasce   morendo, un  mondo     in  cui egli vince   perdendo.  Strofa 2                   Egli fu  re negli  stracci  di un  bimbo,                   scelse  una  madre     uguale    alle altre,                   ebbe   bisogno    dell'uomo     perché   ci ama;                   Lo  ringraziamo     donandogli      una  croce.  Strofa 3 Non    abbiam    compreso     il tuo  mondo     Signore, siam   troppo   egoisti,  orgogliosi,    perfetti per  poter   capire  l'amor    che  ci hai donato abbiam    troppa    paura   di essere   diversi in un   mondo     troppo    vecchio   che  non   vuol   cambiare.  Strofa 4                   Ma   noi  come    Lui  dobbiamo      aver  coraggio                   di amare    il nemico,    l'assassino,  il peccatore                   anche   se  la gente   li giudica  e condanna                   solo  perché    han  la colpa   di aver   sbagliato."},{"id":"resta-accanto-a-me","numero":116,"title":"Resta Accanto a Me","sub":"","search":"Resta Accanto a Me  Intro  Ritornello Ora  vado    sulla mia   strada   con   l'amore   tuo   che  mi  guida             o Signore,   ovunque      io vada    resta  accanto   a  me             Io ti prego,   stammi    vicino   ogni   passo   del mio   cammino             ogni  notte,   ogni  mattino     resta  accanto   a  me.  Strofa 1      Il tuo sguardo    puro   sia luce  per  me             e la tua  parola   sia voce   per  me.             Che   io trovi  il senso  del  mio   andare   solo   in   te,             nel  tuo  fedele  amare    il mio  perché.  Strofa 2      Fa'  che  chi mi  guarda    non   veda   che  te             fa' che  chi  mi  ascolta  non   senta  che   te             e chi  pensa   a me,   fa' che  nel  cuore             pensi  a  te e trovi  quell'amore     che  hai  dato   a me."},{"id":"resta-qui-con-noi","numero":117,"title":"Resta Qui con Noi","sub":"Gen Rosso","search":"Strofa 1 Le ombre si distendono, scende ormai la sera E s'allontanano dietro i monti, i riflessi di un giorno che non finirà Di un giorno che ora correrà sempre perché sappiamo che una nuova vita Da qui è partita e mai più si fermerà Ritornello Resta qui con noi il sole scende già Resta qui con noi Signore è sera ormai Resta qui con noi il sole scende già Se tu sei fra noi la notte non verrà Strofa 2 S'allarga verso il mare il tuo cerchio d'onda Che il vento spingerà fino a quando giungerà ai confini di ogni cuore Alle porte dell'amore vero Come una fiamma che dove passa brucia Così il tuo amore tutto il mondo invaderà Strofa 3 Davanti a noi l'umanità lotta, soffre e spera Come una terra che nell'arsura chiede l'acqua da un cielo senza nuvole Ma che sempre le può dare vita Con te saremo sorgente d'acqua pura Con te fra noi il deserto fiorirà"},{"id":"resto-con-te","numero":118,"title":"Resto con Te","sub":"","search":"Resto con Te  Intro  Strofa 1    Seme  gettato  nel mondo,    Figlio donato   alla terra,    il tuo silenzio   custodirò    In ciò che vive  e che muore    vedo  il tuo volto  d'amore:    sei il mio Signore    e  sei il mio Dio.  Ritornello 1 Io lo so che Tu  sfidi la mia morte    io lo so che Tu  abiti il mio buio    nell'attesa del giorno  che  verrà    Resto  con  Te.  Strofa 2    Nube   di mandorlo   in fiore    dentro  gli inverni del cuore    è questo  pane       che  Tu  ci dai.    Vena  di cielo profondo     dentro  le notti del mondo    è questo  vino     che  Tu  ci dai.  Ritornello 2 Io lo so che Tu  sfidi la mia morte    io lo so che Tu  abiti il mio buio    nell'attesa del giorno  che verrà    Resto  con Te.  Interludio  Finale    Tu sei Re  di stellate immensità    e sei Tu il futuro che verrà    sei l'amore  che muove    ogni realtà    e Tu sei qui    Resto  con Te"},{"id":"resurrezione","numero":119,"title":"Resurrezione","sub":"Gen Rosso","search":"Resurrezione  Intro  Strofa 1                   Che   gioia  ci hai  dato,  Signore    del cielo,                   Signore    del grande    univer    - so,                   che  gioia   ci hai dato,   vestito  di luce                   vestito   di gloria  infini  -  ta,                   vestito   di gloria  infini  -   ta.  Interludio 1  Strofa 2                   Vederti   risorto,  vederti   Signore                   il cuore   sta per  impazzi     -  re                   Tu   sei ritornato,   Tu  sei qui  tra noi                   e  adesso   ti avremo    per  sem   - pre,                   e  adesso   ti avremo    per  sem   - pre.  Interludio 2  Strofa 3                        Chi  cercate,  donne,    quaggiù,                   chi  cercate,  donne,    quaggiù,                   quello   ch'era  morto    non   è  qui                   è  risorto!  Sì, come   aveva    detto  anche    a voi.                   Voi   gridate  a  tutti che                   è  risorto  Lui,    tutti che    è risorto  Lui.  Interludio 3  Strofa 4                        Tu  hai  vinto  il mondo,     Gesù,                   Tu   hai vinto   il mondo,    Gesù,                   liberiamo    la felicità                   e  la morte,   no,  non   esiste  più, l'hai vinta Tu                   e  hai salvato   tutti noi,                   uomini    con   Te,    tutti noi,  uomini    con   Te.  Finale                   uomini    con   te (uomini    con  te)                   che  gioia   ci hai dato:   ti avremo    per  sempre!"},{"id":"salve-regina","numero":120,"title":"Salve Regina","sub":"","search":"Salve Regina  Ritornello (x2)    Salve  Regina,   Madre     di  misericordia.    Vita, dolcezza,    speranza    nostra,   salve!  Salve  Regina!  Strofa                  A  te  ricorriamo,    esuli figli di Eva.                  A  te  sospiriamo,    piangenti,    in  questa   valle  di lacrime.                  Avvocata     nostra,   volgi  a noi  gli occhi   tuoi,                 mostraci   dopo    questo   esilio  il frutto   del  tuo  seno,   Gesù.  Ritornello finale    Salve  Regina,   Madre     di  misericordia.    O  clemente,    o  pia, o  dolce   Vergine   Maria. Coda    Salve  Regina!    Salve  Regina,    salve,                 salve!"},{"id":"san-francesco","numero":121,"title":"San Francesco","sub":"","search":"San Francesco  Intro Strofa 1 O  Signore    fa' di me   uno  strumento, fa' di me   uno   strumento     della  tua  pace: dov'è   odio,   che  io porti  l'amore, dov'è   offesa  che   io porti  il perdono, dov'è   dubbio    che  io porti   la fede, dov'è   discordia   che  io  porti  l'unione, dov'è   errore   che  io porti  verità, a chi  dispera   che  io porti   la speranza. Dov'è   errore   che  io  porti  verità, a chi  dispera   che  io porti   la speranza.  Ritornello 1 O  maestro    dammi     tu un  cuore   grande           che  sia  goccia  di  rugiada   per  il mondo           che  sia  voce  di  speranza    che  sia un  buon    mattino           per  il giorno   di ogni   uomo         e con   gli ultimi  del mondo           sia il mio   passo  lieto  nella  povertà,    nella  povertà. Ritornello 2           O   maestro    dammi    tu  un  cuore   grande           che  sia  goccia  di  rugiada   per  il mondo           che  sia  voce  di  speranza    che  sia un  buon    mattino           per  il giorno   di ogni   uomo         e con   gli ultimi  del mondo           sia il mio   passo  lieto  nella  povertà,    nella  povertà.  Strofa 2 O  Signore    fa' di me   il tuo canto, fa' di me   il tuo  canto   di pace: a chi  è triste che  io  porti  la gioia a chi  è nel  buio   che  io porti  la luce. È donando      che  si ama   la vita è servendo     che  si vive  con  gioia, perdonando       che  si trova  il perdono, è morendo      che  si vive  in eterno."},{"id":"santa-maria-del-cammino","numero":122,"title":"Santa Maria del Cammino","sub":"","search":"Santa Maria del Cammino  Strofa 1 Mentre    trascorre   la vita         Solo   Tu  non   sei mai      Santa   Maria   del  cammino           Sempre    sarà  con  te  Ritornello           Vieni  o  madre    in mezzo    a  noi  Vieni  Maria   quaggiù           Cammineremo         insieme   a Te  Verso    la libertà  Strofa 2 Quando      qualcuno    ti dice        \"Nulla   mai   cambierà\"      Lotta  per   un  mondo     nuovo        Lotta  per  la verità  Strofa 3 Lungo    la strada   la gente  Chiusa    in sé stessa  va      Offri  per  primo    la mano    A  chi è  vicino  a  te  Strofa 4 Quando      ti senti ormai   stanco   E  sembra    inutile andar      Tu  vai  tracciando    un  cammino      Un   altro  ti seguirà"},{"id":"santo","numero":123,"title":"Santo","sub":"","search":"Santo  Santo Santo,   Santo,   Santo,   Santo  il Signore   Dio   dell'universo! I cieli e la terra,  sono   pieni  della  Tua   gloria!  Osanna                 Osanna,    Osanna,    Osanna,     Osanna                 Osanna,    Osanna,    nell'alto   dei cieli.  Benedetto Benedetto     colui,  che  viene   nel  nome    del  Signore! Benedetto     colui,  che  viene   nel  nome    del  Signore!  Osanna finale                 Osanna,    Osanna,    Osanna,     Osanna                 Osanna,    Osanna,    nell'alto   dei cieli."},{"id":"santo-classico","numero":124,"title":"Santo","sub":"Classico","search":"Santo Classico Intro  Santo    Santo   Santo   Santo    Il Signore   Dio   dell'universo    I cieli e la terra         Sono   pieni   della  Tua  gloria  Osanna           Osanna       Osanna      Osanna     nell'alto  dei  cieli più, sempre    in  più  Strofa 2 Scusa   Signore   se entriamo     nella  reggia  della  luce  siamo   noi Scusa   Signore   se sediamo     alla mensa    del  tuo  corpo   per  saziarci  di Te  Strofa 3 Scusa   Signore   quando     usciamo    dalla  strada  del  Tuo  amore     siamo   noi Scusa   Signore   se ci vedi  solo  all'ora  del  perdono,     ritornare   da  Te"},{"id":"se-m-accogli","numero":130,"title":"Se M'Accogli","sub":"","search":"Se M'Accogli  Strofa 1          Tra le  mani   non   ho  niente,   spero  che  mi   accoglierai:          chiedo   solo  di  restare  accanto    a Te.          Sono   ricco  solamente     dell'Amore     che  mi  dai:          è per  quelli  che  non   l'hanno   avuto    mai.  Ritornello                Se  m'accogli,   mio   Signore,   altro  non   Ti chiederò                e  per  sempre    la tua  strada,  la mia   strada  resterà.                Nella   gioia,  nel  dolore,   fino  a quando     Tu vorrai,                con   la mano    nella  tua  camminerò!  Strofa 2    Io ti prego   con  il cuore,   so che  Tu  mi  ascolterai:    rendi  forte  la mia   fede  più  che  mai.    Tieni  accesa   la mia  luce  fino  al giorno   che   Tu sai:    con  i miei  fratelli incontro    a Te  verrò."},{"id":"se-tu-vedrai","numero":131,"title":"Se Tu Vedrai","sub":"","search":"Se Tu Vedrai  Strofa 1    Se  tu vedrai   il sole brillare:  alleluia,  alleluia.          Se  ascolterai   il ruscello scrosciare:   alleluia,  alleluia.          Se  sentirai  il canto  dei  monti:   alleluia,  alleluia.          Allora   solo  tu proverai    cos'è  la gioia.  Ritornello Vivi  la vita  con  gioia  e con   amor,          vivi  cantando    la tua  felicità!  Strofa 2    Se  tu vedrai   un  cespuglio    fiorito  alleluia, alleluia.          Se  ascolterai   il rumore   del  vento:   alleluia,  alleluia.          Se  sentirai  il profumo    del  bosco:   alleluia,  alleluia.          Allora   solo  tu proverai    cos'è  la gioia.  Strofa 3    Se  tu vedrai   il sorriso  di un  bimbo:    alleluia,  alleluia.          Se  ascolterai   la canzone    del  cuore:   alleluia, alleluia.          Se  sentirai  la dolcezza    di amare:    alleluia, alleluia.          Allora   solo  tu proverai    cos'è  la gioia."},{"id":"segni-nuovi","numero":132,"title":"Segni Nuovi","sub":"","search":"Segni Nuovi  Ritornello E segni   nuovi   oggi  nascono    già                    e  c'è più  sole  nelle  nostre  città.                    Il mondo     unito   splende   qui  fra  di noi                    è  un ideale   che  la storia  farà,                    un   ideale  che  storia  si fa.  Strofa 1               Vedo   cambiare     le cose  che  stanno    attorno                     crollare  muri   e barriere   fin dal  profondo.                     Vedo   gente   che  vive   la vita                     vedo   in alto  un  cielo  chiaro...  Strofa 2               Ormai    non   è così  strano  sentir  parlare                     di una   casa  comune     dove   abitare                     e l'amore   fra  noi  lo farà,                     invadendo     il mondo     intero."},{"id":"segni-del-tuo-amore","numero":133,"title":"Segni del Tuo Amore","sub":"Gen · Messa Come fuoco vivo","search":"Segni del Tuo Amore  Intro  Strofa 1    Mille e mille grani  nelle spighe  d'oro    mandano    fragranza  e danno   gioia al cuore    quando,   macinati,  fanno  un  pane  solo:    pane  quotidiano,   dono   tuo, Signore.  Ritornello 1    Ecco  il pane e il vino, segni del tuo amore    Ecco  questa offerta, accoglila  Signore:    tu di mille e mille cuori fai un  cuore  solo, un  corpo  solo  in te    e il Figlio tuo verrà e vivrà  ancora  in mezzo   a noi.  Strofa 2    Mille grappoli  maturi  sotto  il sole    festa della terra, donano   vigore    quando   da  ogni perla  stilla il vino nuovo    vino  della gioia, dono  tuo,  Signore.  Ritornello 2    Ecco  il pane e il vino, segni del tuo amore    Ecco  questa offerta, accoglila  Signore:    tu di mille e mille cuori fai un  cuore  solo, un  corpo  solo  in te    e il Figlio tuo verrà e vivrà  ancora  in mezzo   a noi."},{"id":"servire-e-regnare","numero":134,"title":"Servire È Regnare","sub":"","search":"Servire È Regnare  Intro  Strofa 1    Guardiamo      a te  che  sei   Maestro    e  Signore    chinato   a terra  stai,   ci mostri   che  l'amore    è cingersi  il grembiule,      sapersi  inginocchiare,    c'insegni  che   amare             è servire.  Ritornello Fa'  che  impariamo,      Signore,   da  Te,    che  il più grande    è chi  più  sa      servire,    chi si abbassa   e  chi si sa piegare,    perché   grande    è soltanto   l'amore.  Strofa 2    E ti vediamo     poi,    Maestro    e Signore,    che  lavi i piedi  a noi     che  siamo   tue  creature;    e cinto  del  grembiule,       che  è il manto    tuo  regale,    c'insegni  che   servire           è  regnare.  Finale"},{"id":"servo-per-amore","numero":135,"title":"Servo per Amore","sub":"Gen Rosso","search":"Servo per Amore  Strofa 1     Una   notte   di sudore           Sulla barca   in mezzo     al mare     E  mentre   il Cielo  si imbianca    già       Tu guardi   le tue  reti vuote     Ma   la voce   che  ti chiama          Un   altro  mare   ti mostrerà     E  sulle rive  di ogni  cuore          Le tue  reti getterai  Ritornello              Offri  la vita  tua    Come     Maria    ai piedi  della  croce              E  sarai     Servo      di ogni   uomo              Servo   per  amore        Sacerdote    dell'umanità  Strofa 2     Avanzavi     nel silenzio          Fra le lacrime    speravi     Che   il seme   sparso   davanti   a te        Cadesse   sulla  buona    terra     Ora   il cuore  tuo   è in festa       Perché   il grano   biondeggia     ormai     È maturato     sotto  il sole        Puoi   riporlo  nei  granai"},{"id":"siamo-venuti-per","numero":136,"title":"Siamo Venuti per","sub":"","search":"Siamo Venuti per  Intro: intera strofa  Strofa 1 Era cosa scritta rra  fra noi    Con   umiltà   il Tuo  trono   hai  lasciato    Per  dimostrarci    il Tuo  amor  Ripetere il ritornello  Ponte (x4)    Io mai   saprò   quanto    ti costò    Lì sulla croce   morir   per  me  Ripetere il ritornello"},{"id":"spirito-di-dio","numero":138,"title":"Spirito di Dio","sub":"","search":"Spirito di Dio  Invocazione 1                           Spirito  di  Dio  riempimi                           Spirito  di  Dio  battezzami                           Spirito  di  Dio  consacrami                           Vieni   ad  abitare  dentro    me!  Invocazione 2                           Spirito  di  Dio  guariscimi                           Spirito  di  Dio  rinnovami                           Spirito  di  Dio  consacrami                           Vieni   ad  abitare  dentro    me!  Finale in MI                           Spirito  di  Dio  riempici                           Spirito  di  Dio  battezzaci                           Spirito  di  Dio  consa    -  cra    -   ci                           Vieni   ad  abitare  dentro    noi!                           Vieni   ad  abitare  dentro    noi!"},{"id":"stai-con-me","numero":139,"title":"Stai con Me","sub":"","search":"Stai con Me  Strofa 1    Stai con   me,  prote   - ggi - mi,    coprimi   con   le tue  ali, o Dio.  Ritornello Quando      la tempesta    arriverà          Volerò    più  in alto  insieme   a  te,          nelle  avversità   sarai  con  me          ed  io  saprò   che  tu sei il mio  re.  Strofa 2    Il cuore  mio   ripo  - sa  in  te,    io vivrò   in pace   e verità.  Finale Ed  io  saprò  che   tu sei il mio  re,               ed   io saprò   che  tu sei mio   re."},{"id":"su-ali-d-aquila","numero":140,"title":"Su Ali d'Aquila","sub":"Joncas","search":"Su Ali d'Aquila  Strofa 1 Tu  che  abiti al  riparo  del  Signore   e che   dimori   alla sua  ombra,        di' al Signore:   \"Mio   rifugio,  mia  roccia   in cui confido\".  Ritornello E ti rialzerà,  ti solleverà   su ali d'aquila   ti reggerà              sulla brezza    dell'alba  ti farà brillar              come    il sole, così nelle  sue  mani   vivrai.  Strofa 2 Dal  laccio  del  cacciatore   ti libererà  e  dalla  carestia  che  distrugge.        Poi  ti coprirà  con   le sue  ali e rifugio  troverai.  Strofa 3 Non   devi   temere   i terrori  della  notte,  né  freccia  che  vola   di giorno;        mille  cadranno     al tuo  fianco  ma   nulla  ti colpirà.  Strofa 4 Perché   ai suoi  angeli  ha  dato   un  comando        di preservarti   in  tutte le tue  vie;        ti porteranno     sulle loro  mani,   contro    la pietra  non   inciamperai.  Ritornello finale                    E  ti rialzerò,  ti solleverò   su ali d'aquila   ti reggerò                    sulla  brezza   dell'alba  ti farò  brillar                    come    il sole, così  nelle  mie  mani    vivrai."},{"id":"symbolum-77-tu-sei-la-mia-vita","numero":141,"title":"Symbolum 77","sub":"Tu Sei la Mia Vita","search":"Symbolum 77 Tu Sei la Mia Vita Strofa 1 Tu  sei la mia   vita    altro  io non   ho Tu  sei la mia   strada       La  mia  verità Nella   tua  parola     io  camminerò finché  avrò   respiro       fino  a quando     tu vorrai Non    avrò  paura   sai      se tu sei  con  me       io  ti prego  resta  con   me  Strofa 2 Credo    in te Signore,   nato   da  Maria          (Credo  in Te, figlio eterno e Santo) figlio eterno    e santo,  uomo     come    noi Morto    per  amore,    vivo   in mezzo    a  noi   (Morto   per amore,  vivo in mezzo  a noi) una   cosa  sola   con  il Padre   e con  i tuoi Fino   a  quando    io  lo so,  Tu ritornerai      (Fino  a quando  io lo so, tu ritornerai) per  aprirci  il regno   di Dio  Strofa 3 Tu  sei la mia   forza,  altro  io non   ho,  tu sei la mia   pace,   la mia  libertà Niente    nella  vita ci separerà   so  che  la Tua  mano     forte  non   mi  lascerà So  che  da  ogni   male   Tu  mi  libererai   e nel  tuo  perdono     vivrò  Strofa 4 Padre   della  vita   noi  crediamo    in  Te       (Padre, in Te credo, Figlio Eterno) figlio salvatore     noi  speriamo    in Te Spirito  d'amore      vieni  in mezzo    a  noi     (Spirito d'amore, vieni in mezzo  a noi) Tu  da  mille  strade   ci raduni   in unità E per   mille  strade  poi,  dove   tu  vorrai      (E per mille strade poi, dove tu vorrai) noi  saremo    il seme   di Dio"},{"id":"symbolum-80-oltre-le-memorie","numero":142,"title":"Symbolum '80","sub":"Oltre le Memorie","search":"Symbolum '80 Oltre le Memorie Strofa 1 Oltre la memoria    del  tempo   che ho  vissuto,        oltre la speranza  che serve  al mio  domani,        oltre il desiderio di vivere il presente        anch'io confesso  ho  chiesto  che cosa  è verità.        E    tu come   un desiderio    che  non  ha memorie,       Padre    buono,        come  una  speranza   che non   ha confini,   come  un  tempo   eterno   sei per me.  Ritornello Io  so quanto  amore   chiede  questa  lunga   attesa     del tuo  giorno  o Dio;       luce  in ogni cosa  io non  vedo  ancora,   ma  la tua parola        mi rischiarerà.  Strofa 2 Quando    le parole non  bastano   all'amore,        quando   il mio fratello domanda    più  del pane,        quando   l'illusione promette  un  mondo    nuovo,        anch'io rimango   incerto  nel mezzo   del cammino.        E tu figlio tanto amato,  verità  dell'uomo,  mio  Signore,        come  la promessa   di un  perdono   eterno,   libertà infinita sei per me.  Strofa 3 Chiedo  alla mia  mente   coraggio  di cercare,        chiedo  alle mie mani   la forza di donare,        chiedo  al cuore  incerto passione  per  la vita        e chiedo  a te fratello di credere con  me.        E tu forza della vita,  Spirito d'amore,  dolce  Iddio,        grembo   d'ogni  cosa, tenerezza  immensa,    verità del mondo    sei per me."},{"id":"te-al-centro-del-mio-cuore","numero":143,"title":"Te, al Centro del Mio Cuore","sub":"Gen Verde","search":"Te, al Centro del Mio Cuore  Strofa 1           Ho   bisogno    d'incontrarti    nel mio   cuore,           di  trovare   Te,  di stare  insieme   a  Te:           unico   riferimento     del mio   andare,           unica   ragione    Tu,  unico  sostegno    Tu.           Al  centro   del  mio   cuore   ci sei solo  Tu.  Strofa 2           Anche    il cielo gira  intorno    e non   ha  pace,           ma   c'è un   punto   fermo,   è  quella  stella  là.           La  stella polare    è fissa ed  è la sola,           la  stella polare   Tu,  la stella sicura  Tu.  Ritornello                 Tutto  ruota   attorno    a Te,  in funzione    di Te                 e poi  non   importa    il «come»,   il «dove»,   il «se».  Strofa 3          Che   Tu  splenda    sempre    al centro   del  mio   cuore,          il significato  allora  sarai  Tu,          quello   che  farò  sarà  soltanto   amore.          Unico    sostegno    Tu,  la stella polare   Tu.          Al  centro   del  mio  cuore   ci sei solo  tu."},{"id":"testimoni-della-tua-parola-capo-2","numero":144,"title":"Testimoni della Tua Parola","sub":"Capo 2","search":"Testimoni della Tua Parola Capo 2 Strofa 1 Se cerchi la felicità e sogni che non  finisca mai Cerca  con  me  la luce che  ci salverà per sempre E nell'anima   risuonerà         quella  musica  che  ci renderà  Ritornello Testimoni   della tua  Parola noi  saremo   con te Gesù      Testimoni   del Vangelo   anche  noi      Porteremo    quella gioia vera  che  proviene  da  te Gesù      Costruiremo    un futuro  di santità  Strofa 2 Quel  volto  che  hai incontrato  qua  risplende  e non  tramonta   mai alza lo sguardo   e scopri che  è Lui la forza che c'è in te e nell'anima   risuonerà  quella musica  che  ci renderà  Strofa 3 Questo   è il momento    giusto per  donare  il tuo tempo   sai perché la storia cambia  quando    c'è qualcuno   che ha  fede e volontà e nell'anima   risuona già quella  musica  che  ci renderà"},{"id":"ti-lodero-ti-adorero-ti-cantero","numero":145,"title":"Ti Loderò, Ti Adorerò, Ti Canterò","sub":"","search":"Ti Loderò, Ti Adorerò, Ti Canterò  Intro (x2)  Strofa 1    Vivi nel mio cuore da quando ti ho incontrato, sei con me, o Gesù,    accresci la mia fede perché io possa amare come te, o Gesù.    Per sempre io ti dirò  il mio grazie   e in eterno canterò.  Ritornello 1 Ti loderò, ti adorerò, ti canterò che sei il mio Re,         ti loderò, ti adorerò, benedirò soltanto te,         chi è pari a te Signor, eterno amore sei, mio Salvator risorto per me.         Ti adorerò, ti canterò che sei il mio Re,         ti loderò, ti adorerò, benedirò soltanto te.  Strofa 2    Nasce in me, Signore, il canto della gioia, grande sei, o Gesù,    guidami nel mondo  se il buio è più profondo splendi tu, o Gesù.    Per sempre io ti dirò  il mio grazie   e in eterno canterò.  Ritornello 2 Ti loderò, ti adorerò, ti canterò che sei il mio Re,         ti loderò, ti adorerò, benedirò soltanto te,         chi è pari a te Signor, eterno amore sei, mio Salvator risorto per me.          Ti adorerò, ti canterò che sei il mio Re,         ti loderò, ti adorerò, benedirò soltanto te.  Modulazione  Finale in LA    Ti loderò, ti adorerò, ti canterò che sei il mio Re,    ti loderò, ti adorerò, benedirò soltanto te.    Ti loderò,   ti adorerò,     ti canterò,    Ti loderò,   ti adorerò,     ti canterò (ti canterò)"},{"id":"ti-ringrazio-mio-signore","numero":146,"title":"Ti Ringrazio Mio Signore","sub":"","search":"Ti Ringrazio Mio Signore  Ritornello    Ti  ringrazio   mio   Signore   non   ho  più  paura   perché    Con   la  mia  mano    nella  mano    degli  amici   miei    Cammino       tra la gente   della  mia  città     e non   mi   sento  più  solo    Non    sento   la stanchezza    e guardo    dritto  avanti   a me    Perché    sulla mia   strada  ci sei Tu  Strofa 1         Amatevi     l'un  l'altro come    Lui ha  amato    noi             E siate  per  sempre    suoi  amici             E quello   che  farete  al più  piccolo   tra  voi             Credete,   l'avete   fatto  a Lui  Strofa 2         Se amate    veramente     perdonatevi      tra voi,             nel cuore   di  ognuno    ci sia pace             Il Padre  che  è  nei cieli vede   tutti i figli suoi             Con   gioia  a voi  perdonerà  Strofa 3         Sarete  suoi  amici   se vi amate    tra di  voi             E questo   è  tutto  il suo Vangelo             L'amore    non   ha  prezzo,   non   misura   ciò  che  dà             L'amore    confini   non  ne  ha"},{"id":"ti-seguiro","numero":147,"title":"Ti Seguirò","sub":"","search":"Ti Seguirò  Ritornello Ti  seguirò,  ti seguirò   o  Signore,   e    nella  tua    strada   camminerò.  Strofa 1 Ti seguirò   nella  via dell'amore     e donerò    al mondo      la vita.  Strofa 2 Ti  seguirò   nella  via del  dolore    e la tua  croce  ci salverà.  Strofa 3 Ti  seguirò   nella  via della  gioia   e la tua  luce  ci guiderà."},{"id":"tu-sei-sorgente-viva","numero":148,"title":"Tu Sei Sorgente Viva","sub":"","search":"Tu Sei Sorgente Viva  Invocazione                                Tu    sei sorgente    vi  - va,                                Tu  sei fuo  - co,    sei     carità.                                Vieni   Spirito        Santo,                                Vieni   Spirito  Santo!"},{"id":"tu-sei","numero":149,"title":"Tu Sei","sub":"Capo 2","search":"Tu Sei  Strofa 1    Tu  sei la prima    stella del  mattino,    Tu  sei la nostra   grande    nostalgia    Tu  sei il cielo chiaro   dopo    la paura    dopo    la paura   di esserci  perduti    e tornerà   la vita  in questo    mare.  Ritornello Soffierà,  soffierà  il vento   forte  della  vita,         Soffierà  sulle  vele  e le gonfierà   di  Te.         Soffierà,  soffierà  il vento   forte  della  vita,         Soffierà  sulle  vele  e le gonfierà   di  Te.  Strofa 2    Tu  sei l'unico  volto   della  pace,    tu sei speranza    delle  nostre   mani    tu sei il vento   nuovo    sulle  nostre  ali,    sulle nostre   ali soffierà  la vita    e gonfierà   le  vele  in questo   mare."},{"id":"tu-sei-bambino-capo-2-3-4","numero":150,"title":"Tu Sei Bambino","sub":"Capo 2/3/4","search":"Tu Sei Bambino Capo 2/3/4 Intro (x2)  Strofa 1    Tu sei bambino,   tu sei bambino,     l'infinito, Dio vicino.    Tu sei bambino,   tu sei bambino,     nel Natale  il nostro destino.     Tu  padrone   dei cieli e dei popoli,  tu l'altissimo Dio degli  eserciti,     sei quaggiù  tu minuscolo,   sei quaggiù  indifeso  in mezzo   a noi.  Strofa 2    Tu sei bambino,   tu sei bambino,   solo  paglia il tuo cuscino.    Tu sei bambino,   tu sei bambino,   tu l'immagine   del divino.    Che  dimentica   il cielo e le nuvole per venire  quaggiù  tra le lacrime.    Il tuo amore  è incredibile,  ma  sei sceso giù dal paradiso.  Ritornello Gra - zie,   che  sei venuto  quaggiù   a condividere.    Gra  - zie,  per il tuo amore   che non   ha più limiti.     Tu  bambino    sei qui in questa grotta    e tu resti a tremare, resti a tremare,   a tremare  come   noi.  Interludio (x2) Ripetere la prima strofa Ripetere il ritornello (x2)  Finale (FA lungo) Gra  - zie,  gra       -    zie."},{"id":"tutto-e-possibile","numero":151,"title":"Tutto È Possibile","sub":"Capo 3","search":"Tutto È Possibile Capo 3 Intro  Strofa 1    Questo  è il luogo che Dio ha scelto per te,    questo è il tempo  pensato per  te    Quella che  vedi è la strada che lui traccerà    quello che senti l'Amore  che mai finirà  Ritornello E andremo  e annunceremo    che in Lui tutto è possibile    E andremo   e annunceremo    che nulla ci può vincere    Perché abbiamo   udito le Sue parole    Perché abbiam   veduto  vite cambiare    Perché abbiamo   visto l'Amore  vincere    Sì abbiamo  visto l'Amore  vincere  Interludio (x2)  Strofa 2    Questo  è il momento   che Dio ha  atteso per te,    questo è il sogno che ha fatto su te    quella che vedi, è la strada tracciata per te    quello che senti, l'amore che ti accompagnerà  Ripetere il ritornello (x2)  Strofa 3    Qu che  ai  suoi  pascoli  guida,   il gregge  ch'  Egli conduce.  Strofa 6 Oggi,  ascoltate   la  sua voce,        non   indurite  più  il vostro   cuore   come   nei  giorni  antichi."},{"id":"verbum-panis","numero":154,"title":"Verbum Panis","sub":"Casucci · Balduzzi","search":"Verbum Panis  Intro  Strofa 1      Prima   del  tempo,    prima   ancora    che  la terra      cominciasse    a  vivere,  il Verbo   era  presso   Dio.      Venne    nel  mondo     e per  non   abbandonarci      in questo   viaggio   ci lasciò  tutto  se  stesso  come   pane.  Acclamazione 1 (x2)                Verbum     caro  factum    est                Verbum     panis  factum    est.  Ritornello 1                Qui  spezzi   ancora   il pane   in mezzo    a noi                e chiunque    mangerà     non   avrà   più fame.                Qui  vive  la  tua chiesa   intorno   a  te                dove   ognuno     troverà   la sua  vera  casa.  Finale 1                Verbum     caro  factum    est                Verbum     panis  factum    est                Verbum     caro  factum    est                Verbum     panis!  Strofa 2      Prima   del  tempo,    quando     l'universo   fu creato      dall'oscurità,   il Verbo   era presso   Dio.      Venne    nel  mondo,     nella  sua misericordia      Dio  ha  mandato      il Figlio suo,  tutto  se stesso  come    pane.  Acclamazione 2 (x2)                Verbum     caro   factum   est                Verbum     panis   factum   est.  Ritornello 2 (x2)                Qui   spezzi  ancora    il pane  in  mezzo    a noi                e  chiunque    mangerà     non   avrà  più  fame.                Qui   vive  la tua  chiesa  intorno    a te                dove    ognuno    troverà    la sua  vera  casa.  Finale 2                Verbum     caro   factum   est                Verbum     panis   factum   est                Verbum     caro   factum   est                Verbum     panis   factum   est."},{"id":"vieni-e-seguimi","numero":155,"tit
