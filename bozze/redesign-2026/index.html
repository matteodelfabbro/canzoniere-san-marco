nza","numero":157,"title":"Vita in Abbondanza","sub":"","search":"Vita in Abbondanza Intro Strofa 1 I gigli del campo e gli uccelli del cielo non temono nulla, perché ho cura di loro. Abbiate fede in me, perché io sarò con voi. Amate la vita in ogni momento: io sono con voi, tra le gioie e i dolori, fino alla fine del tempo: farò nuove tutte le cose. Ritornello Io vengo a donar la Vita, Vita in abbondanza, in abbondanza. Io sono la Via, la Verità e la Vita, Vita in abbondanza, in abbondanza. Strofa 2 Non ho fatto l’uomo perché fosse da solo, ma vi ho comandato: siate come fratelli, con ogni bontà e pazienza, nell’amore, nell’unità. A voi ho promesso la Vita del Cielo e inizia con me, adesso in Terra. È questa la vostra gioia: il mio Regno è in mezzo a voi. Ritornello x2"},{"id":"vivere-la-vita","numero":158,"title":"Vivere la Vita","sub":"Gen Verde","search":"Vivere la Vita  Strofa 1      Vivere   la vita  con   le gioie  e coi  dolori  di  ogni  giorno      È quello   che  Dio   vuole   da  te      Vivere   la vita  e inabissarti   nell'amore    è il tuo destino      È quello   che  Dio   vuole   da  te  Ritornello 1                   Fare  insieme   agli altri la tua  strada   verso  Lui                   Correre   con   i fratelli tuoi...                   Scoprirai  allora   il cielo dentro   di te,                   una  scia di  luce  lascerai  Strofa 2 Vivere   la vita  è l'avventura    più stupenda    dell'amore È quello   che  Dio   vuole   da  te Vivere   la vita  e generare    ogni   momento      il paradiso È quello   che  Dio   vuole   da  te  Ritornello 2                   Vivere   perché   ritorni  al mondo     l'unità                   Perché   Dio  sia nei  fratelli tuoi...                   Scoprirai   allora  il cielo dentro   di  te,                   una  scia  di luce  lascerai                   una  scia  di luce  lascerai."},{"id":"vocazione","numero":159,"title":"Vocazione","sub":"Sequeri","search":"Vocazione  Intro  Strofa 1    Era  un  giorno   come    tanti  altri e quel  giorno   Lui  passò    Era  un  uomo    come    tutti gli altri e passando     mi  chiamò    Come    lo  sapesse   che  il mio  nome    era  proprio    quello    Come    mai   volesse   proprio   me   nella  Sua  vita  non   lo so    Era  un  giorno   come    tanti  altri e quel  giorno   mi  chiamò  Ritornello                     Tu    Dio    che   conosci   il nome   mio                     Fa    che     ascoltando    la  tua voce                     Io    ricordi  dove   porta   la mia   strada                     nella  vita all'incontro    con  Te  Strofa 2    Era  l'alba triste e senza   vita  e qualcuno     mi  chiamò    Era  un  uomo    come    tanti  altri, ma  la voce   quella   no    Quante    volte   un  uomo    con   il nome   giusto   mi  ha  chiamato    Una   volta  sola  l'ho  sentito  pronunciare     con   amore    Era  un  uomo    come    nessun   altro  e quel   giorno   mi  chiamò"},{"id":"voi-siete-di-dio","numero":160,"title":"Voi Siete di Dio","sub":"","search":"Voi Siete di Dio  Intro  Strofa 1   Tutte  le  stelle della  not  - te le nebulose    e  le come   - te   il sole su  una  ragnate    - la       è  tutto  vostro   e voi  sie  - te  di Dio.  Strofa 2   Tutte  le  rose  della  vi - ta il grano,  i prati,  i fili d'erba   il mare,  i fiumi,  le montagne         è  tutto  vostro   e voi  sie  - te di Dio.  Strofa 3   Tutte  le  musiche    e le dan   - ze, i grattacieli, le  astrona    - vi   i quadri,  i libri, le cultu  - re        è tutto  vostro   e  voi sie  -  te di  Dio.  Sax (lungo fino alla fine del solo)  Strofa 4   Tutte  le  volte  che  perdo    - no  quando    sorrido,   quando     pian  - go   quando     mi  accorgo    di chi sono       è tutto  vostro   e  voi sie   -  te di  Dio. Finale   È tutto  nostro   e  noi  siamo   di Dio.  Ripetere l'ultima strofa in MI con il sax"},{"id":"acclamate-al-signore-frisina","numero":167,"title":"Acclamate al Signore","sub":"Frisina","search":"Acclamate al Signore Frisina Ritornello Acclamate al Signore, voi tutti della terra e servitelo con gioia, andate a lui con lieti canti. Acclamate voi tutti al Signore. Strofa 1 Riconoscete che il Signore, che il Signore è Dio, Egli ci ha fatti siamo suoi, suo popolo e gregge del suo pascolo. Strofa 2 Entrate nelle sue porte con degli inni di grazia, i suoi atri nella lode, Benedite, lodate il suo nome. Strofa 3 Poiché buono è il Signore, eterna la sua misericordia, la sua fedeltà si estende sopra ogni generazione."},{"id":"adoramus-te-domine","numero":168,"title":"Adoramus Te Domine","sub":"Canone di Taizé","search":"Adoramus Te Domine Canone di Taizé Canone Oh, oh, oh, adoramus Te Domine."},{"id":"alza-i-tuoi-occhi-al-cielo","numero":169,"title":"Alza i tuoi occhi al cielo","sub":"Branca, Ciancio","search":"Alza i tuoi occhi al cielo Branca, Ciancio Strofa 1 Cristo Gesù, Figlio di Dio, ad ogni uomo il suo amore mostrò. Egli guarì e liberò, tutto sé stesso donò. Sai che Gesù, se tu lo vuoi, i suoi prodigi rinnova per te. Senza timor apriti a lui, ti ama così come sei, come sei. Ritornello Alza i tuoi occhi al cielo e vedrai, nuovi orizzonti tu scoprirai. lascia ogni cosa e insieme a noi canta al Dio dell'amor. Apri il tuo cuore a Cristo e vedrai, nella tristezza più non vivrai. lascia ogni cosa e insieme a noi canta al Dio dell'amor. Strofa 2 Cristo Gesù, Figlio di Dio, ad ogni uomo il suo amore mostrò. Egli morì, risuscitò, la croce sua ci salvò. Sai che Gesù, se tu lo vuoi, i suoi prodigi rinnova per te. Senza timor apriti a lui, ti ama così come sei, come sei. Strofa 3 Cristo Gesù, Figlio di Dio, ai suoi amici la pace portò. Al ciel salì ma vive in noi con il suo soffio d'amor. Sai che Gesù, se tu lo vuoi, i suoi prodigi rinnova per te. Senza timor apriti a lui, ti ama così come sei, come sei."},{"id":"amo","numero":170,"title":"Amo","sub":"Fioravanti","search":"Amo Fioravanti Ritornello Amo il Signore perché ascolta il grido della mia preghiera. Su di me ha steso la mano nel giorno che lo cercavo. Strofa 1 Ho invocato il nome del Signore ed egli mi ha risposto. Buono e giusto è il nostro Dio: protegge gli umili e gli oppressi. Strofa 2 Anima mia torna alla tua pace: il Signore ti ha ascoltato. Ha liberato i tuoi occhi dalle lacrime e non sono più caduto. Strofa 3 Ho creduto anche quando dicevo: sono troppo infelice. Che cosa posso rendere al Signore per quello che mi ha dato? Strofa 4 Il calice della salvezza innalzerò, invocherò il nome tuo, Signore. Tu lo sai, sono il tuo servo: a te offrirò sacrifici."},{"id":"annunceremo-che-tu","numero":171,"title":"Annunceremo che Tu","sub":"Auricchio","search":"Annunceremo che Tu Auricchio Ritornello Annunceremo che Tu sei Verità, lo grideremo dai tetti della nostra città, senza paura anche tu lo puoi cantare. Strofa 1 E non temere dai, che non ci vuole poi tanto, quello che non si sa non resterà nascosto. Se ti parlo nel buio, lo dirai nella luce, ogni giorno è il momento di credere in me. Strofa 2 Con il coraggio tu porterai la Parola che salva, anche se ci sarà chi non vuole accogliere il dono, tu non devi fermarti, ma continua a lottare, il mio Spirito sempre ti accompagnerà. Strofa 3 Non ti abbandono mai, io sono il Dio fedele, conosco il cuore tuo. Ogni tuo pensiero mi è noto, la tua vita è preziosa, vale più di ogni cosa, il segno più grande del mio amore per te."},{"id":"ascolta-il-mio-cuore","numero":172,"title":"Ascolta il mio cuore","sub":"RNS","search":"Ascolta il mio cuore RNS Strofa 1 Ascolta il mio cuore, rispondi al mio grido, t’invoco nella mia povertà. Custodisci i miei pensieri con il tuo immenso amore, rinnova in me la tua fedeltà. Ritornello Per te canterò, per te io vivrò, perché sei oltre i confini, il Signore che vita mi dà. Per te danzerò, con te cambierò, il mio pianto nel canto nuovo, perché vivi in me: sei risorto e con me resterai. Strofa 2 Ritorno a te mio Dio, accolgo il tuo perdono, la tua misericordia è per me. Dal profondo della terra mi hai chiamato a nuova vita, per sempre grazie ti renderò. Ritornello Per te canterò, per te io vivrò, perché sei oltre i confini, il Signore che vita mi dà. Per te danzerò, con te cambierò, il mio pianto nel canto nuovo, perché vivi in me: sei risorto e con me resterai."},{"id":"astro-del-ciel","numero":173,"title":"Astro del ciel","sub":"Gruber","search":"Astro del ciel Gruber Strofa 1 Astro del ciel, Pargol divin, mite agnello redentor! Tu che i Vati da lungi sognar, tu che angeliche voci annunziar, Ritornello Luce dona alle menti, pace infondi nei cuor. (x2) Strofa 2 Astro del ciel, Pargol divin, mite agnello redentor, tu di stirpe regale decor, tu virgineo mistico fior. Strofa 3 Astro del ciel, Pargol divin, mite agnello redentor tu disceso a scontare l'error, tu sol nato a parlare d'amor."},{"id":"benedetto-signore-cerco-solo-te","numero":174,"title":"Benedetto Signore, Cerco Solo Te","sub":"Montuori","search":"Benedetto Signore, Cerco Solo Te Montuori Ritornello Cerco solo te, Signor, mio liberatore sei, fonte dell'amore, tu, riempi la mia vita. Cerco solo te, Signor, mio liberatore sei, fonte dell'amore, tu, riempi la mia vita. Strofa 1 Volgi il tuo sguardo su di me, Dio di immensa bontà e rendi forte la mia fede; più non vacillerò. Crea un cuore puro in me, rinnova il mio spirito, la mia bocca proclami la tua lode."},{"id":"benedetto-tu-signore-ricci","numero":175,"title":"Benedetto Tu, Signore","sub":"Ricci · versione San Marco","search":"Benedetto Tu Signore Ricci versione San Marco Intro Ritornello Prendi da queste mani il pane che offriamo a Te fanne cibo che porterà la vita tua vino linfa eternità Queste nostre offerte accoglile Signore e saranno offerte pure Questo nostro mondo accogli o Signore e saranno cieli e terre che Tu farai nuovi cuore dono Finale"},{"id":"bless-the-lord","numero":176,"title":"Bless the Lord","sub":"Canone di Taizé","search":"Bless the Lord Canone di Taizé Canone Bless the Lord, my soul, and bless God's holy name. Bless the Lord, my soul, who leads me into life."},{"id":"bonum-est-confidere","numero":177,"title":"Bonum est confidere","sub":"Canone di Taizé","search":"Bonum est confidere Canone di Taizé Canone Bonum est confidere in Domino, bonum sperare in Domino."},{"id":"colori","numero":178,"title":"Colori","sub":"Donovan","search":"Colori Donovan Strofa 1 Questo prato verde ti ricorderà la speranza del mattino non smarrirla, amico mio, perché io, perché io ritornerò. Strofa 2 Questo cielo azzurro ti ricorderà la fiducia nella vita non deporla, amico mio, perché io, perché io ritornerò. Strofa 3 Questa rosa rossa ti ricorderà la bellezza del tuo amore non tradirlo, amico mio, perché io, perché io ritornerò. Strofa 4 Questo sole d'oro ti ricorderà lo splendore del tuo dono non stancarti, amico mio, perché io, perché io ritornerò. Strofa 5 Il colore arcano della libertà sai trovarlo amico mio? Nel tuo cuore l'ho posto io perché io, perché io ritornerò."},{"id":"con-te-camminero","numero":179,"title":"Con te camminerò","sub":"Gen Verde","search":"Con te camminerò Gen Verde Intro Strofa 1 Mi hai chiamato ed ora sono qui. La mia vita ormai, Signore, trova senso solo in te. Cerco nel profondo e tu ci sei. Guardo intorno e poi ti trovo accanto a me. Ritornello Insieme a te camminerò, in ogni volto, in ogni pianto io ti riconoscerò. Ti seguirò ovunque andrai, io con te camminerò. Strofa 2 Come servo sei venuto qui per chi è solo e chi è ferito, per chi vive in povertà. Ora, oh Signore, manda me, segno del tuo amore per l’umanità. Ritornello Insieme a te camminerò, in ogni volto, in ogni pianto io ti riconoscerò. Ti seguirò ovunque andrai, io con te camminerò. Bridge Tu sei qui, sei con noi, sempre accanto a noi. Nel dolore di chi non ha più una casa, tu sei lì. Nel silenzio di chi ha perso ogni speranza, tu sei lì. Nei rimpianti, nei miei dubbi e nel buio delle mie fragilità, tu sei lì. Finale And I will walk on holy ground, I’ll hear your voice, I’ll see your face. I will find you in the crowd. Lord, I will go where you will lead me. I will walk on holy ground. Et avec toi, j’irai Seigneur, j’entends ta voix et je te vois. Dans les pauvres autour de moi, je te suivrai où tu me conduis. Je te vois auprès de moi. You are near, you are here. Io con te camminerò."},{"id":"dona-la-pace-canone","numero":180,"title":"Dona la pace","sub":"Canone","search":"Dona la pace Canone Canone Dona la pace, Signore, a chi confida in te. Dona, dona la pace, Signore, dona la pace."},{"id":"dove-due-o-tre","numero":181,"title":"Dove due o tre","sub":"Gen Verde","search":"Dove due o tre Gen Verde Strofa 1 Dove due o tre sono uniti nel mio nome, io sarò con loro, pregherò con loro, amerò con loro, perché il mondo venga a te, o Padre, conoscere il tuo amore è avere vita con te. Strofa 2 Voi che siete luce della terra, miei amici, risplendete sempre della vera luce, perché il mondo creda nell’amore che c’è in voi, o Padre, consacrali per sempre. Strofa 3 Ogni beatitudine vi attende nel mio giorno, se sarete uniti, se sarete pace, se sarete puri, perché voi vedrete Dio che è Padre, in lui la vostra vita gioia piena sarà. Strofa 4 Voi che ora siete miei discepoli nel mondo, siate testimoni di un amore immenso, date prova di quella speranza che c’è in voi, coraggio, vi guiderò per sempre."},{"id":"e-l-incontro-della-vita","numero":182,"title":"È l'incontro della vita","sub":"Ricci","search":"È l'incontro della vita Ricci Intro Strofa 1 È l'incontro della vita è l'incontro intorno a te. Tu che sei realtà infinita tu ci chiami tutti a te. E il tuo Spirito è una brezza che dissolve ogni tristezza nell'amore che tu vuoi fra di noi nell'amore che tu vuoi fra di noi. Strofa 2 È l'incontro della gioia è l'incontro fra di noi tu risplendi nella gloria sei presente in mezzo a noi. Non importa noi chi siamo, ciò che importa è che ci amiamo dell'amore che tu vuoi fra di noi dell'amore che tu vuoi fra di noi. Ritornello Nel tuo cuore noi troviamo il paradiso. Nel tuo cuore noi troviamo l'unità. Nel tuo cuore gli orizzonti più splendenti, nel tuo cuore è l'umanità. Strofa 3 È l'incontro dei fratelli tutti uniti qui con te e i propositi più belli adesso nascono con te. C'è la forza, la sorgente, la più pura delle fonti nell'amore che tu vuoi fra di noi nell'amore che tu vuoi fra di noi. Ritornello 2 Nel tuo cuore noi troviamo il paradiso. Nel tuo cuore noi troviamo l'unità. Nel tuo cuore gli orizzonti più splendenti, nel tuo cuore è l'umanità."},{"id":"ecco-il-pane","numero":183,"title":"Ecco il pane","sub":"Ricci","search":"Ecco il pane Ricci Intro Strofa 1 Ecco il pane e il vino della Cena insieme a Te, ecco questa vita che trasformi: cieli e terre nuove in noi, tu discendi dentro noi… fatti come te, noi con Te nell'anima."},{"id":"hai-detto-si","numero":184,"title":"Hai detto sì","sub":"Benedetti · Anselmi","search":"Hai detto sì Benedetti · Anselmi Intro Strofa 1 Beata sei tu, che hai creduto. Da quel momento tutto è cambiato. Hai detto sì tu, per prima, mentre tessevi il nuovo velo del tempio. Quanto coraggio hai avuto. Non conoscevi il piano di Dio. Hai detto sì tu, per prima, con la fede e la volontà. Ritornello Come te Maria rispondiamo: “Eccomi”. Come te Maria noi vogliamo fidarci così. Che si compia per noi la Parola di Dio. Strofa 2 Fra tutte le donne benedetta, Madre vestita del Verbo di Dio. Con umiltà tu ci guidi e ci insegni ad amare di più. Ritornello Come te Maria rispondiamo: “Eccomi”. Come te Maria noi vogliamo fidarci così. Che si compia per noi la Parola di Dio. Finale Oh oh, oh oh oh, oh Maria, Madre dolcissima. Hai detto sì, hai detto sì, hai detto sì."},{"id":"il-signore-e-la-mia-forza","numero":185,"title":"Il Signore è la mia forza","sub":"Capo 3","search":"Il Signore è la mia forza Capo 3 Canone Il Signore è la mia forza ed io spero in lui. Il Signore è il Salvator. In lui confido, non ho timor, in lui confido, non ho timor."},{"id":"il-tuo-amore-annuncero","numero":186,"title":"Il tuo amore annuncerò","sub":"Capo 3","search":"Il tuo amore annuncerò Capo 3 Intro Strofa 1 Ogni vento, ogni colore che l’arcobaleno ha, ogni sogno dentro me al vero amore mi riporterà. Le parole di ogni storia, ogni stella di lassù, ogni angolo creato parlerà di te. Ritornello Fino a quando vita avrò il tuo amore annuncerò. Sarò fedele nel silenzio se parlare non potrò. Finché respiro avrò di cuore Dio ringrazierò. Fino a quando vita avrò il tuo amore annuncerò. Strofa 2 Dai monti alle valli, ogni fiume al mare va; ogni mano che si dà porta pace in dono a chi non ne ha. Ogni semplice preghiera, ogni gesto di bontà, la speranza in ogni cuore parlerà di te. Ritornello Fino a quando vita avrò il tuo amore annuncerò. Sarò fedele nel silenzio se parlare non potrò. Finché respiro avrò di cuore Dio ringrazierò. Fino a quando vita avrò il tuo amore annuncerò. Finale · +1 tono L’amore… Fino a quando vita avrò annuncerò il tuo amor… Fino a quando vita avrò il tuo amore annuncerò. Sarò fedele nel silenzio se parlare non potrò. Finché respiro avrò di cuore Dio ringrazierò. Fino a quando vita avrò il tuo amore annuncerò."},{"id":"in-eterno-cantero","numero":187,"title":"In eterno canterò","sub":"RNS","search":"In eterno canterò RNS Ritornello In eterno canterò la tua lode, mio Signor. Le mie labbra esalteranno la tua fedeltà. Io per sempre ti benedirò e annuncerò il tuo nome. In eterno io ti canterò. Strofa 1 Anche se la tempesta mi colpirà, la mia lode a te, Signore, si eleverà. Sei tu la mia fiducia, io spero in te. Tu sei il mio Signore, il mio Re. Il tuo nome annuncerò. Ritornello In eterno canterò la tua lode, mio Signor. Le mie labbra esalteranno la tua fedeltà. Io per sempre ti benedirò e annuncerò il tuo nome. In eterno io ti canterò."},{"id":"in-manus-tuas","numero":188,"title":"In manus tuas","sub":"Canone di Taizé","search":"In manus tuas Canone di Taizé Canone In manus tuas, Pater, commendo spiritum meum."},{"id":"jubilate-deo","numero":189,"title":"Jubilate Deo","sub":"Taizé","search":"Jubilate Deo Taizé Strofa 1 Jubilate Deo Jubilate Deo Alleluia!"},{"id":"lui-verra-e-ti-salvera","numero":190,"title":"Lui verrà e ti salverà","sub":"Fitts, Sadler","search":"Lui verrà e ti salverà Fitts, Sadler Intro Strofa 1 A chi è nell'angoscia tu dirai: ``Non devi temere, il tuo Signore è qui, con la forza sua. Quando invochi il suo nome Lui ti salverà.'' Ritornello Lui verrà e ti salverà, Dio verrà e ti salverà, di' a chi è smarrito che certo Lui tornerà. Lui verrà e ti salverà, Lui verrà e ti salverà, Dio verrà e ti salverà, alza i tuoi occhi a lui, presto ritornerà, lui verrà e ti salverà. Strofa 2 A chi ha il cuore ferito tu dirai: ``Confida in Dio, il tuo Signore è qui, con il suo grande amore. Quando invochi il suo nome Lui ti salverà.'' Strofa 3 Egli è rifugio nelle avversità, dalla tempesta ti riparerà. È il tuo baluardo e ti difenderà, la forza sua Lui ti darà. Intro Ritornello 2 Lui verrà e ti salverà, Dio verrà e ti salverà, di' a chi è smarrito che certo Lui tornerà. Lui verrà e ti salverà, Lui verrà e ti salverà, Dio verrà e ti salverà, alza i tuoi occhi a lui, presto ritornerà, lui verrà e ti salverà."},{"id":"manda-il-tuo-spirito","numero":191,"title":"Manda il tuo Spirito","sub":"RNS · A. Agrelli","search":"Manda il tuo Spirito RNS · A. Agrelli Intro Ritornello Manda il tuo Spirito, manda il tuo Spirito, manda il tuo Spirito, Signore, su di noi. Manda il tuo Spirito, manda il tuo Spirito, manda il tuo Spirito, Signore, su di noi. Strofa 1 La tua presenza noi invochiamo per esser come tu ci vuoi. Impareremo ad amare proprio come ami tu. Un sol corpo e un solo spirito saremo. Un sol corpo e un solo spirito saremo. Ritornello Manda il tuo Spirito, manda il tuo Spirito, manda il tuo Spirito, Signore, su di noi. Manda il tuo Spirito, manda il tuo Spirito, manda il tuo Spirito, Signore, su di noi. Strofa 2 La tua sapienza noi invochiamo, sorgente eterna del tuo amore. Dono radioso che dà luce ai figli tuoi. Nel tuo amore confidiamo, la tua grazia ci farà Chiesa unita e santa per l’eternità. Chiesa unita e santa per l’eternità. Ritornello finale Manda il tuo Spirito, manda il tuo Spirito, manda il tuo Spirito, Signore, su di noi. Manda il tuo Spirito, manda il tuo Spirito, manda il tuo Spirito, Signore, su di noi. Signore, vieni in noi."},{"id":"maranatha-vieni-signor","numero":192,"title":"Maranathà, vieni signor","sub":"Christian Gonzales","search":"Maranathà, vieni signor Christian Gonzales Ritornello Maranathà, vieni Signor verso te, Gesù, le mani noi leviam. Maranathà, vieni Signor prendici con te e salvaci o Signor. Strofa 1 Guardo verso le montagne, donde mi verrà il soccorso, il soccorso viene da Dio, che ha creato il mondo intero. Strofa 2 Sorgi con il tuo amore, la tua luce splenderà, ogni ombra svanirà la tua gloria apparirà. Strofa 3 Santo è il nostro Signor, il peccato egli portò, dalla morte ci salvò, e la vita a noi donò. Strofa 4 Mio Signor son peccatore, a te apro il mio cuore, fa di me quello che vuoi e per sempre in te vivrò. Strofa 5 La Parola giungerà sino ad ogni estremità, testimoni noi sarem della tua Verità. Strofa 6 Tu sei la mia libertà solo in te potrò sperar, ho fiducia in te Signor, la mia vita cambierai. Strofa 7 Mi consegno a te Signor, vieni dentro il mio cuor, ti ricevo o Salvator, tu sei il mio liberator. Strofa 8 Benedici o Signor, sii custode ai nostri cuor, giorno e notte veglierai e con noi sempre sarai. Strofa 9 Ringraziamo te Signor, a te, Padre creator, allo Spirito d'Amor, vieni presto o Signor."},{"id":"maria-tu-sei","numero":193,"title":"Maria tu sei","sub":"Gen Rosso","search":"Maria tu sei Gen Rosso Rimani con me Intro Strofa 1 Maria tu sei, la vita per me Sei la speranza e la gioia, l’amore, tutto sei Maria tu sai quello che vuoi Sai con che forza d’amore in cielo mi porterai Ritornello Maria ti do il mio cuore per sempre se vuoi Tu dammi l’amore che non passa mai Rimani con me e andiamo nel mondo insieme La tua presenza sarà goccia di paradiso per l’umanità Strofa 2 Maria con te, sempre vivrò In ogni momento giocando, cantando, ti amerò Seguendo i tuoi passi, in te io avrò La luce che illumina i giorni e le notti dell’anima Ritornello Maria ti do il mio cuore per sempre se vuoi Tu dammi l’amore che non passa mai Rimani con me e andiamo nel mondo insieme La tua presenza sarà goccia di paradiso per l’umanità"},{"id":"misericordias-domini","numero":194,"title":"Misericordias Domini","sub":"Canone di Taizé","search":"Misericordias Domini Canone di Taizé Canone Misericordias Domini, in aeternum cantabo."},{"id":"musica-di-festa","numero":195,"title":"Musica di festa","sub":"Sands, Jotti","search":"Musica di festa Sands, Jotti Strofa 1 Cantate al Signore un cantico nuovo, splende la sua gloria! Grande è la sua forza, grande la sua pace, grande la Sua Santità! Ritornello In tutta la terra, popoli del mondo, gridate la sua fedeltà! Musica di festa, musica di lode, Musica di libertà! Strofa 2 Agli occhi del mondo ha manifestato la Sua salvezza! Per questo si canti, per questo si danzi, per questo si celebri! Strofa 3 Con l'arpa ed il corno, con timpani e flauti, con tutta la voce! Canti di dolcezza, canti di salvezza, canti d'immortalità! Strofa 4 I fiumi e i monti, battono le mani davanti al Signore! La sua giustizia giudica la terra giudica le genti! Strofa 5 Al Dio che ci salva, gloria in eterno Amen! Alleluja! Gloria a Dio Padre, gloria a Dio Figlio, gloria a Dio Spirito!"},{"id":"nada-te-turbe","numero":196,"title":"Nada te turbe","sub":"Canone di Taizé","search":"Nada te turbe Canone di Taizé Canone Nada te turbe, nada te espante. Quien a Dios tiene nada le falta. Nada te turbe, nada te espante. Solo Dios basta."},{"id":"noi-veniamo-a-te","numero":197,"title":"Noi veniamo a Te","sub":"Buttazzo","search":"Noi veniamo a Te Buttazzo Intro Ritornello Noi veniamo a te, ti seguiamo Signor, solo Tu hai parole di vita e rinascerà dall'incontro con Te una nuova umanità. Strofa 1 Tu, maestro degli uomini, tu ci chiami all'ascolto e rinnovi con noi l'alleanza d'amore infinito. Strofa 2 Tu, speranza degli uomini, ti ci apri alla vita e rinnovi per noi la promessa del mondo futuro. Strofa 3 Tu, amico degli uomini, tu ci chiami fratelli e rivivi con noi l'avventura di un nuovo cammino. Intro"},{"id":"non-cercate-tra-i-morti","numero":198,"title":"Non cercate tra i morti","sub":"","search":"Non cercate tra i morti  Ritornello Non cercate tra i morti chi la morte annientò: è tornata a cantare la vita in Colui che ci amò. È risorto il Signore, oggi è vivo tra noi: Cristo porta la pace e l’amore, egli è sempre con noi. Strofa 1 Andavano le donne al sepolcro, piangevano ed era mattino. Venivano ad ungere il corpo, sepolto dentro il giardino. Trovarono vuota la tomba che aveva accolto il Signore: sentirono canti di angeli e grande ne fu lo stupore. Ritornello Non cercate tra i morti chi la morte annientò: è tornata a cantare la vita in Colui che ci amò. È risorto il Signore, oggi è vivo tra noi: Cristo porta la pace e l’amore, egli è sempre con noi. Strofa 2 Vivevano nella paura, tenevano chiuse le porte: finita la grande avventura sentivano canti di morte. Gesù, il vivente, il risorto, si rese presente tra i suoi: soffiò su di loro lo Spirito e disse: “Sia pace tra voi!” Ritornello finale Non cercate tra i morti chi la morte annientò: è tornata a cantare la vita in Colui che ci amò. È risorto il Signore, oggi è vivo tra noi: Cristo porta la pace e l’amore, egli è sempre con noi."},{"id":"ora-e-tempo-di-gioia","numero":199,"title":"Ora è tempo di gioia","sub":"Gen Rosso","search":"Ora è tempo di gioia Gen Rosso Strofa 1 L'eco torna d'antiche valli la sua voce non porta più, ricordo di sommesse lacrime di esili in terre lontane. Ritornello Ora è tempo di gioia, non ve ne accorgete ecco faccio una cosa nuova nel deserto una strada aprirò. Strofa 2 Come l'onda che sulla sabbia copre le orme e poi passa e va, così nel tempo si cancellano le ombre scure del lungo inverno. Strofa 3 Tra i sentieri dei boschi il vento con i rami ricomporrà nuove armonie che trasformano i lamenti in canti di festa."},{"id":"pace-sia-pace-a-voi","numero":200,"title":"Pace sia, pace a voi","sub":"Gen Verde, Gen Rosso","search":"Pace sia, pace a voi Gen Verde, Gen Rosso Ritornello “Pace sia, pace a voi”: la tua pace sarà sulla terra com'è nei cieli. “Pace sia, pace a voi”: la tua pace sarà gioia nei nostri occhi, nei cuori. “Pace sia, pace a voi”: la tua pace sarà luce limpida nei pensieri. “Pace sia, pace a voi”: la tua pace sarà una casa per tutti. Strofa 1 “Pace a voi”: sia il tuo dono visibile. “Pace a voi”: la tua eredità. “Pace a voi”: come un canto all'unisono che sale dalle nostre città. Strofa 2 “Pace a voi”: sia un impronta nei secoli. “Pace a voi”: segno d'unità. “Pace a voi”: sia l'abbraccio tra i popoli, la tua promessa all'umanità."},{"id":"padre-maestro-e-amico","numero":201,"title":"Padre, Maestro e Amico","sub":"Angelo Lagorio","search":"Padre, Maestro e Amico Angelo Lagorio Strofa 1 Padre, di molte genti padre, il nostro grido ascolta è il canto della vita. Quella perenne giovinezza che tu portavi in cuore perché non doni a noi? Ritornello Padre, maestro ed amico, noi giovani del mondo guardiamo ancora te. Apri il nostro cuore a Cristo, sostieni il nostro impegno in questa societa'. Oh Oh Oh Oh Strofa 2 Festa, con te la vita è festa con te la vita è canto è fremito di gioia. Oggi tra noi ancora è vivo l'amore che nutrivi per tutti i figli tuoi! Ritornello 2 Padre, maestro ed amico, noi giovani del mondo guardiamo ancora te. Apri il nostro cuore a Cristo, sostieni il nostro impegno in questa societa'. Oh Oh Oh Oh"},{"id":"pane-di-vita","numero":202,"title":"Pane di vita","sub":"Marranzino, Pesare","search":"Pane di vita Marranzino, Pesare Intro Strofa 1 Pane di vita sei, spezzato per tutti noi, chi ne mangia per sempre in te vivrà. Veniamo al tuo santo altare, mensa del tuo amore. Come pane vieni in mezzo a noi. Ritornello Il tuo corpo ci sazierà Il tuo sangue ci salverà perché Signor tu sei morto per amore e ti offri oggi per noi. (x2) ( II volta e ti offri oggi per noi. ) Intro Strofa 2 Fonte di vita sei, immensa carità, il tuo sangue ci dona l'eternità. Veniamo al tuo santo altare, mensa del tuo amore. Come vino vieni in mezzo a noi. Ritornello 2 Il tuo corpo ci sazierà Il tuo sangue ci salverà perché Signor tu sei morto per amore e ti offri oggi per noi. (x2) ( II volta e ti offri oggi per noi.)"},{"id":"quelli-che-amano-te","numero":203,"title":"Quelli che amano te","sub":"Gen Rosso","search":"Quelli che amano te Gen Rosso Intro Strofa 1 Ecco il frumento che noi ti portiamo, pane della Madre Terra, e del lavoro e il sudore di tanti, quelli che amano te. Strofa 2 Portiamo il vino, frutto della vite, sangue della Madre Terra, e del lavoro e la gioia di tanti, quelli che amano te. Strofa 3 · +1 tono Insieme ai doni veniamo noi stessi, figli di tutta la Terra, per riscaldarci attorno alla mensa che hai preparato per noi. Finale Per riscaldarci attorno alla mensa che hai preparato per noi."},{"id":"questa-e-la-mia-fede","numero":204,"title":"Questa è la mia fede","sub":"Branca","search":"Questa è la mia fede Branca Ritornello Questa è la mia fede, proclamarti mio re, unico Dio, grande Signore. Questa è la speranza so che risorgerò e in Te dimorerò. (x2) Strofa 1 Canterò la gioia di esser figlio, canterò che Tu non abbandoni, non tradisci mai. Dammi sempre la tua grazia e in Te dimorerò per adorarti, per servirti in verità, mio re. Strofa 2 Canterò che solo Tu sei vita e verità, che sei salvezza, che sei vera libertà. Io porrò la mia fiducia in te che sei la via, camminerò nella Tua santa volontà, mio re."},{"id":"questa-notte","numero":205,"title":"Questa notte","sub":"Canone di Taizé","search":"Questa notte Canone di Taizé Canone Questa notte non è più notte davanti a te, il buio come luce risplende."},{"id":"rallegriamoci","numero":206,"title":"Rallegriamoci","sub":"Auricchio","search":"Rallegriamoci Auricchio Strofa 1 Rallegriamoci, non c'è spazio alla tristezza in questo giorno, Rallegriamoci, è la vita che distrugge ogni paura Rallegriamoci, che si compie in questo giorno la promessa rallegriamoci, ogni uomo lo vedrà: la salvezza di Dio. Ritornello Gloria a Te Emmanuele Gloria a Te Figlio di Dio. Gloria a Te Cristo Signore che nasci per noi e torna la gioia. (x2) (e torna la gioia.) Strofa 2 Rallegriamoci, Egli viene a liberarci da ogni male. Rallegriamoci, è il momento di gustare il suo perdono, rallegriamoci, con coraggio riceviamo la sua vita, rallegriamoci, perché è giunta in mezzo a noi la presenza di Dio. Strofa 3 Rallegriamoci, tutti i popoli del mondo lo vedranno rallegriamoci, nel Signore è la nostra dignità. Rallegriamoci, nella luce del suo regno in cui viviamo, Rallegriamoci, siamo tempio vivo suo, siamo chiesa di Dio."},{"id":"spirito-santo-dolce-presenza","numero":207,"title":"Spirito Santo, dolce presenza","sub":"RNS","search":"Spirito Santo, dolce presenza RNS Intro Strofa 1 Spirito Santo, dolce presenza, vieni a fonderci con la tua volontà. Consolatore, luce del cuore, soffia la tua vita dentro noi. Inebriaci di te, del tuo amore. Ritornello Spirito Santo, Spirito di Gesù, adesso tu manda noi ad infiammare la terra. Spirito Santo, rendici uno in te, usaci come vuoi, con la tua grazia. Strofa 2 Spirito Santo, testimone celeste, donaci sapienza e verità. Promessa del Padre, sorgente di grazia, vieni a dimorare dentro noi. Inebriaci di te, del tuo amore. Ritornello Spirito Santo, Spirito di Gesù, adesso tu manda noi ad infiammare la terra. Spirito Santo, rendici uno in te, usaci come vuoi, con la tua grazia. Bridge Scendi su di noi, scendi su di noi, tu che sei l’Eterno. Scendi su di noi, scendi su di noi, tu che sei l’Eterno. Scendi su di noi, scendi su di noi, tu che sei l’Eterno, l’Eterno. Ritornello finale Spirito Santo, Spirito di Gesù, muoviti dentro noi per rinnovare la terra. Spirito Santo, rendici uno in te, usaci come vuoi, usaci come vuoi. Spirito Santo."},{"id":"ti-lodiamo-e-ti-adoriamo","numero":208,"title":"Ti lodiamo e ti adoriamo","sub":"Gruppo Peniel","search":"Ti lodiamo e ti adoriamo Gruppo Peniel Ritornello Ti lodiamo e ti adoriamo, Cristo Signor. Ti lodiamo e ti adoriamo, Cristo Signor. Strofa 1 Ti seguiamo nel cammino, ti seguiamo nel cammino, ti seguiamo nel cammino, Cristo Signor. Strofa 2 Ti doniam la nostra vita, ti doniam la nostra vita, ti doniam la nostra vita, Cristo Signor. Strofa 3 Diamo a te tutta la gloria, diamo a te tutta la gloria, diamo a te tutta la gloria, Cristo Signor."},{"id":"tutta-la-vita-e-un-dono","numero":209,"title":"Tutta la vita è un dono","sub":"Gen Rosso","search":"Tutta la vita è un dono Gen Rosso Intro Strofa 1 Tutta la vita è un dono per ogni uomo tutta la vita è un dono in ogni momento tutta la vita è un dono, canta per lei, canta per lei. Ritornello Corri corri a perdifiato contro la corrente che trascina infrangi la marea di chi ti porta giù distruggi le barriere dell'indifferenza sorridi a chi non sa che la vita non si ferma mai. Strofa 2 Tutta la vita è un dono, non la sciupare; tutta la vita è un dono, non la bruciare tutta la vita è un dono: vivi per lei, vivi per lei. Strofa 3 Anche nei giorni tristi la vita è amore; anche tra le bufere la vita è amore; la vita è sempre un dono che Dio ci dà, che Dio ci dà."},{"id":"acclamate-al-signore-marolda","numero":210,"title":"Acclamate al Signore","sub":"Gabriella Marolda · Salmo 99","search":"Acclamate al Signore Gabriella Marolda Salmo 99 Intro Ritornello Acclamate al Signore, genti tutte della terra, servitelo con gioia, cantate, cantate a lui. Strofa 1 Sappiate che solo il Signore è Dio, il nostro creatore, egli ci ha fatti, siamo suoi, popolo e gregge del suo pascolo. Ritornello Acclamate al Signore, genti tutte della terra, servitelo con gioia, cantate, cantate a lui. Strofa 2 Lodate il Signore cantando inni di gioia, entrate nella sua casa e rendete grazie a lui. Ritornello Acclamate al Signore, genti tutte della terra, servitelo con gioia, cantate, cantate a lui. Strofa 3 Il Signore è buono con noi, non lascia senza il suo amore, Lui ci protegge per sempre ogni giorno della vita. Ritornello Acclamate al Signore, genti tutte della terra, servitelo con gioia, cantate, cantate a lui. Finale Cantate, cantate a lui."},{"id":"hallelujah-riadattamento-cattolico","numero":211,"title":"Hallelujah","sub":"Riadattamento cattolico · Leonard Cohen","search":"Intro Strofa 1 Lo so che c'é qualcuno che unisce tutti gli uomini, un'armonia nel cuore, dentro noi. Colui che apre le maree e che riscalda l'anima, la gioia della vita, hallelujah. Ritornello Hallelujah, hallelujah, hallelujah, hallelu-ja. Strofa 2 La luce che da forza e accende la speranza in te, con lui la strada non sarà mai buia. Scavalca gli orizzonti e, paura non avere più cantiamo tutti insieme, hallelujah. Ritornello Hallelujah, hallelujah, hallelujah, hallelu-ja. Strofa 3 E' un'energia invisibile, l'andare verso gli ultimi, che il Re di puro amore dona a noi. Il mondo è così debole, le notti dello spirito, prendiamoci per mano, hallelujah. Ritornello Hallelujah, hallelujah, hallelujah, hallelu-ja. Strofa 4 La vita è come un seme che, coi rami si fa albero, un'occasione di fraternità. L'amore vvuole crescere, i frutti della libertà, che invita a trovare la sua gloria. Ritornello finale Hallelujah, hallelujah, hallelujah, hallelu-ja. Finale"}];

const NOTES=['DO','DO#','RE','RE#','MI','FA','FA#','SOL','SOL#','LA','LA#','SI'];
const NI={'DO':0,'DO#':1,'REB':1,'RE':2,'RE#':3,'MIB':3,'MI':4,'FAB':4,'FA':5,'FA#':6,'SOLB':6,'SOL':7,'SOL#':8,'LAB':8,'LA':9,'LA#':10,'SIB':10,'SI':11,'DOB':11};
const RR=/^([([{]*)(DO|RE|MI|FA|SOL|LA|SI)(#|[Bb])?([A-Za-z0-9+\-]*)([)\]}]*)$/;
function tSingle(tok,s){const m=tok.match(RR);if(!m)return tok;const[,p,r,a,suf,post]=m;const i=NI[r+(a?a.toUpperCase():'')];if(i===undefined)return tok;return p+NOTES[((i+s)%12+12)%12]+suf+post}
const tTok=(t,s)=>t.includes('/')?t.split('/').map(p=>tSingle(p,s)).join('/'):tSingle(t,s);
const tNote=(n,s)=>NI[n]===undefined?n:NOTES[((NI[n]+s)%12+12)%12];

function filtered(){
  let arr = INDEX;
  if (state.view==='fav') arr = arr.filter(s=>state.fav.has(s.id));
  if (state.view==='set') arr = SETLIST.map(x=>byId[x.id]);
  if (state.tag) arr = arr.filter(s=>tagsOf(s.id).includes(state.tag));
  if (state.q){ const q=norm(state.q);
    const a=arr.filter(s=>s._t.includes(q)), b=arr.filter(s=>!s._t.includes(q)&&s._s.includes(q));
    arr=[...a,...b]; }
  return arr;
}
function hl(text){
  if(!state.q) return esc(text);
  const i = norm(text).indexOf(norm(state.q));
  if(i<0) return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+state.q.length))+'</mark>'+esc(text.slice(i+state.q.length));
}
function snippet(s){
  const q=norm(state.q), i=s._s.indexOf(q); if(i<0) return '';
  const src=s.search, a=Math.max(0,src.lastIndexOf(' ',Math.max(0,i-28))), b=Math.min(src.length,i+q.length+60);
  const pre=src.slice(a,i), mid=src.slice(i,i+q.length), post=src.slice(i+q.length,b);
  const cl=x=>esc(x.replace(/\s+/g,' '));
  return (a>0?'…':'')+cl(pre)+'<mark>'+cl(mid)+'</mark>'+cl(post)+'…';
}

function pairLine(chord, lyric){
  const pos=[]; chord.replace(/\S+/g,(m,i)=>{pos.push([i,m]);return m});
  if(!lyric) return pos.length?`<div class="ln only-chords"><span class="seg-w"><span class="ch">${esc(pos.map(p=>tTok(p[1],state.shift)).join('   '))}</span></span></div>`:'';
  const lead = lyric.search(/\S|$/);
  if(!pos.length) return `<div class="ln plain"><span class="seg-w" style="white-space:pre-wrap;flex:initial"><span class="ly">${esc(lyric.slice(lead).replace(/ {2,}/g,' '))}</span></span></div>`;
  const start = Math.min(lead,pos[0][0]);
  const cuts=[...new Set([start,...pos.map(p=>p[0]).filter(p=>p>start)])];
  const chordsAt = new Map(pos.map(([i,m])=>[Math.max(i,start),m]));
  // un elemento per parola: il rigo va a capo solo sugli spazi, mai dentro una parola
  const items=[];
  for(let k=0;k<cuts.length;k++){
    const a=cuts[k], b=cuts[k+1]??Math.max(lyric.length,a+1);
    let txt = lyric.slice(a,b).replace(/ {2,}/g,' '); if(k===0) txt=txt.trimStart();
    const c = chordsAt.get(a), words = txt.match(/\S+\s*|\s+/g) || [' '];
    const glued = b<lyric.length && /\S/.test(lyric[b-1]||' ') && /\S/.test(lyric[b]||' ');
    words.forEach((w,j)=>items.push({h:`<span class="seg-w">${j===0&&c?`<span class="ch">${esc(tTok(c,state.shift))}</span>`:''}<span class="ly">${esc(w)}</span></span>`, glue: glued && j===words.length-1}));
  }
  let out='', open=false;
  items.forEach(it=>{ if(it.glue&&!open){ out+='<span class="wd">'; open=true; } out+=it.h; if(!it.glue&&open){ out+='</span>'; open=false; } });
  if(open) out+='</span>';
  return `<div class="ln">${out}</div>`;
}
function abbr(name){
  const n=name.trim(), num=(n.match(/\d+/)||[''])[0];
  if(/^rit/i.test(n)) return 'R'+num;
  if(/^strofa/i.test(n)) return 'S'+num;
  if(/^intro/i.test(n)) return 'Intro';
  if(/^(ponte|bridge)/i.test(n)) return 'Ponte';
  if(/^(finale|coda|outro|conclusione)/i.test(n)) return 'Fine';
  if(/^interludio/i.test(n)) return 'Int'+num;
  return n.length>9?n.slice(0,8)+'…':n;
}
function parseSong(song){
  const secs=[]; let cur=null; const L=song.lines;
  for(let i=0;i<L.length;i++){
    const l=L[i];
    if(l.t==='h'){ cur={name:l.v,lines:[],hasLyric:false}; secs.push(cur); continue; }
    if(l.t==='s') continue;
    if(!cur){ cur={name:'',lines:[],hasLyric:false}; secs.push(cur); }
    if(l.t==='c'){ const nx=L[i+1]; if(nx&&nx.t==='l'){ cur.lines.push(pairLine(l.v,nx.v)); cur.hasLyric=true; i++; } else cur.lines.push(pairLine(l.v,'')); }
    else if(l.t==='l'){ cur.lines.push(pairLine('',l.v)); cur.hasLyric=true; }
  }
  return secs;
}

  const body = secs.map((s,i)=>{
    const cls = /^rit/i.test(s.name)&&s.lines.length?'chorus':!s.lines.length?'note':!s.hasLyric?'inst':'';
    return `<section class="sec ${cls}" id="sec${i}"><div class="sec-label">${esc(s.name)}</div><div class="sec-body">${s.lines.join('')}</div></section>`;
  }).join('') || '<p class="empty">Testo non disponibile.</p>';
  const struct = secs.map((s,i)=>s.name&&s.lines.length?`<button data-sec="${i}" class="${/^rit/i.test(s.name)?'r':''}" title="${esc(s.name)}">${esc(abbr(s.name))}</button>`:'').join('');

  const orig = song?.key?.note, min = song?.key?.mode==='minore'?'-':'';
  const key = orig ? tNote(orig,state.shift)+min : '—';
  const si = SETLIST.findIndex(x=>x.id===state.id), inSet = si>=0;
  const prev = inSet&&SETLIST[si-1], next = inSet&&SETLIST[si+1];
  const fav = state.fav.has(state.id);

  main.innerHTML = `
  <div class="topbar" id="topbar">
    <button class="icon-btn back" id="back" aria-label="Indietro">${icon('back')}</button>
    <div class="struct" id="struct" aria-label="Struttura del canto"><span class="mini">${esc(meta.title)}</span>${struct}</div>
    <button class="icon-btn ${fav?'on':''}" id="favBtn" aria-label="${fav?'Togli dai preferiti':'Aggiungi ai preferiti'}" aria-pressed="${fav}">${icon('star',fav?'fill':'')}</button>
    <button class="icon-btn ${inSet?'on':''}" aria-label="Aggiungi a una setlist">${icon('list')}</button>
    <button class="icon-btn stage-btn ${document.body.classList.contains('stage')?'on':''}" id="stageBtn" aria-label="Modalità palco" title="Modalità palco: nasconde l’elenco">${icon('stage')}</button>
  </div>
  <article class="song ${state.cols?'wide':''}">
    <header class="song-hero">
      <div class="eyebrow"><span class="num">N° ${meta.numero}</span>${inSet?`<span>·</span><span>${esc(SETLIST[si].m)} · ${si+1} di ${SETLIST.length}</span>`:''}</div>
      <h2>${esc(meta.title)}</h2>
      ${meta.sub?`<p class="author">${esc(meta.sub)}</p>`:''}
      <div class="meta">
        <span class="pill key">Tonalità ${key}${state.shift?` <s>da ${esc(orig+min)}</s>`:''}</span>
        ${song?.capo?`<span class="pill capo">Capo ${esc(song.capo)}</span>`:''}
        ${tags.map(t=>`<button class="pill" data-tag="${esc(t)}" style="--c:${tagColor(t)}"><span class="dot"></span>${esc(t)}</button>`).join('')}
      </div>
    </header>
    <div class="sheet ${state.lyricsOnly?'lyrics-only':''} ${state.cols?'cols':''}" style="--fs:${state.fs}px">${body}</div>
    ${inSet?`<div class="pager">
      ${prev?`<button data-id="${prev.id}">${icon('back')}<span><small>${esc(prev.m)}</small><b>${esc(byId[prev.id].title)}</b></span></button>`:''}
      ${next?`<button class="nx" data-id="${next.id}"><span><small>Prossimo · ${esc(next.m)}</small><b>${esc(byId[next.id].title)}</b></span>${icon('next')}</button>`:''}
    </div>`:''}
  </article>
  <div class="dock-wrap"><div class="dock" role="toolbar" aria-label="Strumenti del canto">
    ${inSet?`<button data-id="${prev?prev.id:''}" ${prev?'':'disabled'} aria-label="Canto precedente" class="hide-m">${icon('back')}</button><span class="sep hide-m"></span>`:''}
    <div class="grp">
      <button data-act="down" aria-label="Abbassa di un semitono">−</button>
      <button class="val" data-act="reset" title="Torna alla tonalità originale" aria-label="Tonalità ${key}, tocca per tornare all’originale"><small>${state.shift?(state.shift>0?'+':'')+state.shift+' st':'Tono'}</small>${key}</button>
      <button data-act="up" aria-label="Alza di un semitono">+</button>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <button data-act="fsm" aria-label="Testo più piccolo" style="font-size:.8rem">A</button>
      <span class="fsv">${state.fs}px</span>
      <button data-act="fsp" aria-label="Testo più grande" style="font-size:1.15rem">A</button>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <button data-act="lyr" class="${state.lyricsOnly?'on':''}" aria-pressed="${state.lyricsOnly}" aria-label="Solo testo" title="Solo testo, senza accordi">${icon('text')}</button>
      <button data-act="cols" class="cols-btn ${state.cols?'on':''}" aria-pressed="${state.cols}" aria-label="Due colonne" title="Due colonne: tutto il canto in una schermata">${icon('cols')}</button>
      <button data-act="scroll" class="${state.scroll?'on':''}" aria-pressed="${state.scroll}" aria-label="Scorrimento automatico" title="Scorrimento automatico">${icon(state.scroll?'pause':'play')}</button>
    </div>
    ${inSet?`<span class="sep"></span><button data-id="${next?next.id:''}" ${next?'':'disabled'} aria-label="Canto successivo">${icon('next')}</button>`:''}
  </div></div>`;
  onScroll();
}
function onScroll(){
  const tb=$('#topbar'); if(!tb) return;
  tb.classList.toggle('scrolled', scrollY>150);
  let cur=null; document.querySelectorAll('.sec').forEach(s=>{ if(s.getBoundingClientRect().top<innerHeight*.4) cur=s.id.slice(3); });
  document.querySelectorAll('#struct button').forEach(b=>b.classList.toggle('cur', scrollY>60 && b.dataset.sec===cur));
}
addEventListener('scroll',onScroll,{passive:true});

/* ---- Home ---- */
function nextSunday(){ const d=new Date(); d.setDate(d.getDate()+((7-d.getDay())%7)); return d; }
function sundayLabel(){ return nextSunday().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'}).replace(/^./,c=>c.toUpperCase()); }
function renderHome(){
  document.body.classList.remove('open');
  document.body.classList.toggle('at-home', state.view==='home'||!isM());
  const [messa,tempi,temi,sacr] = GROUPS;
  $('#main').innerHTML=`<div class="home">
    <div class="home-top">
      <div class="brand"><span class="mark">${icon('cross')}</span><span style="flex:1"><h1>Canzoniere</h1><p>Parrocchia San Marco · Udine</p></span>
        <button class="icon-btn" data-theme-btn aria-label="Cambia tema">${icon('moon')}</button></div>
      <button class="fake" id="fakeSearch">${icon('search')}Titolo, autore o parole del testo…</button>
    </div>
    <div class="eyebrow"><span class="num">${sundayLabel()}</span></div>
    <h2>Che cosa cantiamo oggi?</h2>
    <section class="sl">
      <div class="sl-head">
        <span class="ic">${icon('list')}</span>
        <span class="grow"><b>Setlist di domenica</b><small>${SETLIST.length} canti</small></span>
        <button class="go" data-id="${SETLIST[0].id}">${icon('play','s fill')}Inizia</button>
      </div>
      <button class="sl-sum" data-view="set"><span>${SETLIST.map(x=>esc(byId[x.id].title)).join('  ·  ')}</span>${icon('next','s')}</button>
    </section>
    <h3>Momenti della Messa</h3>
    <div class="steps">${messa[2].filter(t=>COUNTS[t]).map((t,i)=>`<button class="step" data-tag="${esc(t)}" data-go><span class="k">${i+1}</span><b>${esc(t)}</b><small>${COUNTS[t]}</small></button>`).join('')}</div>
    <h3>Aperti di recente</h3>
    <div class="recent">${state.recent.slice(0,3).map(id=>byId[id]).filter(Boolean).map(s=>`<button data-id="${s.id}"><b>${esc(s.title)}</b><small>N° ${s.numero}</small></button>`).join('')}</div>
  </div>`;
}

/* ---- Azioni ---- */
function setView(v){
  state.view=v; if(v!=='home'){ /* la lista è la vista */ }
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  if(v==='home'||isM()){ state.id=null; }
  renderList(); if(!state.id) renderHome();
  if(isM()) scrollTo(0,0);
}
function openSong(id){
  stopScroll(); state.id=id; state.shift=0;
  state.recent=[id,...state.recent.filter(x=>x!==id)].slice(0,6);
  renderSong(); renderList(); scrollTo(0,0);
  $('#list .row.on')?.scrollIntoView({block:'nearest'});
}
function stopScroll(){ state.scroll=false; clearInterval(window._sc); }
function setTag(t,go){
  state.tag = state.tag===t&&!go ? null : t;
  if(go){ state.view='all'; state.q=''; $('#q').value=''; document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view==='all')); }
  $('#filters').classList.remove('open');
  renderChips(); renderList();
  if(go&&isM()){ state.id=null; document.body.classList.remove('at-home','open'); scrollTo(0,0); }
}
document.addEventListener('click',e=>{
  const c=s=>e.target.closest(s); let el;
  if((el=c('[data-id]'))){ if(el.dataset.id) openSong(el.dataset.id); return; }
  if((el=c('[data-sec]'))){ document.getElementById('sec'+el.dataset.sec).scrollIntoView({behavior:'smooth',block:'start'}); return; }
  if((el=c('[data-tag]'))){ setTag(el.dataset.tag, el.hasAttribute('data-go')||el.classList.contains('pill')); return; }
  if((el=c('[data-view]'))){ setView(el.dataset.view); return; }
  if((el=c('[data-act]'))){ const k=el.dataset.act;
    if(k==='up')state.shift=state.shift>=6?-5:state.shift+1;
    if(k==='down')state.shift=state.shift<=-5?6:state.shift-1;
    if(k==='reset')state.shift=0;
    if(k==='fsp')state.fs=Math.min(32,state.fs+1);
    if(k==='fsm')state.fs=Math.max(13,state.fs-1);
    if(k==='lyr')state.lyricsOnly=!state.lyricsOnly;
    if(k==='cols')state.cols=!state.cols;
    if(k==='scroll'){ state.scroll=!state.scroll; clearInterval(window._sc); if(state.scroll) window._sc=setInterval(()=>{ scrollBy(0,1); if(innerHeight+scrollY>=document.body.scrollHeight-2){stopScroll();renderSong();} },50); }
    const y=scrollY; renderSong(); scrollTo(0,y); return; }
  if(c('#back')){ if(document.body.classList.contains('stage')&&!isM()){ document.body.classList.remove('stage'); renderSong(); return; } stopScroll(); state.id=null; renderHome(); renderList(); return; }
  if(c('#homeBtn')){ stopScroll(); state.id=null; if(isM()) setView('home'); else { renderHome(); renderList(); } scrollTo(0,0); return; }
  if(c('#stageBtn')){ document.body.classList.toggle('stage'); const y=scrollY; renderSong(); scrollTo(0,y); return; }
  if(c('#favBtn')){ state.fav.has(state.id)?state.fav.delete(state.id):state.fav.add(state.id); const y=scrollY; renderSong(); renderList(); scrollTo(0,y); return; }
  if(c('#resetBtn')||c('#qClear')){ if(c('#resetBtn')) state.tag=null; state.q=''; $('#q').value=''; renderChips(); renderList(); return; }
  if(c('#fakeSearch')){ setView('all'); $('#q').focus(); return; }
  if(c('#filtersToggle')){ $('#filters').classList.toggle('open'); renderList(); return; }
  if(c('[data-theme-btn]')){ const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme:dark)').matches; r.dataset.theme = dark?'light':'dark'; return; }
});
$('#q').addEventListener('input',e=>{ state.q=e.target.value.trim(); if(isM()&&state.view==='home') setView('all'); renderList(); });
document.addEventListener('keydown',e=>{
  const typing = document.activeElement===$('#q');
  if(e.key==='/'&&!typing){ e.preventDefault(); $('#q').focus(); return; }
  if(e.key==='Escape'&&typing){ state.q=''; $('#q').value=''; $('#q').blur(); renderList(); return; }
  if(typing||!state.id||e.metaKey||e.ctrlKey) return;
  const si=SETLIST.findIndex(x=>x.id===state.id);
  if(e.key==='ArrowRight'&&SETLIST[si+1]&&si>=0) openSong(SETLIST[si+1].id);
  if(e.key==='ArrowLeft'&&si>0) openSong(SETLIST[si-1].id);
  const act={'+':'up','=':'up','-':'down','0':'reset'}[e.key];
  if(act) document.querySelector(`[data-act="${act}"]`)?.click();
});
$('#cAll').textContent=INDEX.length;
$('#foot').textContent=`Bozza v3 · Disponibile offline · ${INDEX.length} canti`;

renderChips(); renderList();
if(isM()){ state.view='home'; } else document.querySelectorAll('.tabbar [data-view]').forEach(b=>b.classList.remove('on'));
renderHome();
</script>
</body>
</html>
