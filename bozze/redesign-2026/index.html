<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Canzoniere San Marco — bozza grafica v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Manrope';font-weight:200 800;font-display:swap;src:url('../../public/fonts/manrope-latin.woff2') format('woff2')}
@font-face{font-family:'Manrope';font-weight:200 800;font-display:swap;src:url('../../public/fonts/manrope-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA,U+1E00-1EFF}

/* ---------- Token ---------- */
:root{
  --bg:#f7f5f0; --surface:#ffffff; --surface-2:#f1eee6; --sunken:#ebe7dd;
  --ink:#1b1d24; --ink-2:#4b4f5c; --ink-3:#858996; --line:#e5e1d6; --line-2:#d3cdbf;
  --navy:#16233d; --gold:#a8822f; --gold-soft:#f5ebd2; --gold-line:#e3cf9c;
  --chord:#9a1b38; --chord-bg:rgba(154,27,56,.07);
  --accent:#16233d; --accent-ink:#fff;
  --shadow:0 1px 2px rgba(22,35,61,.05),0 8px 24px -10px rgba(22,35,61,.14);
  --shadow-lg:0 2px 4px rgba(22,35,61,.06),0 22px 50px -14px rgba(22,35,61,.3);
  --r:16px; --r-sm:11px;
  --serif:'Fraunces',Georgia,serif; --sans:'Manrope',system-ui,sans-serif;
  /* un colore per famiglia di tag */
  --g-messa:#2c6a8c; --g-tempi:#6a55b0; --g-temi:#a8822f; --g-sacr:#3d7a52; --g-altri:#858996;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e131d; --surface:#151b28; --surface-2:#1b2231; --sunken:#0a0e16;
  --ink:#eef0f5; --ink-2:#b6bbc9; --ink-3:#7d8496; --line:#232b3c; --line-2:#333c52;
  --gold:#e0bc6a; --gold-soft:rgba(224,188,106,.12); --gold-line:rgba(224,188,106,.35);
  --chord:#f2a765; --chord-bg:rgba(242,167,101,.1);
  --accent:#e0bc6a; --accent-ink:#141a26;
  --g-messa:#6fb3d6; --g-tempi:#a694ea; --g-temi:#e0bc6a; --g-sacr:#74c08d; --g-altri:#7d8496;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.5);
  --shadow-lg:0 22px 50px -14px rgba(0,0,0,.75);
}}
:root[data-theme="dark"]{
  --bg:#0e131d; --surface:#151b28; --surface-2:#1b2231; --sunken:#0a0e16;
  --ink:#eef0f5; --ink-2:#b6bbc9; --ink-3:#7d8496; --line:#232b3c; --line-2:#333c52;
  --gold:#e0bc6a; --gold-soft:rgba(224,188,106,.12); --gold-line:rgba(224,188,106,.35);
  --chord:#f2a765; --chord-bg:rgba(242,167,101,.1);
  --accent:#e0bc6a; --accent-ink:#141a26;
  --g-messa:#6fb3d6; --g-tempi:#a694ea; --g-temi:#e0bc6a; --g-sacr:#74c08d; --g-altri:#7d8496;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.5);
  --shadow-lg:0 22px 50px -14px rgba(0,0,0,.75);
}

*{box-sizing:border-box}
html,body{margin:0}
html{scroll-padding-top:5rem}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:15px;height:15px}
svg.i.fill{fill:currentColor}

/* ---------- Layout ---------- */
.shell{display:grid;grid-template-columns:392px minmax(0,1fr);min-height:100vh}
.side{min-width:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--surface)}
.main{min-width:0;container-type:inline-size;display:flex;flex-direction:column}
body.stage .shell{grid-template-columns:minmax(0,1fr)}
body.stage .side{display:none}

/* Brand */
.brand{display:flex;align-items:center;gap:.75rem;padding:1.15rem 1.25rem .9rem}
.brand-home{display:flex;align-items:center;gap:.75rem;border:0;background:none;padding:0;text-align:left;flex:1;min-width:0}
.mark{width:40px;height:40px;border-radius:12px;background:var(--navy);display:grid;place-items:center;color:#e0bc6a;flex:none;box-shadow:inset 0 0 0 1px rgba(224,188,106,.35)}
.brand h1{font-family:var(--serif);font-weight:600;font-size:1.25rem;margin:0;letter-spacing:-.01em;line-height:1.1}
.brand p{margin:.12rem 0 0;font-size:.74rem;color:var(--ink-3)}
.icon-btn{width:40px;height:40px;border-radius:11px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink-2);transition:background .15s,color .15s;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn.on{color:var(--gold)}

/* Search */
.search{position:relative;margin:0 1.25rem;display:block}
.search input{width:100%;height:48px;border-radius:13px;border:1px solid var(--line);background:var(--surface-2);padding:0 3rem 0 2.7rem;font-size:16px;outline:none;transition:border-color .15s,background .15s,box-shadow .15s}
.search input::placeholder{color:var(--ink-3)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search input:focus{background:var(--surface);border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.search>.i{position:absolute;left:.85rem;top:14px;color:var(--ink-3)}
.search kbd{position:absolute;right:.7rem;top:13px;font:600 .7rem var(--sans);color:var(--ink-3);border:1px solid var(--line-2);border-radius:6px;padding:.12rem .42rem;background:var(--surface)}
.search .clear{position:absolute;right:.4rem;top:6px;width:36px;height:36px;border:0;border-radius:10px;background:none;color:var(--ink-3);display:none;place-items:center}
.search.has .clear{display:grid}.search.has kbd{display:none}

/* Tabs */
.seg{display:flex;gap:.25rem;margin:.8rem 1.25rem 0;padding:.25rem;background:var(--surface-2);border-radius:13px}
.seg button{flex:1;height:36px;border:0;border-radius:10px;background:transparent;font-size:.83rem;font-weight:600;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:.38rem}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg .count{font-size:.7rem;color:var(--ink-3);font-weight:700}

/* Filtri */
.filters{display:none;padding:.1rem 1.25rem .8rem;border-bottom:1px solid var(--line);margin-bottom:.5rem}
.filters.open{display:block}
.filters .toggle{flex:none;height:32px;width:32px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.filters.open .toggle{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;max-height:42vh;overflow-y:auto}
.chips::-webkit-scrollbar{display:none}
.glabel{display:block;width:100%;font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:.35rem 0 0}
.glabel:first-child{margin-top:0}
.filters.open .glabel{display:block}
.chip{flex:none;display:inline-flex;align-items:center;gap:.4rem;height:32px;padding:0 .72rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.78rem;font-weight:600;color:var(--ink-2);white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--line-2);color:var(--ink)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--c,var(--ink-3))}
.chip em{font-style:normal;font-size:.7rem;color:var(--ink-3);font-weight:700}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on .dot,.chip.on em{background:none;color:inherit;opacity:.75}
.chip.on .dot{display:none}

/* Lista */
.list-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:1rem 1.25rem .5rem;font-size:.7rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);min-height:1.9rem}
.list-head span{display:flex;align-items:center;gap:.35rem;min-width:0}
.list-head button{border:0;background:var(--surface-2);border-radius:999px;height:28px;padding:0 .7rem;font-size:.74rem;font-weight:700;letter-spacing:0;text-transform:none;color:var(--ink-2);display:inline-flex;align-items:center;gap:.3rem;white-space:nowrap}
.list-head button.on{background:var(--accent);color:var(--accent-ink)}
.list-head em{font-style:normal;font-weight:700;opacity:.7}
.list{list-style:none;margin:0;padding:0 .65rem 1.5rem;overflow-y:auto;flex:1;scrollbar-width:thin}
.letter{position:sticky;top:0;z-index:1;background:linear-gradient(var(--surface) 72%,transparent);padding:.55rem .65rem .3rem;font-family:var(--serif);font-size:1rem;color:var(--gold);font-weight:600}
.row{display:flex;align-items:center;gap:.8rem;width:100%;min-height:54px;padding:.55rem .65rem;border:0;border-radius:13px;background:transparent;text-align:left;transition:background .12s}
.row:hover{background:var(--surface-2)}
.row.on{background:var(--gold-soft);box-shadow:inset 0 0 0 1px var(--gold-line)}
.row .n{flex:none;width:2.1rem;font-variant-numeric:tabular-nums;font-size:.74rem;font-weight:700;color:var(--ink-3);text-align:right}
.row.on .n{color:var(--gold)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:650;font-size:.98rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;margin-top:.14rem;font-size:.76rem;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small .tg{font-weight:inherit}
.row .t small.snip{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--ink-2);line-height:1.35}
.row .fav{flex:none;color:var(--gold);visibility:hidden}
.row .fav.on{visibility:visible}
.empty{padding:2.2rem 1rem;text-align:center;color:var(--ink-3);font-size:.9rem;line-height:1.5}
mark{background:var(--gold-soft);color:var(--ink);border-radius:3px;padding:0 .12em;box-shadow:inset 0 -1px 0 var(--gold-line)}
.side-foot{display:flex;align-items:center;gap:.5rem;padding:.75rem 1.25rem;border-top:1px solid var(--line);font-size:.74rem;color:var(--ink-3)}
.side-foot .ok{width:7px;height:7px;border-radius:50%;background:#3f9a5c;box-shadow:0 0 0 3px rgba(63,154,92,.18)}

/* ---------- Canto ---------- */
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:.35rem;height:60px;padding:0 clamp(.6rem,3cqw,2rem);background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar .back{display:none}
body.stage .topbar .back{display:grid}
.struct{flex:1;min-width:0;display:flex;align-items:center;gap:.3rem;overflow-x:auto;scrollbar-width:none;padding:0 .25rem}
.struct::-webkit-scrollbar{display:none}
.struct .mini{font-family:var(--serif);font-weight:600;font-size:1rem;margin-right:.6rem;white-space:nowrap;max-width:0;opacity:0;overflow:hidden;transition:max-width .25s,opacity .2s}
.topbar.scrolled .struct .mini{max-width:16rem;opacity:1}
.struct button{flex:none;height:30px;min-width:30px;padding:0 .55rem;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:.72rem;font-weight:800;letter-spacing:.03em;color:var(--ink-2)}
.struct button.r{color:var(--gold);border-color:var(--gold-line)}
.struct button.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.song{width:100%;max-width:860px;margin:0 auto;padding:.6rem clamp(1rem,4cqw,3rem) 3rem;flex:1}
.song.wide{max-width:1240px}
.song-hero{padding:1.1rem 0 1.5rem;border-bottom:1px solid var(--line);margin-bottom:1.7rem}
.eyebrow{display:flex;align-items:center;flex-wrap:wrap;gap:.55rem;font-size:.74rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.eyebrow .num{color:var(--gold)}
.song-hero h2{font-family:var(--serif);font-weight:600;font-size:clamp(2rem,6cqw,3.2rem);line-height:1.04;letter-spacing:-.02em;margin:.5rem 0 .35rem;text-wrap:balance}
.song-hero .author{font-size:1.02rem;color:var(--ink-2);margin:0}
.meta{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:1.1rem}
.pill{display:inline-flex;align-items:center;gap:.42rem;height:32px;padding:0 .75rem;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.8rem;font-weight:600;color:var(--ink-2)}
button.pill:hover{border-color:var(--line-2);color:var(--ink)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.pill.key{color:var(--chord);background:var(--chord-bg);border-color:transparent;font-weight:700}
.pill.key s{text-decoration:none;opacity:.55;font-weight:600}
.pill.capo{color:var(--ink);background:var(--gold-soft);border-color:transparent}

/* Sezioni */
.sheet{font-size:var(--fs)}
.sec{display:grid;grid-template-columns:112px minmax(0,1fr);gap:1.25rem;margin-bottom:1.5rem;break-inside:avoid;scroll-margin-top:5rem}
.sec-label{padding-top:1.42em;font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:right;line-height:1.3}
.sec-label span{font-size:.7rem}
.sec-body{min-width:0}
.sec.chorus .sec-label{color:var(--gold)}
.sec.chorus .sec-body{background:var(--gold-soft);border-radius:var(--r-sm);padding:.7em 1em .75em;margin:-.1em 0 0 -1em;box-shadow:inset 3px 0 0 var(--gold)}
.sec.chorus .ly{font-weight:650}
.sec.inst .sec-body{padding-top:1.1em}
.sec.note .sec-body{display:none}
.sec.note{margin-bottom:1rem}
.sec.note .sec-label{grid-column:2;text-align:left;padding:0;color:var(--gold)}
.ln{display:flex;flex-wrap:wrap;align-items:flex-end;margin-bottom:.12em}
.seg-w{display:inline-flex;flex-direction:column;white-space:pre;flex:none}
.wd{display:inline-flex;flex-wrap:nowrap;align-items:flex-end;flex:none}
.ch{padding-right:.55em;font-weight:750;font-size:.8em;color:var(--chord);line-height:1.3;letter-spacing:.01em}
.ln{min-height:calc(1.5em + 1.04em)}
.ln.plain,.ln.only-chords,.lyrics-only .ln{min-height:0}
.ly{font-weight:500;line-height:1.5}
.ln.only-chords .ly{display:none}
.ln.only-chords .seg-w{white-space:pre-wrap;flex:initial;min-width:0}
.ln.only-chords .ch{padding-right:0;overflow-wrap:anywhere}
.ln.only-chords .ch{font-size:.88em;line-height:1.7}
.lyrics-only .ch{display:none}
.lyrics-only .ln.only-chords,.lyrics-only .sec.inst{display:none}
.lyrics-only .ln{margin-bottom:0}
.lyrics-only .ly{line-height:1.6}

/* due colonne (solo quando c'è spazio) */
@container (min-width:940px){
  .sheet.cols{columns:2;column-gap:3.5rem;column-rule:1px solid var(--line)}
  .sheet.cols .sec{grid-template-columns:1fr;gap:.3rem}
  .sheet.cols .sec-label{text-align:left;padding-top:0}
  .sheet.cols .sec.chorus .sec-body{margin-left:0}
  .sheet.cols .sec.note .sec-label{grid-column:1}
}
@container (max-width:939px){ .dock .cols-btn{display:none} }
@container (max-width:520px){ .sl-head .ic{display:none} .sl-head{gap:.6rem} }
@container (max-width:640px){
  .sec{grid-template-columns:1fr;gap:.3rem}
  .sec-label{text-align:left;padding-top:0}
  .sec.chorus .sec-body{margin-left:0;padding:.6em .8em .65em}
  .sec.note .sec-label{grid-column:1}
}

/* Prossimo / precedente */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-top:2.5rem}
.pager button{display:flex;align-items:center;gap:.8rem;padding:.95rem 1.1rem;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);text-align:left;min-width:0;transition:border-color .15s,box-shadow .15s}
.pager button:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.pager .nx{grid-column:2;justify-content:flex-end;text-align:right}
.pager small{display:block;font-size:.68rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.pager b{display:block;font-family:var(--serif);font-weight:600;font-size:1.12rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pager span{min-width:0}

/* Barra strumenti */
.dock-wrap{position:sticky;bottom:0;z-index:20;display:flex;justify-content:center;padding:0 .75rem calc(1.1rem + env(safe-area-inset-bottom));pointer-events:none}
.dock{pointer-events:auto;display:flex;align-items:center;gap:.15rem;padding:.38rem;border-radius:20px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:var(--shadow-lg);max-width:100%}
.dock .grp{display:flex;align-items:center;gap:.05rem}
.dock .sep{width:1px;height:26px;background:var(--line);margin:0 .25rem}
.dock button{height:42px;min-width:42px;border:0;border-radius:13px;background:transparent;display:grid;place-items:center;font-weight:700;color:var(--ink-2);padding:0 .5rem;transition:background .12s,color .12s}
.dock button:hover{background:var(--surface-2);color:var(--ink)}
.dock button.on{background:var(--accent);color:var(--accent-ink)}
.dock button:disabled{opacity:.3;cursor:default;background:none}
.dock .val{min-width:3.7rem;line-height:1.1;font-size:.9rem;color:var(--chord)}
.dock .val small{display:block;font-size:.6rem;font-weight:700;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.dock .fsv{min-width:2.6rem;text-align:center;font-size:.76rem;font-weight:700;color:var(--ink-3)}

/* ---------- Home ---------- */
.home{width:100%;max-width:980px;margin:0 auto;padding:2.6rem clamp(1rem,4cqw,3rem) 6rem}
.home h2{font-family:var(--serif);font-weight:600;font-size:clamp(2rem,5.5cqw,2.9rem);letter-spacing:-.02em;margin:.45rem 0 1.6rem;line-height:1.06;text-wrap:balance}
.home .lead{color:var(--ink-2);margin:0 0 1.8rem;font-size:1.03rem;max-width:34rem;line-height:1.5}
.home h3{display:flex;align-items:baseline;justify-content:space-between;font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:2.4rem 0 .8rem}
.home h3 small{font-size:.74rem;letter-spacing:0;text-transform:none;font-weight:600}

.sl{border-radius:20px;background:var(--navy);color:#fff;overflow:hidden;box-shadow:var(--shadow-lg)}
.sl-head{display:flex;align-items:center;gap:1rem;padding:1.15rem 1.25rem .95rem}
.sl-sum{display:flex;align-items:center;gap:.6rem;width:100%;border:0;border-top:1px solid rgba(255,255,255,.1);background:none;color:rgba(255,255,255,.72);padding:.8rem 1.25rem;font-size:.84rem;text-align:left}
.sl-sum span{flex:1;min-width:0;white-space:pre;overflow:hidden;text-overflow:ellipsis}
.sl-sum:hover{color:#fff}
.sl-head .ic{width:46px;height:46px;border-radius:13px;background:rgba(224,188,106,.16);color:#e0bc6a;display:grid;place-items:center;flex:none}
.sl-head b{font-family:var(--serif);font-weight:600;font-size:1.25rem;display:block;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl-head small{color:rgba(255,255,255,.6);font-size:.8rem}
.sl-head .grow{flex:1;min-width:0}
.sl-head .go{height:42px;padding:0 1rem;border:0;border-radius:12px;background:#e0bc6a;color:#141a26;font-weight:800;font-size:.86rem;display:flex;align-items:center;gap:.4rem;flex:none}
.sl-list{list-style:none;margin:0;padding:0 .6rem .6rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.1rem .6rem}
.sl-list button{display:flex;align-items:center;gap:.75rem;width:100%;padding:.55rem .65rem;border:0;border-radius:11px;background:transparent;color:#fff;text-align:left;min-width:0}
.sl-list button:hover{background:rgba(255,255,255,.07)}
.sl-list .k{width:1.5rem;height:1.5rem;border-radius:50%;border:1px solid rgba(224,188,106,.45);color:#e0bc6a;font-size:.68rem;font-weight:800;display:grid;place-items:center;flex:none}
.sl-list span{min-width:0}
.sl-list small{display:block;font-size:.66rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.sl-list b{display:block;font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0 1.5rem}
.step{display:flex;align-items:center;gap:.7rem;height:48px;padding:0 .4rem;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;transition:background .12s}
.step:hover{background:var(--surface-2)}
.step .k{width:1.3rem;font-size:.74rem;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;flex:none}
.step b{flex:1;font-size:.95rem;font-weight:600}
.step small{font-size:.76rem;font-weight:700;color:var(--ink-3)}
.cloud{display:flex;flex-wrap:wrap;gap:.45rem}
.cloud .chip{height:36px;font-size:.84rem;padding:0 .9rem}
.recent{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.55rem}
.recent button{padding:.8rem .9rem;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;min-width:0}
.recent button:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.recent b{display:block;font-family:var(--serif);font-weight:600;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent small{font-size:.74rem;color:var(--ink-3)}

.tabbar{display:none}
.home-top{display:none}

/* ---------- Mobile ---------- */
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:0;background:var(--bg);min-height:100vh;padding-bottom:5.5rem}
  .search input{background:var(--surface)}
  .list{overflow:visible;padding-bottom:1rem}
  .letter{background:linear-gradient(var(--bg) 72%,transparent);top:0}
  .side-foot,.seg,.search kbd{display:none}
  body.open .side,body.at-home .side{display:none}
  body:not(.open):not(.home) .main{display:none}
  body.at-home .main{padding-bottom:5rem}
  .topbar .back{display:grid}
  .topbar .stage-btn{display:none}
  .home{padding-top:1rem}
  .home-top{display:block;margin-bottom:1.8rem}
  .home-top .brand{padding:0 0 .9rem}
  .home-top .fake{display:flex;align-items:center;gap:.6rem;width:100%;height:48px;border-radius:13px;border:1px solid var(--line);background:var(--surface);padding:0 .9rem;color:var(--ink-3);font-size:16px;text-align:left}
  .dock button{height:40px;min-width:38px;padding:0 .35rem}
  .dock .val{min-width:3.2rem}
  .dock .fsv,.dock .hide-m{display:none}
  .dock .sep{margin:0 .1rem}
  .pager{grid-template-columns:1fr}
  .pager .nx{grid-column:1}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:15;justify-content:space-around;padding:.4rem .5rem calc(.4rem + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  body.open .tabbar{display:none}
  .tabbar button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:.15rem;font-size:.66rem;font-weight:700;color:var(--ink-3);padding:.3rem}
  .tabbar button.on{color:var(--ink)}
  .tabbar button.on svg{color:var(--gold)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.draft{position:fixed;bottom:.6rem;left:.6rem;z-index:50;font-size:.62rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:var(--chord);color:#fff;padding:.22rem .6rem;border-radius:999px;opacity:.8;pointer-events:none}
:root[data-theme="dark"] .draft{color:#141a26}
</style>

,"search":"Alleluia e Poi  Intro  Strofa 1    Chiama    ed  io  verrò  da   Te    Figlio  nel silenzio   mi  accoglierai.    Voce   e poi  la  libertà    nella  tua  parola   camminerò  Ritornello    Alleluia      Alleluia        Alleluia    Alleluia      Alle -    lu  -   ia    Alleluia      Alleluia        Alleluia    Alleluia      Alle -  lu - ia  Strofa 2    Danza    ed  io verrò   con  Te    Figlio  la tua  strada  comprenderò.    Luce  e  poi  nel tempo     Tuo    oltre il desiderio riposerò    RIT."},{"id":"andate-per-le-strade","numero":19,"title":"Andate per le Strade","sub":"","search":"Andate per le Strade  Ritornello Andate    per  le strade   in tutto  il mondo,       chiamate     i miei  amici  per   far festa,       c'è  un  posto   per  ciascuno      alla  mia  mensa!  Strofa 1              Nel  vostro   cammino      annunciate     il Vangelo,                 dicendo:    \"è vicino   il Regno   dei  cieli\".                 Guarite   i malati,  mondate      i lebbrosi,                 rendete   la vita  a chi  l'ha perduta.  Strofa 2              Vi è stato donato   con  amore   gratuito:                 ugualmente   donate   con  gioia e per  amore.                 Con  voi  non  prendete  né  oro  né argento,                 perché  l'operaio  ha diritto al suo cibo.  Strofa 3              Entrando   in una  casa donatele   pace.                 Se c'è chi vi rifiuta e non accoglie  il dono                 la pace torni a  voi, e uscite dalla casa                 scuotendo   la polvere  dai vostri calzari.  Strofa 4              Ecco  io vi mando   come   agnelli in mezzo   ai lupi:                 siate dunque   avveduti  come   sono  i serpenti.                 Ma  liberi e chiari come  le colombe:                 dovrete  sopportare   prigioni  e tribunali.  Strofa 5              Nessuno   è più  grande  del proprio   maestro:                 né il servo è più importante    del suo padrone.                 Se hanno   odiato  me  odieranno   anche   voi,                 voi non  temete:  non   vi lascio soli."},{"id":"antica-eterna-danza","numero":20,"title":"Antica, Eterna Danza","sub":"","search":"Antica, Eterna Danza  Intro  Strofa 1              Spighe   d'oro   al vento,   antica,   eterna   danza              per  fare  un  solo  pa   -  ne  spezzato    sulla mensa.              Grappoli    dei   colli, profumo     di letizia              per  fare  un  solo   vi  -  no    bevanda     della  grazia.  Interludio  Strofa 2              Con   il pane   e il vino,  Signore   ti doniamo              le nostre   gioie  pure,  le  attese  e le paure.              Frutti  del  lavoro   e fede   nel futuro,              la voglia   di cambiare     e di ricominciare.  Strofa a vuoto  Strofa 3              Dio   della  speranza,   sorgente    d'ogni   dono              accogli   questa   offerta  che  insieme    Ti portiamo.              Dio   dell'universo    raccogli  chi  è disperso              e facci  tutti Chiesa,   una  cosa   in Te."},{"id":"ascoltero-la-tua-parola-capo-2","numero":21,"title":"Ascolterò la Tua Parola","sub":"Capo 2","search":"Ascolterò la Tua Parola Capo 2 Intro  Strofa 1 Ascolterò     la tua parola, nel profondo del mio   cuore    io l'ascolterò. E nel buio della notte la Parola come luce      ri - splenderà.  Strofa 2                                  Mediterò          la tua Parola,                                  nel silenzio della mente       la   mediterò.                                  Nel deserto  delle voci                                  la Parola dell'amore       ri - suonerà.  Strofa 3 E seguirò       la tua Parola, sul sentiero della vita io la seguirò. Nel passaggio del dolore la Parola della croce mi   salverà.  Strofa 4 Custodirò la tua Parola, per la sete dei miei giorni la custodirò. Nello scorrere del tempo la parola dell'eterno non passerà.  Strofa 5 Annuncerò      la tua Parola, camminando   in questo  mondo    io l'annuncerò. Le frontiere del tuo regno la Parola come un  vento   spa  - lancherà"},{"id":"ave-maria","numero":22,"title":"Ave Maria","sub":"","search":"Ave Maria  Ritornello Ave          Maria,        Ave.       Ave           Maria,        Ave.  Strofa 1              Donna     dell'attesa  e  madre    di speranza    ora  pro   nobis.              Donna     del sorriso   e madre    del  silenzio  ora  pro   nobis.              Donna     di frontiera   e madre    dell'ardore    ora  pro   nobis.              Donna     del riposo   e  madre    del sentiero   ora  pro   nobis.  Ritornello (ripetere)  Strofa 2              Donna     del deserto    e madre    del  respiro  ora   pro  nobis.              Donna     della  sera e  madre    del  ricordo   ora  pro  nobis.              Donna     del presente    e madre    del  ritorno   ora  pro   nobis.              Donna     della  terra  e madre    dell'amore    ora   pro   nobis.  Ritornello (ripetere)"},{"id":"beati-i-misericordiosi-inno-gmg-2016-capo-2","numero":23,"title":"Beati i Misericordiosi","sub":"Inno GMG 2016 - Capo 2","search":"Beati i Misericordiosi Inno GMG 2016 - Capo 2 Intro  Strofa 1      Sei  sceso    dalla  tua  immensità,      in nostro   aiuto.    Misericordia    scorre   da  te,      sopra    tutti noi.      Persi   in un  mondo     d'oscurità,    lì Tu ci trovi.    Nelle  tue  braccia   ci stringi  e  poi,    dai  la vita  per  noi.  Ritornello Beato    è il cuore  che   perdona!         Misericordia     riceverà   da   Dio  in cielo!         Beato    è il cuore   che  perdona!         Misericordia    riceverà    da  Dio  in cielo!  Strofa 2        Solo   il perdono   riporterà,   pace   nel  mondo.    Solo   il perdono   ci svelerà,          come    figli tuoi.  Ritornello (2 volte) Beato    è il cuore  che   perdona!         Misericordia     riceverà   da   Dio  in cielo!  X2  Interludio  Strofa 3         Col  sangue    in croce   hai  pagato    Tu,  le nostre   povertà.    Se  noi  ci amiamo     e  restiamo    in te,    il mondo    crederà!  Ritornello Beato    è il cuore  che   perdona!         Misericordia     riceverà   da   Dio  in cielo!         Beato    è il cuore   che  perdona!         Misericordia    riceverà    da  Dio  in cielo!  Strofa 4         Le  nostre   angosce     ed  ansietà,   gettiamo    ogni  attimo   in te.    Amore    che   non   abbandona      mai,  vivi in  mezzo    a noi!  Ritornello finale Beato    è il cuore  che   perdona!          Misericordia     riceverà   da  Dio   in cielo!          Beato    è il cuore   che  perdona!          Misericordia     riceverà   da  Dio   in cielo!  Ritornello (ripetere)         Beato    è il cuore   che  perdona!         Misericordia     riceverà   da   Dio  in cielo!  Ritornello (ultima volta)          Beato    è il cuore   che  perdona!          Misericordia     riceverà   da  Dio   in cielo! "},{"id":"benedici-o-signore","numero":24,"title":"Benedici, o Signore","sub":"","search":"Benedici, o Signore  Strofa 1 Nebbia    e  freddo   giorni  lunghi   e amari,   mentre    il seme   muore. Poi  il prodigio   antico   e sempre    nuovo     del  primo    filo d'erba. E nel  vento   dell'estate   ondeggiano      le spighe;   avremo    ancora    pane.  Ritornello Benedici,    o Signore,    questa   offerta  che  portiamo     a te.           Facci  uno   come    il pane,   che  anche    oggi  hai  dato   a noi.  Strofa 2 Nei   filari, dopo   il lungo  inverno,    fremono     le viti. La  rugiada   avvolge    nel  silenzio,  i primi  tralci verdi. Poi  i colori  dell'autunno,    coi  grappoli    maturi;   avremo    ancora    vino.  Ritornello Benedici,    o Signore,    questa   offerta  che  portiamo     a te.           Facci  uno   come    il vino,  che  anche   oggi   hai dato   a noi."},{"id":"benedizione-a-frate-leone","numero":25,"title":"Benedizione a Frate Leone","sub":"","search":"Benedizione a Frate Leone  Strofa Benedicat   tibi Dominus       et  custodiat   te Ostendat   faciem    suam   tibi et miseratur    tui Convertat    vultum   suum    ad  te et  det  tibi pa   -   cem Dominus    benedicat,    frater  Leo,  te.  Ritornello      Benedi      - i  - cat,  benedi    -  i -  cat      Benedicat    tibi     Do   - mi   - nus       et custodiat   te  Interludio - Violini 1 battuta  Ritornello (ripetere)      Benedicat    tibi     Do   - mi   - nus       et custodiat   te  Finale    Benedicat,    benedicat,    benedicat,    benedicat Tibi Dominus,     benedicat    tibi Dominus     et custodiat    te"},{"id":"bisognerebbe","numero":26,"title":"Bisognerebbe","sub":"","search":"Bisognerebbe  Intro  Ritornello Bisognerebbe   attraversar  la strada e andare  via  da qui       Senza  chiedersi  più: domani   che  sarà?       E  andare  oltre questo  nostro  cuore,          che  freme  sotto il sole       Stanco   del nostro  pianto.       Finire di cercare  quel  che non  può  accadere,       perché   non  serve correre,  se non  sai più dove  andare.  Strofa 1              E tu che hai corso  tanto,  senza arrivare  mai,                 sotto il tuo cielo grigio, dimmi  tu che  farai.                 Tu che  hai già scordato,  cos'è un  sorriso vero                 Se hai già dimenticato   anche  il pianto sincero.  Strofa 2              E tu che  non  dividi le pene  che tu hai                 Dentro  il tuo cuore  chiuso  dimmi   che farai…                 Tu che  dici: \"sto meglio  quando   non   c'è nessuno\"                 Se un giorno   volessi parlare con  qualcuno?  Strofa 3              Non   certo attendo   che si vive di più                 Tantomeno     fingendo  come   adesso  fai tu.                 La strada è meno    lunga quando    incontri qualcuno                 E varrebbe  la pena  di prendersi  per  mano.  Finale Bisognerebbe    attraversar  la strada e andare  via da  qui         Senza  chiedersi più: domani    che sarà?         E andare  oltre questo  nostro  cuore  che  freme  sotto il sole         Stanco  del nostro  pianto.         Finire di cercare quel  che non   accadrà         ieri è soltanto ieri, domani  si vedrà!"},{"id":"camminero-in-re","numero":27,"title":"Camminerò","sub":"In RE","search":"Camminerò In RE Ritornello         Camminerò,       camminerò         Per la Tua   strada  Signor         Dammi     la mano       Voglio   restare       Per  sempre    assieme   a Te  Strofa 1 Quando     ero  solo,  solo  e  stanco   del  mondo,     Quando      non   c'era l'amor,     Tante   persone     vive  intorno   a  me     Sentivo    cantare   così  Strofa 2 Io  non   capivo,   ma   rimasi  a sentire     Quando      anch'io   vidi il Signor     Lui  mi  chiamava,     chiamava     anche   me     E  la mia  risposta   si alzò  Strofa 3 Ora   non   m'importa     se  uno  ride  di  me     Lui  certamente     non   sa     Del  gran   tesoro   che  trova   in quel  dì     Che   dice  al Signore   così  Strofa 4 A  volte   sono   stanco   e mi  guardo    intorno     Scopro    il mondo    e  l'amor     Son   questi  i doni  che   Lui fa a  me     E  dice:  ritorna  a cantar"},{"id":"camminiamo-incontro-al-signore","numero":28,"title":"Camminiamo Incontro al Signore","sub":"","search":"Camminiamo Incontro al Signore  Ritornello Camminiamo         incontro   al Signore,       camminiamo        con   gio  - ia:       Egli    viene,   non   tarderà,    Egli    viene,   ci salverà.  Strofa 1 Egli viene:   il giorno  è  vicino     e la   notte   va verso   l'aurora.        Eleviamo    a  Lui l'anima   nostra,    non   saremo    delusi.        Non   saremo    delusi.  Strofa 2 Egli viene,   vegliamo    in attesa,   ricordando     la sua  parola.        Rivestiamo     la forza  di Dio    per  resistere  al male.  Strofa 3 Egli viene,   andiamogli     incontro,    ritornando     su retti sentieri.        Mostrerà    la sua  misericordia,     ci darà  la  sua  grazia.  Strofa 4 Egli viene:   è il Dio  fedele  che  ci chiama    alla  sua comunione.        Il Signore  sarà  il nostro   bene,   noi  la terra feconda."},{"id":"cantate-al-signore-ricci","numero":29,"title":"Cantate al Signore","sub":"Ricci","search":"Cantate al Signore Ricci Intro Ultimo LA di ogni sequenza: tenere a lungo  Ritornello    Cantate   al  Signore   un  cantico   nuovo    da  tutta  la terra    voi  cantate   al Signore,   cantate   a Lui,  benedite    il nome   Suo.    Annunziate         ogni   giorno   di Lui  la salvezza   e  la gloria,    a tutti i popoli   dite  i prodigi  di  Lui, benedite    il nome    Suo.  Controcanto          È nato   per  noi,  il Signore  per  noi  oggi   è  na   - to,          è nato   per  noi,  il Salvatore   del  mondo     è na   -  to.  Strofa 1    Esultino   i campi,   esulti la terra,  esultino  i mari,    esultino   i cieli cantando    di Lui, benedite    il nome    Suo.    E sia gioia      perché   Lui  stende   già sulla  terra  la mano    Sua    a tutti i popoli   la Sua  giustizia  darà,   benedite    il nome   Suo.  Ordine di esecuzione Ritornello  Strofa 1  Ritornello 2 volte (l'ultima senza controcanto)  Conclusione Pennata finale in RE"},{"id":"cantate-al-signore-un-canto-nuovo-fallormi","numero":30,"title":"Cantate al Signore un Canto Nuovo","sub":"Fallormi","search":"Cantate al Signore un Canto Nuovo Fallormi Strofa 1       Cantate   al Signore    un  canto   nuovo,    perché   ha  compiuto     prodigi.       Ha  manifestato     la sua  salvezza,   su tutti  i popoli  la  sua     bontà.  Strofa 2  Egli si è ricordato    della  sua    fedeltà  i confini  della  terra  hanno    veduto    la salvezza   del  Signor.  Strofa 3  Esultiamo    di gioia,  acclamiamo      al Signor  con  un   suono   melodioso     cantiamo     insieme:   \"Lode    e gloria  al nostro   Re\".  Strofa 4  Frema    il mare  e  la terra: il Signore   verrà  un  giudizio   di giustizia  con   rettitudine   nel  mondo     porterà."},{"id":"cantiamo-te","numero":31,"title":"Cantiamo Te","sub":"Gragnani","search":"Cantiamo Te  Intro  Strofa 1    Cantiamo     Te,  Signore   della  vita:    il nome   tuo   è grande    sulla terra    tutto  parla  di  te e    canta  la tua  gloria.    Grande    Tu  sei e   compi    meraviglie:    tu sei Dio.  Strofa 2    Cantiamo     Te,  Signore   Gesù   Cristo:    Figlio  di Dio   venuto   sulla  terra,    fatto  uomo    per  noi  nel  grembo     di Maria.    Dolce   Gesù     risorto  dalla  morte    sei con  noi.  Strofa 3    Cantiamo     Te,  amore    senza   fine:    Tu  che  sei Dio    lo  Spirito  del  Padre    vivi dentro    di noi  e  guida   i nostri  passi.    Accendi    in noi  il fuoco  dell'eterna    carità"},{"id":"chi","numero":32,"title":"Chi?","sub":"Gen Rosso","search":"Chi?  Intro  Strofa 1                      Filtra un  raggio   di  sole tra  le nubi  del  cielo                      strappa   la terra  al gelo   e nasce  un   fiore.                      E poi  mille  corolle   rivestite  di poesia                      in un  gioco   d'armonia     e di colori.                      Ma   chi  veste  i fiori dei campi?                      Chi  ad  ognuno     dà  colore?  Strofa 2                      Va  col  vento   leggera   una   rondine   in  volo                      il suo  canto   sa solo  di primavera.                      E poi  intreccio   di ali come    giostra  d'allegria                      mille  voli  in fantasia  fra  terre  e mari.                      Ma   chi  nutre  gli uccelli  del cielo?                      Chi  ad  ognuno     da  un  nido?   Chi?  Ritornello Tu  creatore    del mondo.      Tu  che  possiedi   la vita.        Tu  sole  infinito:  Dio  amore.    Tu  degli  uomini    Padre.        Tu  che     abiti il cielo. Tu  immenso      mistero:        Dio  amore,    Dio  amore!  Strumentale  Strofa 3                      Un'immagine       viva  del  Creatore    del mondo                      un  riflesso  profondo     della  Sua  vita.                      L'uomo    centro   del  cosmo    ha  un  cuore   per  amare                      ed  un  mondo     da  plasmare     con  le sue  mani.                      Ma   chi  ha dato   all'uomo    la vita?                      Chi  a lui ha  dato   un  cuore?   Chi?  Ritornello finale Tu  creatore    del mondo.      Tu  che  possiedi   la vita.        Tu  sole  infinito:  Dio  amore.    Tu  degli  uomini    Padre.        Tu  che     abiti il cielo. Tu  immenso      mistero:        Dio  amore,    Dio  amore! Finale       Amore"},{"id":"chi-ci-separera","numero":33,"title":"Chi Ci Separerà","sub":"Frisina","search":"Chi Ci Separerà  Strofa 1                         Chi  ci separerà      dal  suo   amore                         la tribolazione,    forse  la spada?                         Né  morte    o vita      ci separerà,                         dall'amore    in Cri  - sto Signore.  Strofa 2                         Chi  ci separerà   dalla  sua  pace                         la persecuzione,     forse  il dolore?                         Nessun   potere    ci separerà                         da  Colui  che  è  morto    per  noi.  Strofa 3                         Chi  ci separerà   dalla  sua  gioia                         chi potrà   strapparci   il suo  perdono?                         Nessuno    al mondo      ci allontanerà                         dalla  vita in Cristo   Signore."},{"id":"chi-dara-da-bere-a-me","numero":34,"title":"Chi Darà da Bere a Me","sub":"","search":"Chi Darà da Bere a Me  Ritornello Chi  darà   da  bere  a  me   acqua   pura,  acqua    pura,       Chi   ha  l'acqua  di  felici -  tà,       L'acqua    che  ristorerà       L'acqua    che  ristorerà.  Strofa 1                     Il mondo    è  già un  deserto,   la terra  inaridì,                       Milioni   di  assetati  si sentono   morir.  Strofa 2                     Il mio  fratello  ha  sete,  ma   l'acqua   lui non  ha,                        Se  gli indichi  la strada  la fonte   troverà.  Strofa 3                     Orgoglio    e  presunzione     ci tolgono    il respir                        Chiunque     che  vi  beve,  vi  beve  l'ansietà."},{"id":"chiamati-per-nome","numero":35,"title":"Chiamati per Nome","sub":"","search":"Chiamati per Nome  Intro  Ritornello Veniamo    da te, chiamati  per nome          Che  festa Signore  tu cammini   con  noi          Ci parli di te, per noi spezzi  il pane,          ti riconosciamo   il cuore arde  sei tu          E noi  tuo po - polo   siamo  qui!  Strofa 1    Siamo  come   terra ed argilla    E la tua parola  ci plasmerà    Brace  pronta  per la scintilla    E il tuo Spirito soffierà, ci infiammerà!  Strofa 2    Siamo  come   semi  nel solco,    come   vigna che  il suo frutto darà;    Grano   del signore  Risorto,    la Tua messe   che fiorirà, d'eternità!  Ritornello finale Veniamo    da te, chiamati  per nome                    Che   festa Signore tu cammini    con noi                    Ci  parli di te, per noi spezzi il pane,                    ti riconosciamo   il cuore arde  sei tu                    E  noi tuo po - polo   siamo  qui!                     E noi tuo  po - polo  siamo   qui!          Siamo  qui!"},{"id":"cieli-nuovi-e-terra-nuova","numero":163,"title":"Cieli Nuovi e Terra Nuova","sub":"Daniele Ricci · La tua dimora","search":"Cieli Nuovi e Terra Nuova Daniele Ricci La tua dimora Intro Strofa 1 Cieli nuovi e terra nuova è il destino dell'umanità viene il tempo arriva il tempo che ogni realtà si trasfigurerà. E in cieli nuovi e terra nuova il nostro anelito si placherà la tua casa la tua dimora su tutti i popoli si estenderà. Ritornello È il pane del cielo che ci fa vivere che chiama a vivere e andare nel mondo è il pane del cielo che ci fa vivere che chiama a vivere e andare a portare il tuo dono. Strofa 2 Cieli nuovi e terra nuova la speranza non inganna mai e tu risorto ci fai risorti tutto il creato un canto diverrà. E in cieli nuovi e terra nuova c'è il disegno che hai affidato a noi Gerusalemme dal cielo scende Gerusalemme in terra troverà."},{"id":"come-fuoco-vivo","numero":36,"title":"Come Fuoco Vivo","sub":"Gen · Messa Come fuoco vivo","search":"Come Fuoco Vivo  Intro Vocalizzo  Ritornello Come     fuoco   vivo   si accende   in  noi        un'immensa     felicità        che  mai  più  nessuno    ci toglierà        perché   tu sei ritornato.        Chi  potrà   tacere,  da  ora  in poi,        che  sei tu in cammino      con   noi,        che  la morte   è  vinta  per  sempre,        che  ci hai ridonato    la vita?  Strofa 1 Spezzi   il pane  davanti    a noi  mentre    il sole è al tramonto:    ora  gli occhi  ti vedono,    sei tu!  Resta  con   noi.  Strofa 2 E per  sempre    ti mostrerai   in  quel  gesto  d'amore:     mani   che  ancora   spezzano     pane   d'eternità.  Finale"},{"id":"come-l-aurora-verrai","numero":37,"title":"Come l'Aurora Verrai","sub":"Gen Verde","search":"Come l'Aurora Verrai  Strofa 1      Come    l'aurora   verrai,   le tenebre  in luce  cambierai  Tu  per  noi   Si - gnore.      Come    la pioggia   cadrai,   sui nostri  deserti scenderai  Scorrerà     l'amore.  Ritornello 1 battuta         Tutti i nostri sentieri percorrerai         Tutti i figli dispersi raccoglierai         Chiamerai    da ogni   terra il tuo po  - polo         In eterno  ti avremo    con  noi  Strofa 2      Re  di giustizia  sarai   le spade   in aratri forgerai  Ci darai   la pace      Lupo   ed  agnello   vedrai,    insieme   sui prati dove   mai  Tornerà  la notte.  Strofa 3      Dio   di salvezza  tu sei    e  come   una  stella sorgerai  Su di noi   per  sempre      E  chi non  vede,   vedrà      chi ha chiusi  gli orecchi  sentirà  Canterà      di gioia  Finale             Come    l'aurora   verrai"},{"id":"come-maria","numero":38,"title":"Come Maria","sub":"Gen Rosso","search":"Come Maria  Strofa 1 Vogliamo     vivere   Signore,   offrendo    a  Te  la nostra  vita Con   questo    pane   e questo   vino,   accetta  quello   che   noi  siamo. Vogliamo     vivere   Signore,   abbandonati      alla Tua   voce staccati  dalle  cose  vane,   fissati nella  vita  vera.  Ritornello Vogliamo     vivere   come    Maria,       l'irraggiungibile    la Madre    amata       che   vince  il mondo     con  l'amore       e  offrire  sempre   la  tua  vita che  viene   dal  cielo.  Strofa 2 Accetta   dalle  nostre   mani,   come    un'offerta   a  Te  gradita i desideri  di  ogni  cuore,   le ansie  della  nostra   vita. Vogliamo     vivere   Signore,   accesi  dalle  Tue   parole per  riportare   in  ogni  uomo     la fiamma    viva  del  Tuo   amore.  Ritornello (ripetere)"},{"id":"come-tu-mi-vuoi","numero":39,"title":"Come Tu Mi Vuoi","sub":"Branca - Volendo capo 1/2","search":"Come Tu Mi Vuoi  Intro  Strofa 1    Eccomi  Signor,  vengo   a Te mio  Re,  che si compia  in me  la tua volontà.    Eccomi  Signor,  vengo   a Te mio  Dio,  plasma  il cuore mio  e di Te  vivrò.    Se Tu  lo vuoi, Signore  manda   me      e il Tuo nome   annuncerò  Ritornello    Come   Tu  mi  vuoi, io sarò, dove   Tu mi  vuoi io andrò,    Questa  vita io voglio  donarla  a Te  per dar  gloria al Tuo  nome   mio  Re    Come   Tu  mi  vuoi, io sarò, dove   Tu mi  vuoi io andrò,    Se mi  guida il Tuo  Amore   paura  non  ho,    per sempre   io sarò                   come   Tu mi  vuoi.  Strofa 2    Eccomi  Signor,  vengo   a Te mio  Re,  che si compia  in me  la tua volontà.    Eccomi  Signor,  vengo   a Te mio  Dio,  plasma  il cuore mio  e di Te  vivrò.    Tra le tue mani   mai più  vacillerò e strumento   Tuo  sarò  Ritornello    Come   Tu  mi  vuoi, io sarò, dove   Tu mi  vuoi io andrò,    Questa  vita io voglio  donarla  a Te  per dar  gloria al Tuo  nome   mio  Re    Come   Tu  mi  vuoi, io sarò, dove   Tu mi  vuoi io andrò,    Se mi  guida il Tuo  Amore   paura  non  ho,    per sempre   io sarò  Finale    Come   Tu  mi  vuoi  (Io sarò)    Come   Tu  mi  vuoi  (Io sarò)    Come   Tu  mi  vuoi  (Io sarò)     Come   Tu  mi  vuoi"},{"id":"come-un-prodigio","numero":40,"title":"Come un Prodigio","sub":"","search":"Come un Prodigio  Intro  Strofa 1    Signore  tu mi scruti e conosci    sai quando   seggo  e quando   mi  alzo    Riesci a vedere  i miei pensieri   sai quando   io cammino    e quando   riposo    Ti sono  note  tutte le mie vie    la mia parola  non  è ancora   sulla lingua    E tu, Signore, già la conosci  tutta  Ritornello    Sei tu che mi  hai creato  e mi hai tessuto  nel seno  di mia madre    Tu  mi hai fatto come   un  prodigio  le tue opere  sono  stupende   e per  questo  ti lodo  Interludio  Strofa 2    Di fronte  e alle spalle tu mi circondi     poni  su me  la tua mano    La tua saggezza,  stupenda   per  me       è troppo   alta e io non  la comprendo    Che  sia in cielo o agli inferi, ci sei non si può mai fuggire dalla tua  presenza    Ovunque    la tua mano   guiderà  la mia  Ritornello    Sei tu che mi  hai creato  e mi hai tessuto  nel seno  di mia madre    Tu  mi hai fatto come   un  prodigio  le tue opere  sono  stupende   e per  questo  ti lodo  Interludio  Strofa 3    E nel segreto  tu mi hai formato   mi  hai intessuto dalla  terra    Neanche   le ossa ti eran nascoste  ancora   informe  mi  hanno   visto i tuoi occhi    I miei giorni erano  fissati quando  ancora   non  ne esisteva  uno    E tutto quanto   era scritto nel tuo libro  Ritornello    Sei tu che mi  hai creato  e mi hai tessuto  nel seno  di mia madre    Tu  mi hai fatto come   un  prodigio  le tue opere  sono  stupende   e per  questo  ti lodo  Interludio  Ritornello finale    Sei tu che mi  hai creato  e mi hai tessuto  nel seno  di mia madre    Tu  mi hai fatto come   un  prodigio  le tue opere  sono  stupende   e per  questo    per questo  ti lodo"},{"id":"con-voce-di-giubilo","numero":41,"title":"Con Voce di Giubilo","sub":"Cento","search":"Con Voce di Giubilo  Ritornello Con   voce   di  giubilo  date   il grande   annuncio,                    fatelo   giungere   ai confini   del  mondo.                    Con    voce   di giubilo  date   il grande   annuncio,                    il Signore   ha  liberato   il suo po    - po  - lo.  Strofa 1 Lodate    il Signore  egli è  buono     Egli ha  fatto  meraviglie,    Alleluia  Strofa 2  Eterna   è  la sua  misericordia     nel  suo  nome     siamo   salvi, alleluia  Strofa 3  La  sua  gloria  riempie    i cieli e la terra     è il Signore  della   Vita, alleluia."},{"id":"cristo-e-risorto-veramente","numero":42,"title":"Cristo è Risorto Veramente","sub":"","search":"Cristo è Risorto Veramente  Ritornello Cristo  è  risorto  veramente,     alleluia!            Gesù,   il vivente,  qui  con   noi resterà.            Cristo  Gesù,      Cristo   Gesù       è il  Signore    della  vita.  Strofa 1    Morte,   dov'è   la tua  vittoria?   Paura      non  mi  puoi   far più.    Se  sulla  croce   io morirò   insieme    a  lui,  poi  insieme    a lui risorgerò.  Strofa 2    Tu,  Signore,    amante    della  vita, mi  hai  creato   per  l'eternità.    La  vita mia   tu dal  sepolcro    strapperai,      con  questo    mio   corpo   ti vedrò.  Strofa 3    Tu  mi  hai  donato   la  tua vita,  io voglio  donar    la mia  a  te.    Fa  che   possa   dire:  \"Cristo  vive  anche    in me\"   e quel   giorno   io risorgerò.  Ritornello finale Cristo  è  risorto veramente,      alleluia!                      Gesù,    il vivente,  qui con   noi  resterà.                      Cristo   Gesù,      Cristo  Gesù       è  il Signore    della   vita."},{"id":"dall-aurora-al-tramonto","numero":43,"title":"Dall'Aurora al Tramonto","sub":"Casucci · Balduzzi","search":"Dall'Aurora al Tramonto  Ritornello Dall'aurora io cerco te fino al tramonto ti chiamo ha sete solo di te l'anima mia come terra deserta  Strofa 1 Non mi fermerò un solo istante sempre canterò la tua lode perché sei il mio Dio il mio riparo mi proteggerai all'ombra delle tue ali  Ritornello Dall'aurora io cerco te fino al tramonto ti chiamo ha sete solo di te l'anima mia come terra deserta  Strofa 2 Non mi fermerò un solo istante io racconterò le tue opere perché sei il mio Dio unico bene nulla mai potrà la notte contro di me  Ritornello finale Dall'aurora io cerco te fino al tramonto ti chiamo ha sete solo di te l'anima mia come terra deserta ha sete solo di te l'anima mia come terra deserta  Finale"},{"id":"davanti-a-questo-amore","numero":44,"title":"Davanti a Questo Amore","sub":"De Luca · Marranzino · Conte","search":"Davanti a Questo Amore  Intro  Strofa Hai   disteso  le tue  braccia   anche   per  me   Gesù, dal  tuo  cuore,   come    fonte,  hai  versato   pace   in me, cerco   ancora   il mio   peccato   ma   non   c'è. Tu  da  sempre    vinci  il mondo     dal  tuo  trono   di dolore.  Ritornello           Dio,   mia  grazia,  mia   speranza,    ricco  e grande    Redentore.           Tu,  Re   umile  e  potente,   risorto   per  amore,    risorgi per  la  vita.            Vero   agnello    senza  macchia,    mite   e forte  Salvatore    sei.           Tu,  Re   povero    e glorioso   risorgi  con  potenza,           davanti    a questo   amore    la  morte   fuggirà.  Finale"},{"id":"del-tuo-spirito-signore","numero":45,"title":"Del Tuo Spirito, Signore","sub":"Gen · Messa Come fuoco vivo","search":"Del Tuo Spirito, Signore  Ritornello Del   tuo  Spirito,     Signore,      È      piena   la    ter   -   ra,      è  piena  la  ter -  ra.   ( 2  v . )  Strofa 1 Benedici    il Signore,  anima     mia  - a    Signore,   Dio,       Tu   sei grande!    Sono   immense,     splendenti    tutte  le tue opere        e tutte  le creature.  Strofa 2 Se togli  il tuo soffio  muore    ogni   cosa     e si dissolve   nella  terra.     Il tuo  spirito  scende:     tutto  si ricrea  e tutto  si rinnova.  Strofa 3 La tua  gloria,  Signore,   resti per  sempre.     Gioisci,  Dio,  del  creato.     Questo    semplice    canto     salga  a te,  Signore:   sei tu la nostra   gioia."},{"id":"devo-dire-che","numero":46,"title":"Devo Dire Che","sub":"","search":"Devo Dire Che  Strofa 1       Devo    dire che,     io non   son  più  io       da  quando    so     qual è  la sola  vera  via       Ma   chissà  perché,      non   so decidermi       c'è qualcosa    in me    che   non  mi   fa muovere  Ritornello            Cosa   fai, cosa  fai? Corri   sempre    dietro  i sogni  tuoi            Tu  non   hai, tu  non   hai l'allegrezza   degli  uccelli  in ciel            Tu  non   hai, tu  non   hai la purezza    che  hanno    i gigli al sol            Ora   sai, ora  sai che  la gioia  non   si può   comprar  Strofa 2       Devo    dire che,  proprio    non   lo so       Se riuscirò  a  buttar  via  quest'abito       Per  poi  fondermi    nel  grande    regno   di Dio       come    i passeri avere   il pane   da  Lui  Ritornello            Ma   perché,   ma   perché,   dove    vedi  la difficoltà?            Come    se,  come   se  non   avessi  piena   libertà            Cosa   c'è, cosa  c'è che   lasciare  perdere   non   puoi?            Tutto  qua,   tutto  qua   di più  facile da  far  non  c'è"},{"id":"dolce-sentire","numero":47,"title":"Dolce Sentire","sub":"","search":"Dolce Sentire  Strofa 1 Dolce   sentire     come    nel  mio   cuore, Or   - a  umil    - mente      sta nascendo     amore. Dolce   capire      che  non   son  più  solo ma   che  son    par  - te    di un'immensa      vita, che  ge  - ne  -  ro -  sa    risplende   intorno    a me: Do   - no   di   Lu -  i      e  del suo   immenso     amore.  Strofa 2                   Ci  ha  dato   il cielo    e  le  chiare   stelle,                   Fra  -  tel - lo     so  -  le     e  sorella    luna;                   la     madre    terra  con  frutti, prati  e fiori,                   il      fuo  - co  , il ven  - to,   l'aria e l'acqua   pura                   Fon   - te      di     vi  -  ta     per  le sue  creature,                   Do   -  no  di   Lu  - i       e del  suo  immenso     amore.                   Do   -  no  di   Lu  - i       e del  suo  immenso     amore."},{"id":"dove-troveremo-tutto-il-pane","numero":48,"title":"Dove Troveremo Tutto il Pane","sub":"","search":"Dove Troveremo Tutto il Pane  Ritornello         Dove    troveremo     tutto  il pane        Per  sfamare   tanta   gente         Dove    troveremo     tutto  il pane        Se non   abbiamo     niente  Strofa 1   Io  possiedo    solo  cinque   pani             Io possiedo    solo   due  pesci   Io  possiedo    un  soldo   soltanto            Io  non   possiedo    niente  Ritornello (ripetere)  Strofa 2   Io  so suonare    la chitarra                    Io  so dipingere,    fare  poesie,   Io  so scrivere   e penso    molto               Io  non   so fare  niente  Ritornello (ripetere)  Strofa 3   Io  sono   un  tipo  molto    bello               Io sono   intelligente   Io  sono   molto   furbo                          Io non   sono   niente  Ritornello finale         Dio  ci ha  dato   tutto  il pane         Per sfamare    tanta   gente         Dio  ci ha  dato   tutto  il pane         Anche   se  non   abbiamo     niente         Anche    se non   abbiamo     niente"},{"id":"e-bello-lodarti","numero":49,"title":"È Bello Lodarti","sub":"Gen Verde","search":"È Bello Lodarti  Ritornello È bello   cantare   il tuo amore,       è  bello  lodare   il tuo  nome.       È bello   cantare    il tuo amore,       è  bello  lodarti,  Signore,       è  bello  cantare   a Te!  Strofa 1 Tu  che  sei l'amore    infinito  che  neppure    il cielo può   contenere,    ti sei fatto uomo,     Tu  sei venuto    qui  ad  abitare  in  mezzo    a noi,  allora...  Strofa 2 Tu  che  conti  tutte  le stelle e  le chiami   una   ad  una  per  nome,    da  mille  sentieri  ci hai radunati    qui, ci hai  chiamati    figli tuoi, allora..."},{"id":"e-sono-solo-un-uomo-symbolum-79","numero":50,"title":"E Sono Solo un Uomo","sub":"Sequeri · Symbolum '79","search":"E Sono Solo un Uomo Symbolum '79 Strofa 1 Io lo so, Signore,  che vengo   da lontano:   prima  nel pensiero  e poi  nella tua mano. Io mi  rendo  conto  che  tu sei la mia vita e non  mi  sembra   vero di pregarti  così. Padre  d'ogni  uomo   e non   ti ho visto mai; Spirito di vita e nacqui  da  una donna; figlio e mio  fratello e sono  solo un  uomo,   eppure  io capisco  che  tu sei verità...  Ritornello 1                 E imparerò   a guardare  tutto  il mondo                 con gli occhi trasparenti  di un bambino,                 e insegnerò  a chiamarti:  \"Padre  nostro\"                 ad ogni  figlio che diventa   uomo  Strofa 2 Io lo so, Signore,  che tu mi  sei vicino, luce alla mia mente,   guida  al mio  cammino, mano   che  sorregge,  sguardo  che  perdona   e non  mi  sembra  vero  che  tu esista così. Dove   nasce  amore,  Tu  sei la sorgente; dove   c'è una croce,  Tu sei la speranza; dove   il tempo  ha fine, Tu  sei Vita Eterna e so che  posso  sempre   contare  su di Te...  Ritornello 2                 E accoglierò  la vita come  un  dono                 e avrò il coraggio  di morire  anch'io                 e incontro  a te verrò  col mio  fratello                 che non  si sente amato          da nessuno."},{"id":"ecco-il-nostro-si","numero":51,"title":"Ecco il Nostro Sì","sub":"","search":"Ecco il Nostro Sì  Strofa 1 Fra  tutte le  donne    scelta in  Nazareth,          sul tuo  volto   risplende     il coraggio   di  quando    hai  detto   \"Sì\".       Insegna    a questo   cuore   l'umiltà,          il silenzio d'amore,        la Speranza     nel figlio  tuo  Gesù  Ritornello Ecco   il nostro  Sì,  nuova    luce che   rischiara  il giorno,               è  bellissimo   regalare   al mondo     la Speranza.               Ecco   il nostro  Sì,  camminiamo       insieme    a te Maria,               Madre     di Gesù,   madre    dell'umanità  Strofa 2 Nella   tua  casa  il verbo  si rivelò     nel  segreto   del  cuore   il respiro  del figlio  Emmanuel.     Insegna   a  queste   mani   la fedeltà,     a costruire   la pace,   una  Casa   Comune      insieme   a  te.  Strofa 3 Donna     dei nostri  giorni   sostienici,     guida   il nostro  cammino      con   la forza  di quando     hai  detto  \"Sì\".     Insegnaci   ad  accogliere    Gesù,     noi  saremo    dimora,    la più  bella  poesia   dell'anima."},{"id":"ecco-quel-che-abbiamo","numero":52,"title":"Ecco Quel Che Abbiamo","sub":"Gen Verde","search":"Ecco Quel Che Abbiamo  Ritornello Ecco   quel  che  abbiamo     nulla  ci appartiene     ormai       ecco   i frutti della  terra  che  tu moltiplicherai.       Ecco   queste   mani,   puoi   usarle  se lo  vuoi       per  dividere    nel mondo      il pane  che  tu  hai  dato  a  noi  Strofa 1 Solo  una   goccia   hai messo    fra le mani   mie     solo   una  goccia   che  tu  ora  chiedi  a me,   na,  na,  na…    una  goccia   che,  in mano     a Te,  una  pioggia    diventerà   e  la terra  feconderà  Strofa 2 Le  nostre   gocce,   pioggia   fra le mani   tue,     saranno    linfa  di una   nuova    civiltà, na,  na, na…     e la terra  preparerà        la festa  del  pane   che  ogni  uomo     condividerà  Ritornello e finale                           Sulle  strade,  il vento   da  lontano    porterà                           il profumo     del frumento,     che  tutti avvolgerà.                           E sarà  l'amore    che  il raccolto  spartirà                           e il miracolo    del  pane   in terra  si ripeterà"},{"id":"eccomi-salmo-39","numero":53,"title":"Eccomi","sub":"Frisina · Salmo 39","search":"Eccomi Salmo 39 Intro  Ritornello Eccomi,      ecco  - mi!    Si  -   gnore   io  ve   -  ngo.       Eccomi,         ecco  - mi!     si compia    in me   la tua   vo   -   lontà.  Strofa 1 Nel  mio   Signore   ho  sperato,   e  su di  me  s'è  chinato,        ha  dato  ascolto   al mio   gri  -  do,       m'ha   liberato   dalla  mo    -  rte.  Strofa 2 I miei  piedi  ha  reso  saldi, sicuri  ha reso   i miei  passi.        Ha  messo    sulla mia   bocca   un  nuovo    canto   di  lode.  Strofa 3 Il sacrificio non   gradisci,  ma   m'hai   aperto   l'orecchio,        non   hai voluto    olocausti,   allora  ho  detto:   io vengo!  Strofa 4 Sul tuo  libro  di me   è  scritto: si compia    il tuo  volere.        Questo    mio   Dio,  desidero,   la  tua  legge  è nel  mio   cuore.  Strofa 5 La tua  giustizia  ho  proclamato,      non   tengo   chiuse  le labbra.        Non   rifiutarmi,   Signore,   la tua  misericordia."},{"id":"emmanuel","numero":54,"title":"Emmanuel","sub":"","search":"Emmanuel  Strofa 1 Dall'orizzonte    una   grande    luce  viaggia  nella  storia        e lungo   gli anni  ha  vinto   il buio  facendosi   Memoria,        e illuminando     la nostra   vita  chiaro  ci rivela        che  non   si vive  se non   si cerca  la Verità...  Strofa 2 Un  grande    dono    che  Dio  ci ha  fatto  è Cristo   il suo Figlio,        e l'umanità    è rinnovata, è     in Lui salvata.        È vero   uomo,    è vero   Dio,  è  il Pane  della  Vita,        che  ad  ogni  uomo     ai suoi  fratelli ridonerà.  Ritornello Siamo    qui       sotto  la stessa  luce        sotto  la sua  croce   cantando    ad  una   voce.        È l'Emmanuel      Emmanuel,      Emmanuel.        È l'Emmanuel,      Emmanuel.  Strofa 3 La morte    è uccisa,  la vita  ha  vinto,  è  Pasqua   in  tutto  il mondo,        un  vento   soffia  in ogni  uomo     lo Spirito  fecondo.        Che  porta   avanti   nella  storia  la Chiesa   sua  sposa,        sotto  lo sguardo    di  Maria,   Comunità.  Strofa 4 Dalla  città di  chi ha  versato   il sangue   per  amore        ed  ha  cambiato    il vecchio   mondo     vogliamo     ripartire.        Seguendo     Cristo,  insieme   a  Pietro,  rinasce  in  noi  la fede,        Parola   viva  che  ci rinnova    e cresce  in noi.  Strofa 5 Noi  debitori   del  passato   di  secoli di  storia,        di vite date   per  amore,    di santi  che  han   creduto,        di uomini    che  ad  alta quota    insegnano    a  volare,        di chi la  storia sa  cambiare,    come    Gesù.  Strofa 6 È giunta   un'era   di primavera,     è tempo    di cambiare.        È oggi  il giorno   sempre    nuovo    per  ricominciare,        per  dare  svolte,  parole   nuove    e  convertire    il cuore,        per  dire al  mondo,     ad  ogni  uomo:     Signore   Gesù."},{"id":"fammi-conoscere","numero":55,"title":"Fammi Conoscere","sub":"Ruaro","search":"Fammi Conoscere  Ritornello Fammi     conoscere     la tua    volontà       parla   ti ascolto  Signore!       La  mia   felicità è fare  il tuo volere:       porterò    con   me  la  tua Parola.  Strofa 1 Lampada     ai miei  passi  è  la tua  Parola   luce sul  mio   cammino.        Ogni   giorno   la mia   volontà    trova  una   guida   in te.  Strofa 2 Porterò   con   me  i tuoi  insegnamenti:     danno     al mio   cuore  gioia!        La tua  Parola   è fonte   di luce:  dona    saggezza   ai  semplici.  Strofa 3 La mia   bocca   impari   la tua  lode   sempre    ti renda  grazie.        Ogni   momento      canti  la tua  lode   la mia  speranza    è  in te."},{"id":"frutto-della-nostra-terra","numero":56,"title":"Frutto della Nostra Terra","sub":"Buttazzo","search":"Frutto della Nostra Terra  Intro  Strofa 1    Frutto  della nostra  terra, del lavoro  di ogni  uomo:    pane  della  nostra vita, cibo  della quotidianità.    Tu che  lo prendevi   un giorno,  lo spezzavi   per i tuoi,    oggi  vieni in questo  pane,  cibo  vero  dell'umanità.  Ritornello                  E sarò  pane,  e sarò  vino nella mia  vita, nelle tue mani.                  Ti accoglierò   dentro  di me,  farò di me  un'offerta  viva,                  un  sacrificio       gradito  a Te.  Strofa 2    Frutto  della nostra  terra, del lavoro  di ogni  uomo:    vino delle  nostre  vigne, sulla mensa   dei  fratelli tuoi    Tu che  lo prendevi   un giorno,  lo bevevi   con  i tuoi,    oggi  vieni in questo  vino  e ti doni per  la vita mia  Ritornello finale                  E sarò  pane,  e sarò  vino nella mia  vita, nelle tue mani.                  Ti accoglierò   dentro  di me,  farò di me  un'offerta  viva,                  un  sacrificio       gradito  a Te.                  un  sacrificio       gradito  a Te."},{"id":"giovane-donna","numero":57,"title":"Giovane Donna","sub":"Scaglianti","search":"Giovane Donna  Strofa 1 Giovane    Donna,     attesa  dell'umanità,       un  desiderio    d'amore    e pura   libertà       Il Dio  lontano    è qui  vicino   a Te,       voce   e silenzio   annuncio    di novità  Ritornello                      A         -      ve           Mari         -     a  Ritornello (ripetere)                      A         -      ve           Mari         -     a  Strofa 2 Dio   t'ha prescelta   qual  madre    piena   di  bellezza       ed  ora  il suo  amore    t'avvolgerà    con  la sua  ombra       Grembo     per  Dio   venuto    sulla terra       Tu  sarai madre    di  un  uomo    nuovo  Strofa 3 Ecco   l'ancella  che  vive  della  sua  parola       libero  il cuore  perché    l'amore   trovi  casa       Ora   l'attesa è densa   di preghiera       e l'uomo    nuovo    è qui  in mezzo    a noi"},{"id":"giovanni","numero":58,"title":"Giovanni","sub":"","search":"Giovanni  Intro  Strofa 1             Voce   di uno   che  grida   nel deserto    :               \"Convertitevi,     il Regno   è  qui.               Preparate    la   via     del   Signore,               raddrizzate     i suoi sentie       -  ri\".  Ritornello Alle  -  luja, allelu  - ja,                   viene   il Signore,  allelu    -  ja.                   preparate    una   strada  nel  deserto,                   per  il Signore   che   vie  -  e  -    ne.  Strofa 2             E  venne   un  uomo     e il suo  nome    era  Giovanni,                 lui testimone    della  luce  di Dio;                 come    una  lampada     che  rischiara  il buio,                 egli arde   nell'oscurità.  Strofa 3             Ecco   io mando     il mio  messaggero                 dinanzi   a me,   per  prepararmi     la via,                 per  ricondurre    i padri  verso   i figli,                 con  lo  spirito di  Elia."},{"id":"signore-pieta-buttazzo","numero":59,"title":"Signore Pietà","sub":"Buttazzo","search":"Signore Pietà Buttazzo Intro  Invocazione 1        Signore,    pietà  di     noi.          (x2)  Invocazione 2                                                 Cristo,   pietà  di  noi.                                                 Cristo,   pietà  di  noi.  Invocazione 3        Signore    pietà,  Signore    pietà,        Signore    pietà       di     noi.  Finale        Signore    pietà,  Signore    pietà,        Signore      pietà        di    noi."},{"id":"signore-pieta-versione-2","numero":60,"title":"Signore Pietà","sub":"Buttazzo · Versione 2","search":"Signore Pietà Buttazzo Versione 2 Intro Invocazione 1 Signore, che sei venuto a perdonare, abbi pietà di noi, abbi pietà di noi. Signore pietà, Signore pietà. Invocazione 2 Cristo, che fai festa per chi ritorna a te, abbi pietà di noi, abbi pietà di noi. Cristo pietà, Cristo pietà. Invocazione 3 Signore, che perdoni molto a chi molto ama, abbi pietà di noi, abbi pietà di noi. Signore pietà, Signore pietà."},{"id":"signore-pieta-ricci-la-tua-dimora","numero":166,"title":"Signore Pietà","sub":"Daniele Ricci · La tua dimora","search":"Signore Pietà Daniele Ricci La tua dimora Signore che non sei venuto a condannare ma a perdonare Cristo che fai festa per ogni peccatore pentito Signore che perdoni molto a chi molto ama"},{"id":"gloria-buttazzo","numero":61,"title":"Gloria","sub":"Buttazzo","search":"Gloria Buttazzo Intro  Ritornello Gloria a Dio  nell'alto dei cieli      pace  in terra agli uomini.         Gloria a  Dio nell'alto dei cieli     pace  in terra agli uomini.  Strofa 1    Ti   lodiamo,   Ti benediciamo,       Ti adoriamo,   Ti glorifichiamo.    Ti rendiamo   gra  -  zie     per la Tua  gloria immensa       RIT.  Strofa 2    Signore  Dio, Re  del cielo Dio  Padre  onnipotente.    Gesù  cristo, Agnello  di Dio, tu figlio del Padre   RIT.  Strofa 3    Tu che  togli i peccati del mondo    la nostra supplica  ascolta, Signore    Tu che  siedi alla destra del Padre  abbi  pietà di noi.  RIT.  Strofa 4    Tu solo  il Santo, Tu solo  il Signore, Tu, l'Altissimo Gesù  Cristo    con  lo Spirito Santo nella  gloria del Padre.  RIT.  Finale Gloria  a Dio  nell'alto dei cieli      pace  in terra agli uomini.    Gloria a Dio  nell'alto dei cieli     pace  in terra agli uomini.  Outro"},{"id":"gloria-giombini","numero":161,"title":"Gloria","sub":"Giombini","search":"Gloria Giombini Ritornello Gloria a Dio nell'alto dei cieli e pace in terra agli uomini di buona volontà. Strofa Noi ti lodiamo, ti benediciamo, ti adoriamo, ti glorifichiamo, ti rendiamo grazie per la tua gloria immensa. Recitato Signore Dio, Re del cielo, Dio Padre onnipotente. Signore, Figlio unigenito, Gesù Cristo, Signore Dio agnello di Dio, Figlio del Padre, tu che togli i peccati del mondo, accogli la nostra supplica; tu che siedi alla destra del Padre, abbi pietà di noi. Ritornello Gloria a Dio nell'alto dei cieli e pace in terra agli uomini di buona volontà. Finale Perché tu solo il Santo, tu solo il Signore, tu solo l'Altissimo, Gesù Cristo. Con lo Spirito Santo nella gloria di Dio Padre. Amen."},{"id":"gloria-a-dio-ricci-la-tua-dimora","numero":164,"title":"Gloria a Dio","sub":"Daniele Ricci · La tua dimora","search":"Gloria a Dio Daniele Ricci La tua dimora Ritornello Gloria a Dio nell'alto dei cieli pace in terra agli uomini di buona volontà. Strofa 1 Noi ti lodiamo ti benediciamo ti adoriamo ti glorifichiamo ti rendiamo grazie per la tua gloria immensa Signore Dio Re del cielo Dio Padre onnipotente. Strofa 2 Signore Figlio unigenito Gesù Cristo Signore Dio Agnello di Dio Figlio del Padre tu che togli i peccati del mondo abbi pietà di noi accogli la nostra supplica tu che siedi alla destra del Padre abbi pietà di noi. Finale Perché tu solo il Santo tu solo il Signore tu solo l'Altissimo Gesù Cristo con lo Spirito Santo nella gloria di Dio Padre Amen."},{"id":"gloria-gen-verde","numero":62,"title":"Gloria","sub":"Gen Verde","search":"Gloria Gen Verde Intro  Ritornello    Gloria, gloria a Dio.       Gloria, gloria nell'alto dei  cieli.    Pace in terra agli uomini     di buona  volontà.          Gloria!  Strofa 1           Noi   ti lodiamo,  ti benediciamo,           ti adoriamo,   glorifichiamo   te,           ti rendiamo   grazie  per la tua immensa    gloria.           Signore  Dio,  gloria!          Re del  cielo,  gloria!           Dio  Padre,  Dio  onnipotente,   gloria!  Richiamo al ritornello    Gloria…  Strofa 2           Signore,  Figlio unigenito,  Gesù  Cristo,           Signore,  Agnello   di Dio, Figlio del Padre.           Tu  che  togli i peccati del mondo,   abbi  pietà di noi;           tu  che togli i peccati del mondo,   accogli  la nostra supplica;           tu  che siedi alla destra del Padre,  abbi pietà  di noi.  Richiamo al ritornello    Gloria…  Strofa 3           Perché   tu solo il Santo, il Signore,           tu  solo l'Altissimo, Cristo Gesù           con  lo Spirito Santo  nella gloria del  Padre.  Ritornello finale    Gloria…"},{"id":"gloria-a-te-parola-vivente","numero":63,"title":"Gloria a Te, Parola Vivente","sub":"","search":"Gloria a Te, Parola Vivente  Ritornello    Gloria   a Te,  Parola   vivente    Verbo   di  Dio  gloria  a  Te,    Cristo  mae     -   stro, Cristo  Signo    -   re!  Strofa 1    Tu  solo  hai  parole   di vita  per  noi.    Beato   colui  che  ti ascolta,  Signore,   perché    vivrà.   Rit.  Strofa 2    Tu  solo  hai  proposte    di amore     per  noi.    Beato   colui  che  le accoglie,   Signore,   perché    vivrà.  Rit.  Strofa 3    Tu  solo  sei via  alla vita  per  noi.    Beato   colui  che  in te  spera,  Signore,   perché    vivrà.  Rit.  Strofa 4    Tu  solo  dischiudi   l'eterno   per  noi.    Beato   colui  che  in te  spera,  Signore,   perché    vivrà.  Rit."},{"id":"grandi-cose","numero":64,"title":"Grandi Cose","sub":"Gen Rosso","search":"Grandi Cose  Ritornello                   Grandi    cose  ha  fatto  il Signore   per  noi                   Ha   fatto  germogliare     i fiori fra le rocce                   Grandi    cose  ha  fatto  il Signore   per  noi                   Ci  ha  riportati  liberi alla  nostra  terra                   Ed  ora   possiamo    cantare,   possiamo     gridare                   L'amore    che  Dio   ha  versato   su  noi  Strofa 1        Tu che  sai strappare    dalla  morte,        hai sollevato    il nostro  viso  dalla  polvere        Tu che  hai  sentito  il nostro   pianto        Nel  nostro   cuore   hai  messo   un  seme    di felicità  Ripetere il ritornello"},{"id":"ho-abbandonato","numero":65,"title":"Ho Abbandonato","sub":"","search":"Ho Abbandonato  Ritornello 1                Ho   abbandonato                dietro  di me                Ogni   paura   ogni   dubbio    perché                Una   grande    gioia           mi  sento   in cuor                Se  penso   a quanto    è buono    il mio   Signor  Strofa 1         Ha  fatto  i cieli sopra   di me         Ha  fatto  il sole, il mare   i fior         Ma   il più bel  dono    che  mi  ha  fatto  il mio  Signor         È stata la  vita ed  il suo  amor  Ritornello 2                Ho   abbandonato       dietro   di me                Ogni   tristezza   ogni  dolor                E  credo   ancora   in un   mondo     che                Sarà  diverso   a causa   del  suo  amor  Strofa 2         Se  poi  un  giorno   mi  chiamerà         Un   lungo   viaggio   io farò         Per  monti   e  valli allor a  tutti io dirò         Sappiate    che  è buono    il mio  signor  Ritornello finale                Ho   abbandonato       dietro  di  me                Ogni   paura   ogni   dubbio    perché                Una   grande    gioia  mi  sento   in cuor                Se  penso   a quanto    è buono    il mio   Signor"},{"id":"il-canto-dei-3-giovani","numero":66,"title":"Il Canto dei 3 Giovani","sub":"Marranzino · De Luca","search":"Il Canto dei 3 Giovani  Strofa 1 Noi  ti lodiamo    Signor,   a Te  la lode  e la gloria per  sempre noi  lodiamo    il tuo nome,   a Te  la lode  e la gloria  per  sempre.  Ritornello Noi  loderemo     il Signor, canteremo     il suo amor,   che durerà   per  sempre. Noi  loderemo     il Signor, canteremo     il suo amor,   che durerà   per  sempre.  Strofa 2 Astri del  cielo lodate   il Signore, a Lui  l'onore  e la gloria  per  sempre. Acque   del  cielo lodate   il Signore, a Lui  l'onore  e la gloria  per  sempre.  Ritornello Noi  loderemo     il Signor, canteremo     il suo amor,   che durerà   per  sempre. Noi  loderemo     il Signor, canteremo     il suo amor,   che durerà   per  sempre.  Strofa 3 Sole  e luna  lodate  il Signore,  a Lui l'onore   e la gloria  per sempre. Piogge   e rugiade   lodate  il Signore,  a Lui l'onore   e la gloria per  sempre.  Ritornello Noi  loderemo     il Signor, canteremo     il suo amor,   che durerà   per  sempre. Noi  loderemo     il Signor, canteremo     il suo amor,   che durerà   per  sempre.  Cambio di tonalità - 1 battuta  Strofa 4 O  venti  tutti   lodate   il Signore, a Lui  l'onore  e la gloria  per  sempre. Fuoco   e calore   lodate  il Signore,  a Lui l'onore   e la gloria per  sempre.  Ritornello Noi  loderemo     il Signor, canteremo     il suo amor,   che durerà   per  sempre. Noi  loderemo     il Signor, canteremo     il suo amor,   che durerà   per  sempre.  Strofa 5 Notte   e giorno   lodate  il Signore,  a Lui l'onore   e la gloria per  sempre. Nuvole    e lampi  lodate   il Signore,  a Lui l'onore  e  la gloria per  sempre.  Ritornello Noi  loderemo     il Signor, canteremo     il suo amor,   che durerà   per  sempre. Noi  loderemo     il Signor, canteremo     il suo amor,   che durerà   per  sempre.  Strofa 6 Uomini    tutti   lodate  il Signore,  a Lui  l'onore  e la gloria  per sempre. Tutta  la terra  dia lode  al Signore,  a  Lui l'onore  e  la gloria per  sempre.  Ritornello Noi  loderemo     il Signor, canteremo  prode   in guerra,   si chiama    Signore    travolse   nel mare    gli eserciti    i carri d'Egitto   sommerse     nel  mar   Rosso    abissi profondi    li coprono    la Tua   destra  Signore   si è innalzata    la Tua   potenza    è terribile.  Strofa 3    Si accumularon      le acque   al Tuo   soffio    s'alzaron   le onde   come    un  argine    si raggelaron    gli abissi in fondo    al mare    chi è  come   Te  o  Signore    guidasti  con   forza  il popolo    redento    e lo conducesti     verso  Sion."},{"id":"il-disegno","numero":69,"title":"Il Disegno","sub":"Marani","search":"Il Disegno  Strofa 1 Nel  mare   del  silenzio   una  voce   si alzò    da  una  notte   senza   confini  una   luce  brillò    dove   non   c'era  niente  quel   giorno.  Ritornello Avevi    scritto già  il mio  nome    lassù  nel  cielo       avevi   scritto  già la mia   vita  insieme   a te       avevi   scritto  già di  me.  Strofa 2 E quando     la tua  mente    fece  splendere    le stelle    e quando     le tue  mani   modellarono      la terra    dove   non   c'era  niente  quel   giorno.  Strofa 3 E quando     hai  calcolato   la profondità    del  cielo    e quando     hai colorato    ogni   fiore della  terra    dove   non   c'era  niente  quel   giorno.  Strofa 4 E quando     hai  disegnato    le nubi  e le  montagne    e quando     hai disegnato    il cammino      di ogni  uomo    l'avevi  fatto  anche   per  me.  Ritornello finale Se  ieri non   sapevo    oggi  ho  incontrato    te                    e  la mia  libertà  è  il tuo disegno    su di  me                    non   cercherò    più  niente   perché   tu  mi  salverai."},{"id":"il-giovane-ricco","numero":70,"title":"Il Giovane Ricco","sub":"","search":"Il Giovane Ricco  Strofa 1        Lui stava   parlando        seduto    sopra   i gradini        Di quella   casa  bianca       in  mezzo    a tanti  bambini        Erano   tutti sudati        Pietro   cercava   da  bere        C'erano   anche    i soldati
